<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Contact — Channels</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-slate-50 text-slate-800" data-area="channels" data-default="numbers">
<div id="app"></div>
<template id="area-main"><main class="p-6">

<!-- ===== Voice numbers (list) ===== -->
<section class="view active" data-view="numbers">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="numbersTitle">Voice numbers</h1>
    <p class="text-sm text-slate-500" data-i18n="numbersSubtitle">DID numbers and where they route</p></div>
    <button onclick="newNumber()" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i><span data-i18n="numbersNew">New number</span></button>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden max-w-5xl">
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">Number</th><th class="font-normal px-4 py-2.5">Label</th>
        <th class="font-normal px-4 py-2.5">Routes to</th><th class="font-normal px-4 py-2.5">SIP trunk</th>
        <th class="font-normal px-4 py-2.5">Status</th><th class="px-4 py-2.5"></th>
      </tr></thead>
      <tbody id="numbers-body"></tbody>
    </table></div>
  </div>
</section>

<!-- ===== Number form ===== -->
<section class="view" data-view="number-form">
  <button onclick="showView('numbers')" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-teal-700 mb-3"><i class="ti ti-arrow-left"></i><span data-i18n="btnBack">Back</span></button>
  <h1 id="nf-heading" class="text-xl font-semibold mb-5">New number</h1>
  <div class="bg-white border border-slate-200 rounded-xl p-5 max-w-2xl">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div><label class="fld">Number (E.164)</label><input id="nf-num" class="inp" placeholder="+66 2 …"></div>
      <div><label class="fld">Label</label><input id="nf-label" class="inp" placeholder="Main hotline"></div>
      <div><label class="fld">Route to</label><select class="inp"><option>IVR: Main menu</option><option>Queue: General Support</option><option>Queue: Sales (TH)</option><option>Queue: VIP Customers</option></select></div>
      <div><label class="fld">SIP trunk</label><select class="inp"><option>NT SIP-01</option><option>AIS SIP-02</option></select></div>
    </div>
    <div class="flex gap-3 mt-5 max-w-xs">
      <button onclick="saveNumber()" class="flex-1 h-10 rounded-lg bg-teal-700 text-white text-sm font-medium hover:bg-teal-800" data-i18n="btnSave">Save</button>
      <button onclick="showView('numbers')" class="flex-1 h-10 rounded-lg border border-slate-300 text-sm hover:bg-slate-50" data-i18n="btnCancel">Cancel</button>
    </div>
  </div>
</section>

<!-- ===== Web chat ===== -->
<section class="view" data-view="webchat">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="webchatTitle">Web chat widgets</h1>
    <p class="text-sm text-slate-500" data-i18n="webchatSubtitle">Embeddable chat for your websites</p></div>
    <button onclick="toast('Widget created (mock)')" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i><span data-i18n="webchatNew">New widget</span></button>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 max-w-5xl">
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <div class="flex items-center justify-between mb-3"><h2 class="font-semibold">acme.co.th — Support</h2><span class="st st-available">Active</span></div>
      <dl class="text-sm space-y-2 text-slate-600 mb-4">
        <div class="flex justify-between"><dt>Queue</dt><dd class="font-medium text-slate-800">General Support</dd></div>
        <div class="flex justify-between"><dt>Pre-chat form</dt><dd>name + email</dd></div>
        <div class="flex justify-between"><dt>Today</dt><dd>128 chats · avg wait 9s</dd></div>
      </dl>
      <label class="fld">Embed snippet</label>
      <pre class="text-xs bg-slate-900 text-slate-200 rounded-lg p-3 overflow-x-auto">&lt;script src="https://cdn.d-contact.io/w.js"
  data-widget="acme-support"&gt;&lt;/script&gt;</pre>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <div class="flex items-center justify-between mb-3"><h2 class="font-semibold">store.acme.co.th — Sales</h2><span class="st st-offline">Draft</span></div>
      <dl class="text-sm space-y-2 text-slate-600">
        <div class="flex justify-between"><dt>Queue</dt><dd class="font-medium text-slate-800">Sales (TH)</dd></div>
        <div class="flex justify-between"><dt>Pre-chat form</dt><dd>ไม่ใช้ (guest)</dd></div>
        <div class="flex justify-between"><dt>Bot deflection</dt><dd>FAQ bot ก่อนเข้าคิว (Phase ถัดไป)</dd></div>
      </dl>
    </div>
  </div>
</section>

<!-- ===== Social ===== -->
<section class="view" data-view="social">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="socialTitle">Social accounts</h1>
    <p class="text-sm text-slate-500" data-i18n="socialSubtitle">LINE OA, Facebook Messenger and WhatsApp Business</p></div>
    <button onclick="toast('Connect flow opened (mock)')" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plug"></i>Connect account</button>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 max-w-6xl">
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <div class="flex items-center gap-3 mb-3"><span class="ch ch-line" style="width:38px;height:38px;justify-content:center;padding:0"><i class="ti ti-brand-line text-xl"></i></span>
      <div><p class="font-semibold">@acme-support</p><p class="text-xs text-slate-400">LINE Official Account</p></div>
      <span class="st st-available ml-auto">Connected</span></div>
      <dl class="text-sm space-y-1.5 text-slate-600">
        <div class="flex justify-between"><dt>Queue</dt><dd class="font-medium text-slate-800">Sales (TH)</dd></div>
        <div class="flex justify-between"><dt>Webhook</dt><dd class="text-emerald-600">healthy · 42ms</dd></div>
        <div class="flex justify-between"><dt>Today</dt><dd>86 messages</dd></div>
      </dl>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <div class="flex items-center gap-3 mb-3"><span class="ch ch-facebook" style="width:38px;height:38px;justify-content:center;padding:0"><i class="ti ti-brand-messenger text-xl"></i></span>
      <div><p class="font-semibold">ACME Thailand</p><p class="text-xs text-slate-400">Facebook Page</p></div>
      <span class="st st-available ml-auto">Connected</span></div>
      <dl class="text-sm space-y-1.5 text-slate-600">
        <div class="flex justify-between"><dt>Queue</dt><dd class="font-medium text-slate-800">Billing Inquiries</dd></div>
        <div class="flex justify-between"><dt>Webhook</dt><dd class="text-emerald-600">healthy · 65ms</dd></div>
        <div class="flex justify-between"><dt>Today</dt><dd>34 messages</dd></div>
      </dl>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <div class="flex items-center gap-3 mb-3"><span class="ch ch-whatsapp" style="width:38px;height:38px;justify-content:center;padding:0"><i class="ti ti-brand-whatsapp text-xl"></i></span>
      <div><p class="font-semibold">+66 2 123 4500</p><p class="text-xs text-slate-400">WhatsApp Business (Meta Cloud API)</p></div>
      <span class="st st-acw ml-auto">Pending review</span></div>
      <dl class="text-sm space-y-1.5 text-slate-600">
        <div class="flex justify-between"><dt>Queue</dt><dd class="font-medium text-slate-800">VIP Customers</dd></div>
        <div class="flex justify-between"><dt>Templates</dt><dd>2 approved / 1 pending</dd></div>
        <div class="flex justify-between"><dt>Conversation cost</dt><dd>~฿0.85 / conversation</dd></div>
      </dl>
    </div>
  </div>
</section>

<!-- ===== Email ===== -->
<section class="view" data-view="email">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="emailTitle">Email mailboxes</h1>
    <p class="text-sm text-slate-500" data-i18n="emailSubtitle">Mailboxes converted into queue interactions</p></div>
    <button onclick="toast('Mailbox added (mock)')" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i><span data-i18n="btnNew">New</span></button>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden max-w-4xl">
    <table class="w-full text-sm">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">Mailbox</th><th class="font-normal px-4 py-2.5">Queue</th>
        <th class="font-normal px-4 py-2.5">Protocol</th><th class="font-normal px-4 py-2.5">SLA</th>
        <th class="font-normal px-4 py-2.5">Status</th><th class="px-4 py-2.5"></th>
      </tr></thead>
      <tbody>
        <tr class="border-b border-slate-100 hover:bg-slate-50"><td class="px-4 py-3 font-medium">support@acme.co.th</td><td class="px-4 py-3 text-slate-600">General Support</td><td class="px-4 py-3 text-slate-600">IMAP + SMTP</td><td class="px-4 py-3 text-slate-600">4 hours</td><td class="px-4 py-3"><span class="st st-available">Syncing</span></td><td class="px-4 py-3 text-right"><span class="icon-btn"><i class="ti ti-pencil"></i></span></td></tr>
        <tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium">billing@acme.co.th</td><td class="px-4 py-3 text-slate-600">Billing Inquiries</td><td class="px-4 py-3 text-slate-600">IMAP + SMTP</td><td class="px-4 py-3 text-slate-600">8 hours</td><td class="px-4 py-3"><span class="st st-available">Syncing</span></td><td class="px-4 py-3 text-right"><span class="icon-btn"><i class="ti ti-pencil"></i></span></td></tr>
      </tbody>
    </table>
  </div>
</section>

</main></template>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
