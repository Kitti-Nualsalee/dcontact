<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Contact — History</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-slate-50 text-slate-800" data-area="history" data-default="interactions">
<div id="app"></div>
<template id="area-main"><main class="p-6">

<!-- ===== Interactions ===== -->
<section class="view active" data-view="interactions">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="interTitle">Interactions</h1>
    <p class="text-sm text-slate-500" data-i18n="interSubtitle">Every call, chat and email across the tenant</p></div>
    <button onclick="toast('Exported CSV (mock)')" class="inline-flex items-center gap-1.5 text-sm border border-slate-300 rounded-lg px-3.5 py-2 hover:bg-slate-50"><i class="ti ti-download"></i>Export</button>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl p-3 mb-4 flex flex-wrap items-center gap-2">
    <select class="inp !h-9 !w-auto text-sm"><option>ทุก channel</option><option>voice</option><option>webchat</option><option>line</option><option>facebook</option><option>whatsapp</option><option>email</option></select>
    <select class="inp !h-9 !w-auto text-sm"><option>ทุกคิว</option><option>General Support</option><option>Sales (TH)</option><option>Technical Support</option><option>VIP Customers</option><option>Billing Inquiries</option></select>
    <select class="inp !h-9 !w-auto text-sm"><option>ทุกสถานะ</option><option>Completed</option><option>Abandoned</option></select>
    <input type="date" value="2026-07-15" class="inp !h-9 !w-auto text-sm">
    <span class="text-slate-400 text-sm">→</span>
    <input type="date" value="2026-07-15" class="inp !h-9 !w-auto text-sm">
    <input class="inp !h-9 flex-1 min-w-40 text-sm" placeholder="ค้นหาเบอร์ / ชื่อลูกค้า / agent…">
    <button class="h-9 px-4 rounded-lg bg-teal-700 text-white text-sm font-medium hover:bg-teal-800"><i class="ti ti-search"></i></button>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60 text-[13px]"><tr class="border-b border-slate-100">
        <th class="font-normal px-3 py-2"></th><th class="font-normal px-3 py-2">Channel</th>
        <th class="font-normal px-3 py-2">Contact</th><th class="font-normal px-3 py-2">Queue</th>
        <th class="font-normal px-3 py-2">Agent</th><th class="font-normal px-3 py-2">Start</th>
        <th class="font-normal px-3 py-2 text-right">Wait</th><th class="font-normal px-3 py-2 text-right">Duration</th>
        <th class="font-normal px-3 py-2">Wrap-up</th><th class="font-normal px-3 py-2">Status</th>
      </tr></thead>
      <tbody id="inter-body"></tbody>
    </table></div>
    <div class="px-4 py-2.5 border-t border-slate-100 text-xs text-slate-400 flex items-center justify-between">
      <span>แสดง 10 จาก 1,344 รายการ</span>
      <span class="flex gap-1"><span class="icon-btn"><i class="ti ti-chevron-left"></i></span><span class="icon-btn"><i class="ti ti-chevron-right"></i></span></span>
    </div>
  </div>
</section>

<!-- ===== Recordings ===== -->
<section class="view" data-view="recordings">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="recTitle">Recordings</h1>
    <p class="text-sm text-slate-500" data-i18n="recSubtitle">Call recordings stored in object storage</p></div>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="px-4 py-2.5"></th><th class="font-normal px-4 py-2.5">ID</th>
        <th class="font-normal px-4 py-2.5">Contact</th><th class="font-normal px-4 py-2.5">Agent</th>
        <th class="font-normal px-4 py-2.5">Queue</th><th class="font-normal px-4 py-2.5">Start</th>
        <th class="font-normal px-4 py-2.5 text-right">Duration</th><th class="font-normal px-4 py-2.5 text-right">Size</th><th class="px-4 py-2.5"></th>
      </tr></thead>
      <tbody id="rec-body"></tbody>
    </table></div>
  </div>
  <p class="text-xs text-slate-400 mt-3"><i class="ti ti-lock mr-1"></i>Retention 90 วันตามนโยบาย tenant · การเข้าถึงถูกบันทึกใน audit log</p>
</section>

<!-- ===== Flow trace (docs/flow-engine.md §5.6) ===== -->
<section class="view" data-view="flow-trace">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="ftTitle">Flow trace</h1>
    <p class="text-sm text-slate-500" data-i18n="ftSubtitle">Which path a real interaction took, branch by branch</p></div>
    <div class="flex gap-2">
      <input class="inp w-56" value="INT-88077" placeholder="เลขที่ interaction">
      <button class="qbtn on" onclick="toast('ค้นหา (mock)')"><i class="ti ti-search"></i>เปิด trace</button>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-5">
    <div class="mcard"><div class="mcard-num text-[17px]">INT-88077</div><div class="mcard-lbl">interaction</div></div>
    <div class="mcard"><div class="mcard-num text-[17px]">Voice — Main menu</div><div class="mcard-lbl">flow ที่ใช้ (pin v3)</div></div>
    <div class="mcard"><div class="mcard-num">8.5 วิ</div><div class="mcard-lbl">เวลาที่อยู่ใน flow</div></div>
    <div class="mcard"><div class="mcard-num text-rose-600">1</div><div class="mcard-lbl">node ที่พัง</div></div>
    <div class="mcard"><div class="mcard-num text-[17px] text-emerald-700">HANDED_OFF</div><div class="mcard-lbl">ผลลัพธ์</div></div>
  </div>

  <div class="note note-warn mb-5"><i class="ti ti-help-circle text-lg"></i>
    <p><b>คำถาม:</b> "ลูกค้ากดเลือก Sales แต่ทำไมไปโผล่คิว General Support" —
    <b>คำตอบอยู่ที่ขั้นที่ 5</b>: node <code>n_crm</code> เรียก Order API แล้ว timeout ที่ 400 ms
    flow จึงเดินเส้น <code>error</code> ตามที่ออกแบบไว้ ซึ่งชี้ไปคิวสำรอง — ไม่ใช่บั๊กของ ACD</p></div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
    <div class="lg:col-span-2 bg-white border border-slate-200 rounded-xl p-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-4">เส้นทางทีละ node</h2>
      <div id="ft-steps"></div>
      <p class="text-xs text-slate-400 mt-2"><i class="ti ti-clock mr-1"></i>เวลาที่ใช้เกิน 3 วินาที (ข้อความเสียง/รอลูกค้ากด) ถูกเน้นสีส้ม — ใช้หาจุดที่ผังทำให้ลูกค้ารอนาน</p>
    </div>
    <div class="space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">ตัวแปรตอนจบ</h2>
        <div id="ft-vars"></div>
        <p class="text-xs text-slate-400 mt-3">ตัวแปรที่ประกาศ <code>sensitive: true</code> ถูก mask ก่อนเขียน trace — trace เป็นที่ที่เลขบัตรรั่วได้ง่ายที่สุด</p>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">การเก็บรักษา</h2>
        <p class="text-sm text-slate-600">เก็บ <b>30 วัน</b> แล้วลบอัตโนมัติ · เขียนครั้งเดียวตอน interaction จบ (ไม่เพิ่ม latency ระหว่างสาย)</p>
      </div>
      <div class="flex flex-col gap-2">
        <button class="qbtn" onclick="location.href='flow-editor.html?id=flow_voice_mainmenu'"><i class="ti ti-sitemap"></i>เปิดผังนี้ใน Designer</button>
        <button class="qbtn" onclick="toast('ส่งออก trace เป็น JSON (mock)')"><i class="ti ti-download"></i>ส่งออก JSON</button>
      </div>
    </div>
  </div>
</section>

</main></template>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
<script src="assets/modules.js"></script>
</body>
</html>
