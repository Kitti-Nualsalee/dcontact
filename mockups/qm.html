<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Contact — Quality</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-slate-50 text-slate-800" data-area="qm" data-default="queue">
<div id="app"></div>
<template id="area-main"><main class="p-6">

<!-- ===== Evaluation queue ===== -->
<section class="view active" data-view="queue">
  <div class="flex items-end justify-between mb-4 flex-wrap gap-3">
    <div><h1 class="text-xl font-semibold" data-i18n="qqTitle">Evaluation queue</h1>
    <p class="text-sm text-slate-500" data-i18n="qqSubtitle">What to review, and why it was picked</p></div>
    <div class="flex items-center gap-2">
      <select class="inp w-52"><option>แผน: ทีม Inbound — รายเดือน</option><option>แผน: Sales — รายสัปดาห์</option><option>ทุกแผน</option></select>
      <button class="qbtn !h-9" onclick="showView('calibration')"><i class="ti ti-scale-outline"></i>Calibration</button>
      <button onclick="openScore(0)" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-clipboard-check"></i>เริ่มตรวจ</button>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-5">
    <div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs text-slate-400">ค้างตรวจของฉัน</p><p class="text-2xl font-semibold text-amber-600 mt-1">5</p><p class="text-xs text-slate-400 mt-1">โควตา 4 สาย/คน/เดือน</p></div>
    <div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs text-slate-400">ร่างจาก AI รอยืนยัน</p><p class="text-2xl font-semibold text-slate-800 mt-1">128</p><p class="text-xs text-slate-400 mt-1">ยังไม่มีผลกับเอเจนต์</p></div>
    <div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs text-slate-400">คะแนนเฉลี่ยทีม</p><p class="text-2xl font-semibold mt-1">84.6</p><p class="kpi-delta-up mt-1"><i class="ti ti-arrow-up-right"></i> 2.1 จากเดือนก่อน</p></div>
    <div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs text-slate-400">ถูกโต้แย้ง</p><p class="text-2xl font-semibold text-rose-600 mt-1">2</p><p class="text-xs text-slate-400 mt-1">ต้องตอบใน 5 วันทำการ</p></div>
    <div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs text-slate-400">ครอบคลุมการติดต่อ</p><p class="text-2xl font-semibold mt-1">100%</p><p class="text-xs text-slate-400 mt-1">AI ตรวจ · คนตรวจซ้ำ 3.1%</p></div>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="px-4 py-3 border-b border-slate-100 flex items-center gap-2 flex-wrap">
      <button class="fchip on">ทั้งหมด <b>17</b></button>
      <button class="fchip">ค้างตรวจ <b>5</b></button>
      <button class="fchip">ร่าง AI <b>8</b></button>
      <button class="fchip">เผยแพร่แล้ว <b>2</b></button>
      <button class="fchip">ถูกโต้แย้ง <b>2</b></button>
    </div>
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">การติดต่อ</th><th class="font-normal px-4 py-2.5">เอเจนต์</th>
        <th class="font-normal px-4 py-2.5">ช่องทาง</th><th class="font-normal px-4 py-2.5">ความยาว</th>
        <th class="font-normal px-4 py-2.5">ทำไมถูกเลือก</th><th class="font-normal px-4 py-2.5 text-right">คะแนน</th>
        <th class="font-normal px-4 py-2.5">สถานะ</th><th class="px-4 py-2.5"></th>
      </tr></thead>
      <tbody id="qm-queue-body"></tbody>
    </table></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-5">
    <div class="bg-amber-50 border border-amber-100 rounded-xl p-5 text-sm text-amber-900">
      <p class="font-semibold mb-1"><i class="ti ti-robot mr-1"></i>คะแนนจาก AI เป็นร่างเสมอ</p>
      <p>ใบที่ <code class="bg-white/60 rounded px-1">source = AUTO_DRAFT</code> <b>เอเจนต์มองไม่เห็น</b>
      จนกว่าผู้ตรวจที่เป็นคนจะกดเผยแพร่ และทุกคะแนนต้องมีหลักฐานผูกกับช่วงเวลาในบทสนทนา —
      ข้อที่หาหลักฐานไม่ได้จะถูกตีเป็น <code class="bg-white/60 rounded px-1">INSUFFICIENT_EVIDENCE</code>
      แล้วนับเป็น N/A <b>ไม่ใช่ศูนย์</b> (ADR-010 ข้อ 7–8)</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-1">สัดส่วนที่มาของสายที่ถูกเลือก</h2>
      <p class="text-xs text-slate-400 mb-4">มาจากแผนการตรวจ — สุ่มล้วนจะได้แต่สายที่ไม่มีอะไรผิดปกติ</p>
      <div id="qm-mix" class="space-y-3"></div>
    </div>
  </div>
</section>

<!-- ===== Scorecard (เปิดจากคิว — ไม่อยู่ในเมนู) ===== -->
<section class="view" data-view="score">
  <div class="flex items-end justify-between mb-4 flex-wrap gap-3">
    <div class="flex items-center gap-3">
      <button class="icon-btn" onclick="showView('queue')"><i class="ti ti-arrow-left"></i></button>
      <div><h1 class="text-xl font-semibold" data-i18n="qsTitle">Scorecard</h1>
      <p class="text-sm text-slate-500" id="qm-score-sub">—</p></div>
    </div>
    <div class="flex items-center gap-2">
      <span class="es es-draft" id="qm-score-status"><i class="ti ti-robot"></i>ร่างจาก AI</span>
      <button class="qbtn !h-9" onclick="toast('บันทึกร่างแล้ว (mock)')"><i class="ti ti-device-floppy"></i>บันทึกร่าง</button>
      <button onclick="toast('เผยแพร่แล้ว — เอเจนต์เห็นคะแนนและโต้แย้งได้ (mock)')" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-send"></i>เผยแพร่</button>
    </div>
  </div>

  <div class="grid grid-cols-1 xl:grid-cols-5 gap-5">
    <!-- ซ้าย: player + transcript -->
    <div class="xl:col-span-3 space-y-4">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <div class="flex items-center gap-3 mb-3">
          <button class="w-10 h-10 rounded-full bg-teal-700 text-white flex items-center justify-center" onclick="toast('เล่นเสียง (mock)')"><i class="ti ti-player-play-filled"></i></button>
          <div class="flex-1">
            <div class="wave" id="qm-wave" onclick="toast('กระโดดไปตำแหน่งที่คลิก (mock)')"></div>
          </div>
          <div class="text-right shrink-0 whitespace-nowrap">
            <p class="text-sm font-medium tabular-nums" id="qm-wave-time">01:24 / 06:12</p>
            <p class="text-xs text-slate-400">stereo · 2 leg</p>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-4 text-xs text-slate-500">
          <span class="tl-legend"><span class="tl-key" style="background:#0f766e"></span>เอเจนต์พูด</span>
          <span class="tl-legend"><span class="tl-key" style="background:#6366f1"></span>ลูกค้าพูด</span>
          <span class="tl-legend"><span class="tl-key" style="background:#e2e8f0"></span>เงียบ</span>
          <span class="tl-legend"><span class="tl-key" style="background:#fecaca"></span>หยุดอัด (PCI)</span>
          <span class="tl-legend"><span class="tl-key" style="background:#f59e0b"></span>หลักฐานที่อ้างอิง</span>
          <span class="ml-auto">เปิดฟังครั้งนี้ถูกบันทึกใน <code class="bg-slate-100 rounded px-1">qm_media_access_log</code></span>
        </div>
      </div>

      <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between flex-wrap gap-2">
          <h2 class="text-sm font-semibold text-slate-700">บทสนทนา</h2>
          <div class="flex items-center gap-2 text-xs">
            <span class="text-slate-400">ASR: whisper-local · ไทย · ความมั่นใจเฉลี่ย 0.88</span>
            <button class="qbtn" onclick="toast('แก้ไขบทสนทนา — จะสั่งวิเคราะห์ใหม่ (mock)')"><i class="ti ti-pencil"></i>แก้ไข</button>
          </div>
        </div>
        <div class="p-3"><div class="tr" id="qm-transcript"></div></div>
        <div class="px-4 py-3 border-t border-slate-100 text-xs text-slate-400 flex flex-wrap gap-x-4 gap-y-1">
          <span><i class="ti ti-alert-triangle mr-1 text-amber-500"></i>ท่อนที่ขีดเส้นใต้ประ = ความมั่นใจ ASR ต่ำกว่า 0.7 — ตรวจก่อนใช้เป็นหลักฐาน</span>
          <span>ช่องทางแชต/อีเมลไม่ผ่าน ASR จึงแม่น 100%</span>
        </div>
      </div>
    </div>

    <!-- ขวา: ฟอร์ม -->
    <div class="xl:col-span-2 space-y-4">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <div class="flex items-start justify-between mb-3">
          <div>
            <h2 class="text-sm font-semibold text-slate-700">Inbound Service v7</h2>
            <p class="text-xs text-slate-400">ฟอร์มถูกล็อกไว้ใน <code class="bg-slate-100 rounded px-1">form_snapshot</code> ของใบนี้</p>
          </div>
          <div class="text-right">
            <p class="text-3xl font-semibold text-amber-600" id="qm-total">78<span class="text-lg text-slate-400">%</span></p>
            <p class="text-xs text-slate-400">คะแนนดิบ · ยังไม่เผยแพร่</p>
          </div>
        </div>
        <div class="sbar mb-1"><div class="s-mid" style="width:78%"></div></div>
        <p class="text-xs text-slate-400">N/A และ INSUFFICIENT_EVIDENCE ถูกตัดออกจากตัวหาร ไม่ได้นับเป็น 0</p>
      </div>

      <div id="qm-form"></div>

      <div class="bg-rose-50 border border-rose-100 rounded-xl p-4 text-sm text-rose-900">
        <p class="font-semibold mb-1"><i class="ti ti-alert-octagon mr-1"></i>ข้อ auto-fail</p>
        <p>"ยืนยันตัวตนลูกค้าครบถ้วน" เป็นข้อ auto-fail — ถ้าตอบ "ไม่" คะแนนที่ประกาศจะเป็น 0
        แต่ระบบยัง<b>เก็บคะแนนดิบไว้</b> เพื่อให้วิเคราะห์ได้ว่าส่วนอื่นทำได้ดีแค่ไหน</p>
      </div>
    </div>
  </div>
</section>

<!-- ===== Calibration ===== -->
<section class="view" data-view="calibration">
  <div class="flex items-end justify-between mb-4 flex-wrap gap-3">
    <div><h1 class="text-xl font-semibold" data-i18n="qcalTitle">Calibration</h1>
    <p class="text-sm text-slate-500" data-i18n="qcalSubtitle">Do evaluators agree? Blind-score the same interaction</p></div>
    <button onclick="toast('เปิดรอบ calibration ใหม่ (mock)')" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i>รอบใหม่</button>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
    <div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs text-slate-400">SD ของคะแนนรวม</p><p class="text-2xl font-semibold text-amber-600 mt-1">±6.8</p><p class="text-xs text-slate-400 mt-1">เป้าหมาย ≤ ±5</p></div>
    <div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs text-slate-400">ผู้ตรวจในรอบนี้</p><p class="text-2xl font-semibold mt-1">4</p><p class="text-xs text-slate-400 mt-1">+ ร่างจาก AI 1 ใบ</p></div>
    <div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs text-slate-400">AI ต่างจากค่ากลางของคน</p><p class="text-2xl font-semibold mt-1">−3.4</p><p class="text-xs text-slate-400 mt-1">เกณฑ์ auto-publish: &lt; 5</p></div>
    <div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs text-slate-400">รอบล่าสุด</p><p class="text-2xl font-semibold mt-1">28 ก.ค.</p><p class="text-xs text-slate-400 mt-1">ทุก 2 สัปดาห์</p></div>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden mb-5">
    <div class="px-4 py-3 border-b border-slate-100">
      <h2 class="text-sm font-semibold text-slate-700">รอบ CAL-0043 · INT-88213 · voice 6:12 · เปิดเผยผลแล้ว</h2>
    </div>
    <div class="overflow-x-auto"><table class="w-full text-sm">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">คำถาม</th><th class="font-normal px-4 py-2.5 text-center">พิม</th>
        <th class="font-normal px-4 py-2.5 text-center">นภา</th><th class="font-normal px-4 py-2.5 text-center">John</th>
        <th class="font-normal px-4 py-2.5 text-center">อรทัย</th><th class="font-normal px-4 py-2.5 text-center">AI</th>
        <th class="font-normal px-4 py-2.5 text-right">ส่วนต่าง</th><th class="font-normal px-4 py-2.5">ข้อสรุป</th>
      </tr></thead>
      <tbody id="qm-cal-body"></tbody>
    </table></div>
  </div>

  <div class="bg-teal-50 border border-teal-100 rounded-xl p-5 text-sm text-teal-900 max-w-4xl">
    <p class="font-semibold mb-1"><i class="ti ti-bulb mr-1"></i>variance สูงแปลว่าฟอร์มผิด ไม่ใช่ผู้ตรวจผิด</p>
    <p>ข้อ "แสดงความเห็นอกเห็นใจ" ต่างกัน ±22 — คำถามที่วัดด้วยความรู้สึกจะได้ variance สูงเสมอ
    ทางแก้คือ<b>เขียนเกณฑ์ให้สังเกตได้</b> (เช่น "ทวนปัญหาของลูกค้าด้วยคำพูดตัวเอง") ไม่ใช่ส่งผู้ตรวจไปอบรมเพิ่ม
    · ผลรอบ calibration <b>ไม่นับรวมในคะแนนของเอเจนต์</b> เพราะเป็นการวัดผู้ตรวจ</p>
  </div>
</section>

<!-- ===== Appeals ===== -->
<section class="view" data-view="appeals">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="qapTitle">Appeals</h1>
    <p class="text-sm text-slate-500" data-i18n="qapSubtitle">Scores the agent disputes — decided by someone else</p></div>
    <span class="st st-acw">ต้องตอบภายใน 5 วันทำการ</span>
  </div>

  <div id="qm-appeals" class="space-y-4 mb-5"></div>

  <div class="bg-white border border-slate-200 rounded-xl p-5 max-w-4xl">
    <h2 class="text-sm font-semibold text-slate-700 mb-3">สถานะของผลประเมิน</h2>
    <div class="flex items-center gap-2 flex-wrap text-xs">
      <span class="es es-draft">DRAFT</span><i class="ti ti-arrow-right text-slate-300"></i>
      <span class="es es-pub">PUBLISHED</span><i class="ti ti-arrow-right text-slate-300"></i>
      <span class="es es-disp">DISPUTED</span><i class="ti ti-arrow-right text-slate-300"></i>
      <span class="es es-amend">AMENDED</span>
      <span class="text-slate-400">หรือกลับเป็น</span><span class="es es-pub">PUBLISHED</span>
      <span class="text-slate-400">(ยืนตามเดิม)</span>
    </div>
    <ul class="text-sm text-slate-600 space-y-1.5 mt-4 list-disc pl-5">
      <li><b>ห้ามลบใบเดิม</b> — <code class="bg-slate-100 rounded px-1">AMENDED</code> เก็บทั้งคะแนนเดิมและคะแนนใหม่พร้อมเหตุผล เพราะเป็นเอกสารด้านบุคคล</li>
      <li>ผู้พิจารณาคำโต้แย้ง <b>ต้องไม่ใช่คนที่ให้คะแนนใบนั้น</b> — บังคับในโค้ด ไม่ใช่แค่ในตารางสิทธิ์</li>
      <li>สัดส่วนคำโต้แย้งที่ชนะเป็นตัวชี้วัดสุขภาพของฟอร์มและผู้ตรวจ — เดือนนี้ <b>2 จาก 3 ใบ</b> ชนะ ซึ่งสูงผิดปกติ</li>
    </ul>
  </div>
</section>

<!-- ===== Coaching ===== -->
<section class="view" data-view="coaching-qm">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="qcoTitle">Coaching</h1>
    <p class="text-sm text-slate-500" data-i18n="qcoSubtitle">Finding → session booked in WFM → acknowledged</p></div>
    <button onclick="toast('สร้างเซสชันโค้ช — จองเวลาผ่าน apps/wfm (mock)')" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i>เซสชันใหม่</button>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden mb-5">
    <div class="overflow-x-auto"><table class="w-full text-sm">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">เอเจนต์</th><th class="font-normal px-4 py-2.5">หัวข้อ</th>
        <th class="font-normal px-4 py-2.5">ที่มา</th><th class="font-normal px-4 py-2.5">เวลาในตาราง</th>
        <th class="font-normal px-4 py-2.5">รับทราบ</th><th class="font-normal px-4 py-2.5">ผลติดตาม</th>
      </tr></thead>
      <tbody id="qm-coach-body"></tbody>
    </table></div>
  </div>

  <div class="bg-teal-50 border border-teal-100 rounded-xl p-5 text-sm text-teal-900 max-w-4xl">
    <p class="font-semibold mb-1"><i class="ti ti-calendar-plus mr-1"></i>เซสชันที่ไม่มีเวลาในตาราง คือเซสชันที่ไม่เกิดขึ้นจริง</p>
    <p>QM เรียก REST ของ <code class="bg-white/60 rounded px-1">apps/wfm</code> เพื่อจอง segment ชนิด
    <code class="bg-white/60 rounded px-1">COACHING</code> ในกะของเอเจนต์ — เวลานั้นจึงถูกนับเป็นกิจกรรมที่ถูกต้องใน adherence
