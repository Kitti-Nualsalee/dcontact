<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Contact — Workspace</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-slate-50 text-slate-800" data-area="workspace" data-default="inbox">
<div id="app"></div>
<template id="area-main"><main class="p-6">

<!-- ===== My inbox (omnichannel workspace) ===== -->
<section class="view active" data-view="inbox">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="inboxTitle">My inbox</h1>
    <p class="text-sm text-slate-500" data-i18n="inboxSubtitle">Omnichannel interactions assigned to you</p></div>
    <div class="flex items-center gap-2">
      <select class="inp !h-9 !w-auto text-sm"><option>Available</option><option>Break</option><option>After-call work</option></select>
      <span class="st st-busy">เสียง 1/1 · แชท 3/3</span>
      <span class="tag tag-warn">slot เต็ม</span>
    </div>
  </div>

  <!-- ความกว้างของสามคอลัมน์เป็นค่าที่เอเจนต์ลากปรับเอง — สัดส่วนที่ดีที่สุดขึ้นกับประเภทงาน
       (สคริปต์อ่านง่ายในคอลัมน์แคบ แต่แท็บแอปต้องการที่กว้าง) ดู interaction-data-flow.md §4.4 -->
  <div id="sw-grid" class="sw-grid">
    <!-- conversation list -->
    <div class="sw-col bg-white border border-slate-200 rounded-xl overflow-hidden">
      <div class="px-4 py-2.5 border-b border-slate-100 bg-slate-50 text-sm font-medium text-slate-600 flex items-center justify-between">
        <span>งานของฉัน <span class="text-xs font-normal text-slate-400">· เรียงตามคนที่รอนานสุด</span></span><span class="badge" style="margin-left:0">5</span></div>
      <div id="conv-list" class="flex-1 overflow-y-auto"></div>
    </div>

    <div class="sw-split" data-split="1" role="separator" aria-orientation="vertical" tabindex="0"
      title="ลากเพื่อปรับความกว้าง · ดับเบิลคลิกเพื่อคืนค่าเริ่มต้น · ใช้ปุ่มลูกศรได้"></div>

    <!-- transcript -->
    <div class="sw-col bg-white border border-slate-200 rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2">
          <span id="sw-channel"><span class="ch ch-webchat"><i class="ti ti-message-circle"></i>webchat</span></span>
          <p class="font-medium" id="sw-name">Guest #8812</p>
          <span class="text-xs text-slate-400">· <span id="sw-queue">General Support</span></span>
          <span class="tag tag-ok" id="sw-state" title="สถานะของห้อง ไม่ใช่ของงาน">ห้อง: OPEN</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="icon-btn" title="โอนงาน"><i class="ti ti-arrows-transfer-up"></i></span>
          <button class="qbtn on" id="sw-resolve" onclick="resolveWork()"><i class="ti ti-check"></i>Resolve งาน</button>
          <button class="qbtn" disabled title="ปิดห้องเป็นสิทธิ์ของหัวหน้าขึ้นไป + ต้องมีเหตุผล (ADR-023 ข้อ 5)" style="opacity:.45;cursor:not-allowed"><i class="ti ti-lock"></i>ปิดห้อง</button>
        </div>
      </div>
      <!-- ลำดับอัตโนมัติบรรลุเป้าหมายระหว่างที่งานนี้ยังอยู่ในมือคน — ยกเลิกงานที่ส่งไปแล้วไม่ได้
           จึงต้องดันขึ้นจอแทน (docs/journey-orchestration.md §5.3) -->
      <div id="sw-goal-alert"></div>
      <div id="sw-transcript" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/40"></div>
      <!-- โหมดสรุปงาน — แทนที่ช่องพิมพ์จริง ไม่ใช่แค่ toast -->
      <div id="sw-wrapmode" class="border-t border-amber-200 bg-amber-50/60 p-3" style="display:none">
        <p class="text-sm font-semibold text-amber-900 mb-2"><i class="ti ti-clipboard-check mr-1"></i>สรุปงานก่อนปิด — ห้องยังเปิดอยู่</p>
        <!-- ขั้นบังคับของสคริปต์ที่ยังไม่ได้ทำ — บล็อกได้แค่ตรงนี้ ห้ามบล็อกการคุย (agent-assist §3 A6) -->
        <div id="sw-script-block"></div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-2">
          <select class="inp"><option>— เลือกผลการติดต่อ —</option><option>Resolved</option><option>Escalated</option><option>Follow-up</option></select>
          <input class="inp" placeholder="แท็ก (คั่นด้วยจุลภาค)">
        </div>
        <textarea class="inp mb-2" rows="2" placeholder="สรุปสั้น ๆ — AI ร่างให้ได้ถ้าเปิด assist"></textarea>
        <div class="flex gap-2">
          <button class="qbtn on" onclick="completeWork()"><i class="ti ti-check"></i>บันทึกและปิดงาน</button>
          <button class="qbtn" onclick="toast('AI ร่างสรุปให้ — เอเจนต์ยืนยันเสมอ (mock)')"><i class="ti ti-sparkles"></i>ให้ AI ร่างให้</button>
        </div>
      </div>
      <div id="sw-composer" class="border-t border-slate-100 p-3">
        <div class="flex items-center gap-2">
          <span class="icon-btn"><i class="ti ti-paperclip"></i></span>
          <span class="icon-btn" title="Canned responses"><i class="ti ti-bolt"></i></span>
          <span class="icon-btn bg-indigo-50 text-indigo-700" title="ถามผู้เชี่ยวชาญโดยไม่ต้องโอนสาย" onclick="toggleChat('c1')"><i class="ti ti-help-circle"></i></span>
          <input class="inp !h-10 flex-1" placeholder="พิมพ์ข้อความตอบลูกค้า…">
          <button onclick="toast('Message sent (mock)')" class="h-10 px-4 rounded-lg bg-teal-700 text-white text-sm font-medium hover:bg-teal-800"><i class="ti ti-send"></i></button>
        </div>
      </div>
    </div>

    <div class="sw-split" data-split="2" role="separator" aria-orientation="vertical" tabindex="0"
      title="ลากเพื่อปรับความกว้าง · ดับเบิลคลิกเพื่อคืนค่าเริ่มต้น · ใช้ปุ่มลูกศรได้"></div>

    <!-- แผงบริบทของงาน — แบ่งเป็นแท็บเพราะแผงเยอะเกินกว่าจะเรียงซ้อนกันในคอลัมน์เดียว
         ของด่วนจากแท็บที่ปิดอยู่ต้องขึ้น #sw-alerts + badge บนแท็บเสมอ ห้ามให้หายไปเฉย ๆ -->
    <div class="sw-col sw-col-ctx space-y-3">
      <div id="sw-alerts"></div>
      <div id="sw-tabs" class="swtabs"></div>

      <!-- ===== แท็บ: ลูกค้า ===== -->
      <div class="swpane on" data-pane="customer">
      <div class="bg-white border border-slate-200 rounded-xl p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold text-slate-700">ลูกค้าของงานที่เลือก</h2>
          <span class="text-[11px] text-slate-400" id="sw-cust-name">Guest #8812</span>
        </div>
        <!-- ยังไม่ระบุตัวตน -->
        <div id="sw-guest">
          <p class="font-medium">ยังไม่ระบุตัวตน</p>
          <p class="text-xs text-slate-400 mb-3">เว็บแชทไม่มีตัวตนถาวรจนกว่าจะผูกกับลูกค้า</p>
          <div class="note note-info !text-[12px] !py-2.5"><i class="ti ti-git-merge"></i>
            <p>ระบบเจอผู้ที่น่าจะใช่ 1 ราย จากอีเมลที่ลูกค้าพิมพ์ในแชท — ต้องให้คนยืนยันก่อนรวม</p></div>
          <button class="qbtn w-full justify-center mt-2" onclick="location.href='people.html?view=identities'"><i class="ti ti-user-search"></i>ผูกกับลูกค้าที่มีอยู่</button>
        </div>
        <!-- ระบุตัวตนแล้ว -->
        <div id="sw-known" style="display:none">
          <p class="font-medium">ลูกค้าที่ระบุตัวตนแล้ว</p>
          <dl class="text-sm space-y-1.5 text-slate-600 mt-2 mb-3">
            <div class="flex justify-between"><dt>ติดต่อทั้งหมด</dt><dd>12 ครั้ง</dd></div>
            <div class="flex justify-between"><dt>เคสที่เปิดอยู่</dt><dd>1</dd></div>
          </dl>
          <button class="qbtn w-full justify-center" onclick="location.href='people.html?view=contact-360'"><i class="ti ti-user-circle"></i>เปิดโปรไฟล์ 360</button>
        </div>
        <div class="text-xs text-slate-500 space-y-1.5 border-t border-slate-100 pt-3 mt-3">
          <p class="font-medium text-slate-600">ประวัติในห้องนี้ (conversation เดียวกัน)</p>
          <p><i class="ti ti-message-circle text-teal-700 mr-1"></i>09:38 วันนี้ — บอตคุย 4 รอบ แล้วส่งต่อ</p>
          <p class="text-slate-400">— ยังไม่มีการติดต่อก่อนหน้าในห้องนี้ —</p>
        </div>
      </div>
      </div>

      <!-- ===== แท็บ: สคริปต์ — คนเขียน ไม่ผ่านโมเดล pin เวอร์ชันต่อสาย (agent-assist §3 A6) ===== -->
      <div class="swpane" data-pane="script"><div id="sw-script"></div></div>

      <!-- ===== แท็บ: งานที่ค้าง — เคส + ลำดับอัตโนมัติ ===== -->
      <div class="swpane space-y-3" data-pane="work">
        <div id="sw-journey"></div>
        <div id="sw-case"></div>
      </div>

      <!-- ===== แท็บ: ขอความช่วยเหลือ — consult + คำแนะนำจากผู้ช่วย ===== -->
      <div class="swpane space-y-3" data-pane="help">
      <!-- Consult — ถามผู้เชี่ยวชาญโดยไม่ต้องโอนสาย (docs/internal-collaboration.md §4) -->
      <div class="bg-white border border-indigo-200 rounded-xl p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-sm font-semibold text-indigo-900"><i class="ti ti-help-circle mr-1"></i>ถามผู้เชี่ยวชาญ</h2>
          <span class="tag tag-ai">กำลังเปิด 1 ใบ</span>
        </div>
        <p class="text-xs text-slate-500 mb-3">ผู้เชี่ยวชาญเห็นบริบทของสายนี้ครบโดยที่ลูกค้าไม่ต้องเล่าใหม่ และคุณไม่ต้องโอนสาย</p>
        <div class="rounded-lg bg-indigo-50/60 border border-indigo-100 px-3 py-2 mb-3">
          <p class="text-xs text-indigo-900"><b>ธนพล (สินเชื่อ)</b> · ตอบใน 38 วินาที</p>
          <p class="text-xs text-slate-600 mt-0.5 truncate">"ทำได้ครับ ถ้าเป็น tier Gold ใช้ดุลพินิจได้ถึง 8 เดือน…"</p>
          <div class="att mt-1.5 !bg-white"><i class="ti ti-file-type-pdf"></i><span class="flex-1 truncate">promo-installment-2026.pdf</span><i class="ti ti-shield-check text-emerald-600"></i></div>
        </div>
        <div class="flex gap-2">
          <button class="qbtn flex-1 justify-center" onclick="toggleChat('c1')"><i class="ti ti-message-2"></i>เปิดบทสนทนา</button>
          <button class="qbtn" onclick="toast('เชิญเข้าร่วมสาย (conference) — mock')" title="ยกระดับเป็นสายสามทาง"><i class="ti ti-users-plus"></i></button>
        </div>
        <p class="text-[11px] text-slate-400 mt-2">ปิด consult แล้วสรุปจะถูกแนบกลับเข้า interaction และหัวข้อเข้าคิวเขียนบทความอัตโนมัติ</p>
      </div>
      <div id="sw-assist"></div>
      </div>

      <!-- ===== แท็บ: แอปของลูกค้าที่ฝังในพื้นที่ทำงาน (visual app — integration-platform §9) ===== -->
      <div class="swpane" data-pane="apps"><div id="sw-apps"></div></div>
    </div>
  </div>
</section>

<!-- ===== My interactions ===== -->
<section class="view" data-view="my-history">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="myhisTitle">My interactions</h1>
    <p class="text-sm text-slate-500" data-i18n="myhisSubtitle">Everything you handled — last 7 days</p></div>
    <span class="text-sm text-slate-400"><b id="myhis-count" class="text-slate-600">0</b> รายการ</span>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60 text-[13px]"><tr class="border-b border-slate-100">
        <th class="font-normal px-3 py-2"></th><th class="font-normal px-3 py-2">Channel</th>
        <th class="font-normal px-3 py-2">Contact</th><th class="font-normal px-3 py-2">Queue</th>
        <th class="font-normal px-3 py-2">Start</th>
        <th class="font-normal px-3 py-2 text-right">Wait</th><th class="font-normal px-3 py-2 text-right">Duration</th>
        <th class="font-normal px-3 py-2">Wrap-up</th><th class="font-normal px-3 py-2">Status</th>
      </tr></thead>
      <tbody id="myhis-body"></tbody>
    </table></div>
  </div>
</section>

<!-- work bar — สายที่กำลังคุยอยู่ ค้างทุกวิว ไม่ปนกับงานที่เลือกอยู่ในจอ -->
<div class="monbar">
  <span class="rec-dot"></span>
  <p class="text-sm">กำลังคุยสาย · <b>คุณนภา จันทร์เพ็ญ</b> · VIP Customers · 02:41</p>
  <button class="mon-btn" onclick="selectWork('w3')"><i class="ti ti-arrow-right"></i> เปิดงานนี้</button>
  <button class="mon-btn"><i class="ti ti-microphone-off"></i></button>
  <button class="mon-btn"><i class="ti ti-player-pause"></i></button>
  <button class="mon-btn" onclick="toggleChat('c1')"><i class="ti ti-help-circle"></i> ถามผู้เชี่ยวชาญ</button>
  <button class="mon-btn" style="background:#e11d48;color:#fff" onclick="toast('วางสาย → เข้าสรุปงาน (mock)')"><i class="ti ti-phone-off"></i></button>
</div>

</main></template>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
