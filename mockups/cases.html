<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Contact — Cases</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-slate-50 text-slate-800" data-area="cases" data-default="cases">
<div id="app"></div>
<template id="area-main"><main class="p-6">

<!-- ===== Cases (list) ===== -->
<section class="view active" data-view="cases">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="csTitle">Cases</h1>
    <p class="text-sm text-slate-500" data-i18n="csSubtitle">One subject across many interactions and many days</p></div>
    <button onclick="newCase()" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i>เปิดเคส</button>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-5">
    <div class="mcard"><div class="mcard-num">18</div><div class="mcard-lbl">เปิดอยู่</div></div>
    <div class="mcard"><div class="mcard-num text-rose-600">3</div><div class="mcard-lbl">เกิน SLA</div></div>
    <div class="mcard"><div class="mcard-num text-amber-600">5</div><div class="mcard-lbl">ใกล้ครบ (&lt; 4 ชม.)</div></div>
    <div class="mcard"><div class="mcard-num">2.4 วัน</div><div class="mcard-lbl">เวลาแก้จบเฉลี่ย</div></div>
    <div class="mcard"><div class="mcard-num">7%</div><div class="mcard-lbl">อัตราเปิดซ้ำ (reopen)</div></div>
  </div>
  <div class="flex flex-wrap gap-2 mb-4">
    <span class="fchip on">ทั้งหมด <b>18</b></span>
    <span class="fchip">เกิน SLA <b>3</b></span>
    <span class="fchip">ยังไม่มอบหมาย <b>2</b></span>
    <span class="fchip">รอลูกค้า <b>4</b></span>
    <span class="fchip">ด่วน <b>1</b></span>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">เลขที่</th><th class="font-normal px-4 py-2.5">เรื่อง</th>
        <th class="font-normal px-4 py-2.5">ประเภท</th><th class="font-normal px-4 py-2.5">ลูกค้า</th>
        <th class="font-normal px-4 py-2.5">ความสำคัญ</th><th class="font-normal px-4 py-2.5">สถานะ</th>
        <th class="font-normal px-4 py-2.5">เจ้าของ</th><th class="font-normal px-4 py-2.5">SLA</th>
        <th class="font-normal px-4 py-2.5">การติดต่อ</th>
      </tr></thead>
      <tbody id="cs-cases-body"></tbody>
    </table></div>
  </div>
  <p class="text-xs text-slate-400 mt-3"><i class="ti ti-info-circle mr-1"></i>นาฬิกา SLA <b>หยุดเดิน</b>เมื่อสถานะเป็น "รอลูกค้า" และนับเฉพาะเวลาทำการของปฏิทินที่ผูกไว้</p>
</section>

<!-- ===== Case detail ===== -->
<section class="view" data-view="case-detail">
  <button onclick="showView('cases')" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-teal-700 mb-3"><i class="ti ti-arrow-left"></i><span data-i18n="btnBack">Back</span></button>
  <div class="flex items-start justify-between mb-4">
    <div>
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-semibold">CS-4821 · เคลมสินค้าชำรุด — รุ่น X200</h1>
        <span class="tag tag-warn">กำลังดำเนินการ</span><span class="tag tag-warn">สูง</span>
      </div>
      <p class="text-sm text-slate-500 mt-1">เปิดเมื่อ 04-08-2026 09:12 · ประเภท Claim · เจ้าของ สมหญิง ใจดี</p>
    </div>
    <div class="flex gap-2">
      <button class="qbtn" onclick="editCase()"><i class="ti ti-pencil"></i>แก้ไข</button>
      <button class="qbtn" onclick="toast('ส่งต่อเคส (mock)')"><i class="ti ti-user-share"></i>ส่งต่อ</button>
      <button class="qbtn on" onclick="toast('ปิดเคส (mock)')"><i class="ti ti-check"></i>ปิดเคส</button>
    </div>
  </div>
  <div class="note note-bad mb-5"><i class="ti ti-clock-exclamation text-lg"></i>
    <p>เกินเป้าการแก้จบมาแล้ว <b>3 ชั่วโมงทำการ</b> — แจ้งเตือนหัวหน้าทีมไปแล้วตอน 80% ของเวลา (06-08-2026 14:20)</p></div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
    <div class="lg:col-span-2 space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">ไทม์ไลน์ของเคส</h2>
        <div class="space-y-4">
          <div class="flex gap-3">
            <div class="w-9 h-9 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center shrink-0"><i class="ti ti-mail"></i></div>
            <div class="flex-1"><div class="flex justify-between"><b class="text-sm">อีเมลเข้า · INT-88012</b><span class="text-xs text-slate-400">จ. 04-08 09:12</span></div>
            <p class="text-sm text-slate-600 mt-0.5">"สินค้ามีรอยแตกตั้งแต่แกะกล่อง ขอเปลี่ยนเครื่องใหม่ครับ" — รับโดย สมหญิง ใจดี</p></div>
          </div>
          <div class="flex gap-3">
            <div class="w-9 h-9 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center shrink-0"><i class="ti ti-note"></i></div>
            <div class="flex-1"><div class="flex justify-between"><b class="text-sm">บันทึกภายใน</b><span class="text-xs text-slate-400">จ. 04-08 09:40</span></div>
            <p class="text-sm text-slate-600 mt-0.5">ขอรูปถ่ายเพิ่ม 2 มุม · แจ้งฝ่ายคลังตรวจสอบสต็อกรุ่น X200</p></div>
          </div>
          <div class="flex gap-3">
            <div class="w-9 h-9 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0"><i class="ti ti-phone"></i></div>
            <div class="flex-1"><div class="flex justify-between"><b class="text-sm">สายเข้า · INT-88190</b><span class="text-xs text-slate-400">อ. 05-08 14:03</span></div>
            <p class="text-sm text-slate-600 mt-0.5">ลูกค้าโทรตามความคืบหน้า (4:12 นาที) — รับโดย สมชาย วงศ์ประเสริฐ
            <a class="text-teal-700 underline ml-1" onclick="toast('เปิดสายใน QM (mock)')">ฟังเสียง</a></p></div>
          </div>
          <div class="flex gap-3">
            <div class="w-9 h-9 rounded-lg bg-violet-50 text-violet-600 flex items-center justify-center shrink-0"><i class="ti ti-subtask"></i></div>
            <div class="flex-1"><div class="flex justify-between"><b class="text-sm">งานย่อย: ฝ่ายคลังยืนยันสต็อก</b><span class="text-xs text-slate-400">พ. 06-08 10:00</span></div>
            <p class="text-sm text-slate-600 mt-0.5">มอบหมาย: ทีมคลัง · กำหนดส่ง 07-08 · <span class="tag tag-warn">ยังไม่เสร็จ</span></p></div>
          </div>
          <div class="flex gap-3">
            <div class="w-9 h-9 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center shrink-0"><i class="ti ti-message"></i></div>
            <div class="flex-1"><div class="flex justify-between"><b class="text-sm">ตอบลูกค้าทาง LINE</b><span class="text-xs text-slate-400">พฤ. 07-08 16:40</span></div>
            <p class="text-sm text-slate-600 mt-0.5">"กำลังตรวจสอบสต็อก จะแจ้งผลภายในพรุ่งนี้ครับ" <span class="tag">ลูกค้าเห็น</span></p></div>
          </div>
        </div>
        <div class="border-t border-slate-100 mt-5 pt-4">
          <textarea class="inp" rows="2" placeholder="เพิ่มบันทึก / ตอบลูกค้า…"></textarea>
          <div class="flex items-center gap-2 mt-2">
            <button class="qbtn on" onclick="toast('บันทึกแล้ว (mock)')"><i class="ti ti-note"></i>บันทึกภายใน</button>
            <button class="qbtn" onclick="toast('ส่งถึงลูกค้า (mock)')"><i class="ti ti-send"></i>ส่งถึงลูกค้า</button>
            <button class="qbtn" onclick="toast('สร้างงานย่อย (mock)')"><i class="ti ti-subtask"></i>งานย่อย</button>
          </div>
        </div>
      </div>
    </div>
    <div class="space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">SLA</h2>
        <p class="text-sm text-slate-600 flex justify-between"><span>ตอบครั้งแรก</span><b class="text-emerald-700">28 นาที ✓</b></p>
        <p class="text-sm text-slate-600 flex justify-between mt-1"><span>แก้จบ</span><b class="due-late">เกิน 3 ชม.</b></p>
        <div class="prog mt-2"><div class="p-bad" style="width:100%"></div></div>
        <p class="text-xs text-slate-400 mt-2">นโยบาย: มาตรฐาน 3 วัน · ปฏิทิน Bangkok office · หยุดนาฬิกาไป 6 ชม. (รอลูกค้าส่งรูป)</p>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">ลูกค้า</h2>
        <p class="font-medium">คุณนภา จันทร์เพ็ญ</p>
        <p class="text-sm text-slate-500">Siam Retail Co. · ลูกค้า 12 ครั้ง</p>
        <div class="flex flex-wrap gap-1 mt-2">
          <span class="ch ch-voice"><i class="ti ti-phone"></i>+66 81 234 5678</span>
          <span class="ch ch-line"><i class="ti ti-brand-line"></i>@napha.c</span>
          <span class="ch ch-email"><i class="ti ti-mail"></i>napha@…</span>
        </div>
        <p class="text-sm text-slate-600 mt-3">CSAT ล่าสุด <b class="text-rose-600">2/5</b> · มีเคสอื่นเปิดอยู่ 0 ใบ</p>
        <button class="qbtn mt-3 w-full justify-center" onclick="location.href='people.html?view=contact-360'"><i class="ti ti-user-circle"></i>เปิดโปรไฟล์ 360</button>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">ข้อมูลตามประเภทเคส</h2>
        <dl class="text-sm space-y-1.5 text-slate-600">
          <div class="flex justify-between"><dt>หมายเลขสินค้า</dt><dd class="font-medium text-slate-800">X200-88-41209</dd></div>
          <div class="flex justify-between"><dt>วันที่ซื้อ</dt><dd class="font-medium text-slate-800">28-07-2026</dd></div>
          <div class="flex justify-between"><dt>รูปถ่าย</dt><dd class="font-medium text-slate-800">2 ไฟล์</dd></div>
        </dl>
      </div>
    </div>
  </div>
</section>

<!-- ===== Case form (new/edit) ===== -->
<section class="view" data-view="case-form">
  <button onclick="showView('cases')" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-teal-700 mb-3"><i class="ti ti-arrow-left"></i><span data-i18n="btnBack">Back</span></button>
  <h1 id="csf-heading" class="text-xl font-semibold mb-5">New case</h1>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 max-w-5xl">
    <div class="lg:col-span-2 space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2"><label class="fld">เรื่อง</label><input id="csf-subject" class="inp" placeholder="สรุปสั้น ๆ ว่าลูกค้าต้องการอะไร"></div>
          <div><label class="fld">ประเภทเคส</label><select id="csf-type" class="inp"><option>General</option><option>Claim</option><option>Billing</option><option>Technical</option><option>Retention</option><option>Customer recovery</option></select></div>
          <div><label class="fld">ลูกค้า</label><input id="csf-contact" class="inp" placeholder="ค้นชื่อ / เบอร์ / อีเมล"></div>
          <div><label class="fld">ความสำคัญ</label><select id="csf-pri" class="inp"><option>ต่ำ</option><option>ปกติ</option><option>สูง</option><option>ด่วน</option></select></div>
          <div><label class="fld">เจ้าของเคส</label><select id="csf-owner" class="inp"><option>— ยังไม่มอบหมาย —</option><option>สมหญิง ใจดี</option><option>สมชาย วงศ์ประเสริฐ</option><option>ปกรณ์ ศรีสุข</option></select></div>
          <div class="md:col-span-2"><label class="fld">รายละเอียด</label><textarea id="csf-desc" class="inp" rows="4"></textarea></div>
        </div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-1">ข้อมูลตามประเภท (Claim)</h2>
        <p class="text-xs text-slate-400 mb-4">ฟิลด์ชุดนี้มาจากประเภทเคส — เป็นข้อมูล ไม่ใช่ schema (<a class="underline" href="../docs/adr/005-multitenant-metadata-architecture.md">ADR-005</a>)</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="fld">หมายเลขสินค้า</label><input class="inp"></div>
          <div><label class="fld">วันที่ซื้อ</label><input type="date" class="inp"></div>
          <div class="md:col-span-2"><label class="fld">รูปถ่าย</label><input type="file" class="inp pt-1.5"></div>
        </div>
      </div>
    </div>
    <div class="space-y-5">
      <div class="note note-info"><i class="ti ti-info-circle text-lg"></i>
        <p>ลูกค้ารายนี้ <b>ไม่มี</b>เคสที่เปิดอยู่ — ถ้ามี ระบบจะเสนอให้ผูกกับเคสเดิมก่อนสร้างใบใหม่ เพื่อกันเคสซ้ำ</p></div>
      <div class="flex gap-3">
        <button onclick="saveMock('cases')" class="flex-1 h-10 rounded-lg bg-teal-700 text-white text-sm font-medium hover:bg-teal-800" data-i18n="btnSave">Save</button>
        <button onclick="showView('cases')" class="flex-1 h-10 rounded-lg border border-slate-300 text-sm hover:bg-slate-50" data-i18n="btnCancel">Cancel</button>
      </div>
    </div>
  </div>
</section>

<!-- ===== My cases ===== -->
<section class="view" data-view="my-cases">
  <div class="mb-4"><h1 class="text-xl font-semibold" data-i18n="csMineTitle">My cases</h1>
  <p class="text-sm text-slate-500" data-i18n="csMineSubtitle">Cases you own — ordered by time left</p></div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">เลขที่</th><th class="font-normal px-4 py-2.5">เรื่อง</th>
        <th class="font-normal px-4 py-2.5">ประเภท</th><th class="font-normal px-4 py-2.5">ลูกค้า</th>
        <th class="font-normal px-4 py-2.5">ความสำคัญ</th><th class="font-normal px-4 py-2.5">สถานะ</th>
        <th class="font-normal px-4 py-2.5">เจ้าของ</th><th class="font-normal px-4 py-2.5">SLA</th>
        <th class="font-normal px-4 py-2.5">การติดต่อ</th>
      </tr></thead>
      <tbody id="cs-mine-body"></tbody>
    </table></div>
  </div>
</section>

<!-- ===== Case types (list) ===== -->
<section class="view" data-view="case-types">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="csTypeTitle">Case types</h1>
    <p class="text-sm text-slate-500" data-i18n="csTypeSubtitle">Fields, statuses and forms per type — metadata, not schema</p></div>
    <button onclick="newCsType()" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i><span data-i18n="btnNew">New</span></button>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">ประเภท</th><th class="font-normal px-4 py-2.5">รูปแบบเลขที่</th>
        <th class="font-normal px-4 py-2.5">ฟิลด์เพิ่มเติม</th><th class="font-normal px-4 py-2.5">สถานะ</th>
        <th class="font-normal px-4 py-2.5">SLA ตั้งต้น</th><th class="font-normal px-4 py-2.5">เคสทั้งหมด</th><th class="px-4 py-2.5"></th>
      </tr></thead>
      <tbody id="cs-types-body"></tbody>
    </table></div>
  </div>
</section>

<!-- ===== Case type form (new/edit) ===== -->
<section class="view" data-view="case-type-form">
  <button onclick="showView('case-types')" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-teal-700 mb-3"><i class="ti ti-arrow-left"></i><span data-i18n="btnBack">Back</span></button>
  <h1 id="ctf-heading" class="text-xl font-semibold mb-5">New case type</h1>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 max-w-5xl">
    <div class="lg:col-span-2 space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="fld">ชื่อประเภท</label><input id="ctf-name" class="inp"></div>
          <div><label class="fld">คำนำหน้าเลขที่</label><input id="ctf-prefix" class="inp" value="CS"></div>
          <div><label class="fld">นโยบาย SLA ตั้งต้น</label><select id="ctf-sla" class="inp"><option>มาตรฐาน 3 วัน</option><option>เทคนิค 8 ชม.</option><option>ด่วน 4 ชม.</option><option>ด่วน 24 ชม.</option></select></div>
          <div><label class="fld">คิวปลายทาง</label><select class="inp"><option>General Support</option><option>Technical Support</option><option>Billing Inquiries</option></select></div>
        </div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">ฟิลด์เพิ่มเติม</h2>
        <input id="ctf-fields" class="inp mb-3" placeholder="คั่นด้วยจุลภาค เช่น หมายเลขสินค้า, วันที่ซื้อ, รูปถ่าย">
        <table class="w-full text-sm">
          <thead class="text-slate-500 text-left"><tr><th class="font-normal py-2">ฟิลด์</th><th class="font-normal py-2">ชนิด</th><th class="font-normal py-2">บังคับ</th><th></th></tr></thead>
          <tbody class="text-slate-600">
            <tr class="border-t border-slate-100"><td class="py-2">หมายเลขสินค้า</td><td class="py-2">ข้อความ</td><td class="py-2">ใช่</td><td class="py-2 text-right"><span class="icon-btn"><i class="ti ti-trash"></i></span></td></tr>
