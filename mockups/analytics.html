<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Contact — Analytics</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-slate-50 text-slate-800" data-area="analytics" data-default="ia-overview">
<div id="app"></div>
<template id="area-main"><main class="p-6">

<!-- ===== IA overview ===== -->
<section class="view active" data-view="ia-overview">
  <div class="mb-4"><h1 class="text-xl font-semibold" data-i18n="iaTitle">Analytics overview</h1>
  <p class="text-sm text-slate-500" data-i18n="iaSubtitle">Every conversation analysed — not just the sampled ones</p></div>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-5">
    <div class="mcard"><div class="mcard-num">38,412</div><div class="mcard-lbl">บทสนทนาที่วิเคราะห์ (30 วัน)</div></div>
    <div class="mcard"><div class="mcard-num">99.2%</div><div class="mcard-lbl">ความครอบคลุม</div></div>
    <div class="mcard"><div class="mcard-num">26</div><div class="mcard-lbl">หัวข้อที่ยืนยันแล้ว</div></div>
    <div class="mcard"><div class="mcard-num text-rose-600">2</div><div class="mcard-lbl">หัวข้อที่โตผิดปกติ</div></div>
    <div class="mcard"><div class="mcard-num">18,904</div><div class="mcard-lbl">นาทีที่วิเคราะห์ (โควตา 20,000)</div>
      <div class="prog mt-2"><div class="p-warn" style="width:95%"></div></div></div>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-4">หัวข้อที่กินเวลามากที่สุด (ปริมาณ × AHT)</h2>
      <div class="space-y-3 text-sm">
        <div><div class="flex justify-between mb-1"><span>ค่าบริการไม่ตรงกับที่แจ้ง</span><b>147 ชม.</b></div><div class="prog"><div style="width:100%"></div></div></div>
        <div><div class="flex justify-between mb-1"><span>ตั้งค่าอุปกรณ์ไม่ได้</span><b>124 ชม.</b></div><div class="prog"><div style="width:84%"></div></div></div>
        <div><div class="flex justify-between mb-1"><span>พัสดุล่าช้า</span><b>67 ชม.</b></div><div class="prog"><div style="width:46%"></div></div></div>
        <div><div class="flex justify-between mb-1"><span>ขอใบกำกับภาษี</span><b>27 ชม.</b></div><div class="prog"><div style="width:18%"></div></div></div>
      </div>
      <p class="text-xs text-slate-400 mt-4">คิดเป็นค่าแรงประมาณ <b>฿186,000</b>/เดือน — ตัวเลขนี้คือเหตุผลที่ผู้บริหารอ่านหน้านี้</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-4">โตผิดปกติ (เกิน 3σ ของค่าเฉลี่ย 4 สัปดาห์)</h2>
      <div class="space-y-3">
        <div class="alrow al-crit"><i class="ti ti-trending-up text-lg"></i>
          <div><b class="text-sm">แอปล็อกอินไม่ได้หลังอัปเดต</b> <span class="tag tag-bad">+214%</span>
          <p class="text-sm text-slate-600 mt-0.5">174 สายใน 7 วัน · เริ่มพุ่ง 05-08 เวลา 14:00 ตรงกับที่ปล่อยแอปเวอร์ชัน 4.2</p>
          <div class="flex gap-2 mt-2"><button class="qbtn" onclick="showView('ia-topic-detail')"><i class="ti ti-list-search"></i>ดูสายจริง</button>
          <button class="qbtn" onclick="toast('เปิดเคสให้ทีมแอป (mock)')"><i class="ti ti-ticket"></i>เปิดเคส</button></div></div>
        </div>
        <div class="alrow al-warn"><i class="ti ti-trending-up text-lg"></i>
          <div><b class="text-sm">สอบถามโปรโมชันคู่แข่ง</b> <span class="tag tag-warn">+96%</span>
          <p class="text-sm text-slate-600 mt-0.5">288 สายใน 30 วัน · เจอมากที่คิว Sales (TH)</p></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== Topics (list) ===== -->
<section class="view" data-view="ia-topics">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="iaTopTitle">Topics</h1>
    <p class="text-sm text-slate-500" data-i18n="iaTopSubtitle">Discovered automatically, named by humans, promoted to rules</p></div>
  </div>
  <div class="note note-info mb-4"><i class="ti ti-info-circle text-lg"></i>
    <p>สองระบบอยู่ด้วยกัน: <b>หมวดอัตโนมัติ</b> (คนเขียนกฎ แม่นยำ อธิบายได้ ใช้กับ compliance ได้) และ
    <b>หัวข้อที่ค้นพบ</b> (จัดกลุ่มเอง ใช้สำรวจ) — หัวข้อที่ยืนยันแล้วควรถูก<b>เลื่อนขั้น</b>เป็นกฎ</p></div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">หัวข้อ</th><th class="font-normal px-4 py-2.5">สถานะ</th>
        <th class="font-normal px-4 py-2.5">จำนวน</th><th class="font-normal px-4 py-2.5">เทียบเดือนก่อน</th>
        <th class="font-normal px-4 py-2.5">AHT</th><th class="font-normal px-4 py-2.5">CSAT</th>
        <th class="font-normal px-4 py-2.5">ติดต่อซ้ำ</th><th class="px-4 py-2.5"></th>
      </tr></thead>
      <tbody id="ia-topics-body"></tbody>
    </table></div>
  </div>
</section>

<!-- ===== Topic detail ===== -->
<section class="view" data-view="ia-topic-detail">
  <button onclick="showView('ia-topics')" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-teal-700 mb-3"><i class="ti ti-arrow-left"></i><span data-i18n="btnBack">Back</span></button>
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold">แอปล็อกอินไม่ได้หลังอัปเดต</h1>
    <p class="text-sm text-slate-500">ค้นพบอัตโนมัติ 05-08-2026 · ยังไม่ถูกเลื่อนขั้นเป็นกฎ</p></div>
    <button class="qbtn on" onclick="toast('เลื่อนขั้นเป็นหมวดอัตโนมัติ (mock)')"><i class="ti ti-arrow-up-circle"></i>เลื่อนขั้นเป็นกฎ</button>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-5">
    <div class="mcard"><div class="mcard-num">174</div><div class="mcard-lbl">บทสนทนา</div></div>
    <div class="mcard"><div class="mcard-num text-rose-600">+214%</div><div class="mcard-lbl">เทียบ baseline</div></div>
    <div class="mcard"><div class="mcard-num">7:50</div><div class="mcard-lbl">AHT เฉลี่ย</div></div>
    <div class="mcard"><div class="mcard-num text-rose-600">55</div><div class="mcard-lbl">CSAT</div></div>
    <div class="mcard"><div class="mcard-num text-amber-600">44%</div><div class="mcard-lbl">ติดต่อซ้ำใน 7 วัน</div></div>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="px-5 py-3 border-b border-slate-100 text-sm font-semibold text-slate-700">สายจริงที่เข้าหัวข้อนี้ — ทุกตัวเลขคลิกลงมาถึงตรงนี้ได้เสมอ</div>
    <table class="w-full text-sm">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">เวลา</th><th class="font-normal px-4 py-2.5">ช่องทาง</th>
        <th class="font-normal px-4 py-2.5">ลูกค้า</th><th class="font-normal px-4 py-2.5">ประโยคที่ทำให้เข้าหัวข้อ</th>
        <th class="font-normal px-4 py-2.5">CSAT</th><th class="px-4 py-2.5"></th></tr></thead>
      <tbody class="text-slate-600">
        <tr class="border-b border-slate-50"><td class="px-4 py-3">08-08 09:41</td><td class="px-4 py-3"><span class="ch ch-voice"><i class="ti ti-phone"></i>voice</span></td><td class="px-4 py-3">+66 81 234 5678</td><td class="px-4 py-3">"อัปเดตแอปเสร็จแล้วเข้าไม่ได้เลยครับ"</td><td class="px-4 py-3 text-rose-600 font-semibold">2</td><td class="px-4 py-3 text-right"><span class="icon-btn" onclick="toast('เปิดใน QM (mock)')"><i class="ti ti-player-play"></i></span></td></tr>
        <tr class="border-b border-slate-50"><td class="px-4 py-3">08-08 09:12</td><td class="px-4 py-3"><span class="ch ch-line"><i class="ti ti-brand-line"></i>line</span></td><td class="px-4 py-3">@wichai_t</td><td class="px-4 py-3">"ล็อกอินไม่ผ่านตั้งแต่เวอร์ชันใหม่"</td><td class="px-4 py-3">—</td><td class="px-4 py-3 text-right"><span class="icon-btn"><i class="ti ti-message"></i></span></td></tr>
        <tr class="border-b border-slate-50"><td class="px-4 py-3">07-08 18:33</td><td class="px-4 py-3"><span class="ch ch-webchat"><i class="ti ti-message-circle"></i>webchat</span></td><td class="px-4 py-3">Guest #8901</td><td class="px-4 py-3">"หน้าจอค้างตอนกดเข้าสู่ระบบ"</td><td class="px-4 py-3 text-rose-600 font-semibold">1</td><td class="px-4 py-3 text-right"><span class="icon-btn"><i class="ti ti-message"></i></span></td></tr>
        <tr><td class="px-4 py-3">07-08 15:07</td><td class="px-4 py-3"><span class="ch ch-voice"><i class="ti ti-phone"></i>voice</span></td><td class="px-4 py-3">+66 89 222 7788</td><td class="px-4 py-3">"ต้องลบแอปแล้วลงใหม่ทุกครั้งเลยเหรอ"</td><td class="px-4 py-3">4</td><td class="px-4 py-3 text-right"><span class="icon-btn"><i class="ti ti-player-play"></i></span></td></tr>
      </tbody>
    </table>
  </div>
</section>

<!-- ===== Search conversations ===== -->
<section class="view" data-view="ia-search">
  <div class="mb-4"><h1 class="text-xl font-semibold" data-i18n="iaSrchTitle">Search conversations</h1>
  <p class="text-sm text-slate-500" data-i18n="iaSrchSubtitle">Find what was actually said, across every channel</p></div>
  <div class="bg-white border border-slate-200 rounded-xl p-5 mb-5">
    <div class="flex gap-2 mb-3">
      <input class="inp" value='"ฟ้อง" OR "ผู้บริโภค"' placeholder="ค้นจากสิ่งที่พูด/พิมพ์จริง">
      <button class="qbtn on" onclick="toast('ค้นหา (mock)')"><i class="ti ti-search"></i>ค้นหา</button>
      <button class="qbtn" onclick="newSaved()"><i class="ti ti-bookmark"></i>บันทึกการค้นหา</button>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
      <select class="inp"><option>ทุกช่องทาง</option><option>voice</option><option>webchat</option><option>line</option></select>
      <select class="inp"><option>ทุกคิว</option><option>General Support</option><option>Collections</option></select>
      <select class="inp"><option>30 วันล่าสุด</option><option>7 วันล่าสุด</option><option>ไตรมาสนี้</option></select>
      <select class="inp"><option>ทุกผลลัพธ์</option><option>เฉพาะที่ถูกโอนสาย</option><option>เฉพาะที่ติดต่อซ้ำ</option></select>
      <select class="inp"><option>ทุกคะแนน CSAT</option><option>CSAT ≤ 2</option></select>
    </div>
  </div>
  <p class="text-sm text-slate-500 mb-3">พบ <b>3</b> บทสนทนา</p>
  <div class="space-y-3">
    <div class="bg-white border border-slate-200 rounded-xl p-4">
      <div class="flex justify-between text-sm"><b>INT-88410 · voice · Collections</b><span class="text-slate-400">06-08-2026 11:24 · 9:12 นาที</span></div>
      <div class="tr mt-2" style="max-height:none">
        <div class="tr-line tr-contact"><span class="tr-t">03:41</span><span class="tr-who">ลูกค้า</span><span>ถ้ายังไม่แก้ ผมจะไป<span class="tr-hit">ฟ้อง</span>สคบ.นะครับ</span></div>
        <div class="tr-line tr-agent"><span class="tr-t">03:48</span><span class="tr-who">เอเจนต์</span><span>ขออภัยจริง ๆ ครับ ผมจะเร่งให้ทีมตรวจสอบทันที</span></div>
      </div>
      <div class="flex gap-2 mt-2"><span class="cat cat-risk">เสี่ยงร้องเรียน</span><span class="tag">CSAT 1</span>
        <button class="qbtn ml-auto" onclick="toast('เปิดใน QM (mock)')"><i class="ti ti-player-play"></i>ฟังสาย</button></div>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-4">
      <div class="flex justify-between text-sm"><b>INT-88102 · line · Billing Inquiries</b><span class="text-slate-400">04-08-2026 15:02</span></div>
      <div class="tr mt-2" style="max-height:none">
        <div class="tr-line tr-contact"><span class="tr-t">—</span><span class="tr-who">ลูกค้า</span><span>เรื่องนี้ผมปรึกษา<span class="tr-hit">ผู้บริโภค</span>แล้วนะ</span></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== Saved searches (list) ===== -->
<section class="view" data-view="ia-searches">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="iaSavedTitle">Saved searches</h1>
    <p class="text-sm text-slate-500" data-i18n="iaSavedSubtitle">Searches kept as alerts</p></div>
    <button onclick="newSaved()" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i><span data-i18n="btnNew">New</span></button>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">ชื่อ</th><th class="font-normal px-4 py-2.5">เงื่อนไข</th>
        <th class="font-normal px-4 py-2.5">เจ้าของ</th><th class="font-normal px-4 py-2.5">แจ้งเตือนเมื่อ</th>
        <th class="font-normal px-4 py-2.5">พบ (7 วัน)</th><th class="px-4 py-2.5"></th>
      </tr></thead>
      <tbody id="ia-saved-body"></tbody>
    </table></div>
  </div>
</section>

<!-- ===== Saved search form (new/edit) ===== -->
<section class="view" data-view="saved-form">
  <button onclick="showView('ia-searches')" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-teal-700 mb-3"><i class="ti ti-arrow-left"></i><span data-i18n="btnBack">Back</span></button>
  <h1 id="sf-heading" class="text-xl font-semibold mb-5">New saved search</h1>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 max-w-5xl">
    <div class="lg:col-span-2 bg-white border border-slate-200 rounded-xl p-5 space-y-4">
      <div><label class="fld">ชื่อ</label><input id="sf-name" class="inp"></div>
      <div><label class="fld">เงื่อนไข</label><input id="sf-query" class="inp font-mono text-[13px]"></div>
      <div><label class="fld">แจ้งเตือนเมื่อ</label>
        <select id="sf-alert" class="inp"><option>—</option><option>&gt; 5 สาย/วัน</option><option>&gt; 3 สาย/สัปดาห์</option><option>พบครั้งแรกของวัน</option></select></div>
      <div><label class="fld">แจ้งไปที่</label><select class="inp"><option>ฝ่ายกำกับ</option><option>หัวหน้าทีมของสายนั้น</option><option>ผู้จัดการศูนย์</option></select></div>
      <label class="flex items-center gap-2.5 text-sm"><input type="checkbox" class="accent-teal-700">เปิดเคสอัตโนมัติเมื่อแจ้งเตือน</label>
    </div>
    <div class="flex gap-3 h-fit">
      <button onclick="saveMock('ia-searches')" class="flex-1 h-10 rounded-lg bg-teal-700 text-white text-sm font-medium hover:bg-teal-800" data-i18n="btnSave">Save</button>
      <button onclick="showView('ia-searches')" class="flex-1 h-10 rounded-lg border border-slate-300 text-sm hover:bg-slate-50" data-i18n="btnCancel">Cancel</button>
    </div>
  </div>
</section>

<!-- ===== Feedback overview ===== -->
<section class="view" data-view="fb-overview">
  <div class="mb-4"><h1 class="text-xl font-semibold" data-i18n="fbTitle">CSAT / NPS</h1>
  <p class="text-sm text-slate-500" data-i18n="fbSubtitle">The customer view — always shown with response rate</p></div>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-5">
    <div class="mcard"><div class="mcard-num">4.21</div><div class="mcard-lbl">CSAT เฉลี่ย (n=4,820)</div></div>
    <div class="mcard"><div class="mcard-num">+38</div><div class="mcard-lbl">NPS (n=1,240)</div></div>
    <div class="mcard"><div class="mcard-num">31%</div><div class="mcard-lbl">อัตราการตอบกลับ</div></div>

  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-4">การกระจายของคะแนน (ไม่ใช่แค่ค่าเฉลี่ย)</h2>
      <div class="space-y-2 text-sm">
        <div class="flex items-center gap-3"><span class="w-6 text-slate-500">5</span><div class="flex-1 prog"><div style="width:58%"></div></div><span class="w-16 text-right text-slate-600">2,798</span></div>
        <div class="flex items-center gap-3"><span class="w-6 text-slate-500">4</span><div class="flex-1 prog"><div style="width:22%"></div></div><span class="w-16 text-right text-slate-600">1,060</span></div>
        <div class="flex items-center gap-3"><span class="w-6 text-slate-500">3</span><div class="flex-1 prog"><div style="width:11%"></div></div><span class="w-16 text-right text-slate-600">550</span></div>
        <div class="flex items-center gap-3"><span class="w-6 text-slate-500">2</span><div class="flex-1 prog"><div class="p-warn" style="width:6%"></div></div><span class="w-16 text-right text-slate-600">289</span></div>
        <div class="flex items-center gap-3"><span class="w-6 text-slate-500">1</span><div class="flex-1 prog"><div class="p-bad" style="width:3%"></div></div><span class="w-16 text-right text-slate-600">123</span></div>
      </div>
      <p class="text-xs text-slate-400 mt-4">ค่าเฉลี่ยเท่ากันได้จากการกระจายที่ต่างกันโดยสิ้นเชิง — หน้านี้จึงแสดงทั้งสองอย่างเสมอ</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5">
