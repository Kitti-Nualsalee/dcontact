<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Contact — AI &amp; Self-service</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-slate-50 text-slate-800" data-area="ai" data-default="bots">
<div id="app"></div>
<template id="area-main"><main class="p-6">

<!-- ===== Bots (list) ===== -->
<section class="view active" data-view="bots">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="botTitle">Virtual agents</h1>
    <p class="text-sm text-slate-500" data-i18n="botSubtitle">Bots answer inside the flow — never instead of it</p></div>
    <button onclick="newBot()" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i><span data-i18n="btnNew">New</span></button>
  </div>
  <div class="note note-info mb-4"><i class="ti ti-info-circle text-lg"></i>
    <p>บอตถูกเรียกจาก node <code>Bot</code> ใน <a class="underline" href="flow-editor.html">Flow Designer</a> และตอบกลับได้ 3 อย่างเท่านั้น:
    <b>ตอบได้ · ส่งต่อคน · ล้มเหลว</b> — flow เป็นคนตัดสินใจต่อเสมอ (<a class="underline" href="../docs/adr/013-virtual-agent-knowledge.md">ADR-013</a>)</p></div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">บอต</th><th class="font-normal px-4 py-2.5">ระดับ</th>
        <th class="font-normal px-4 py-2.5">ช่องทาง</th><th class="font-normal px-4 py-2.5">Session (30 วัน)</th>
        <th class="font-normal px-4 py-2.5">จบด้วยบอต</th><th class="font-normal px-4 py-2.5">CSAT ของ session</th>
        <th class="font-normal px-4 py-2.5">เวอร์ชัน</th><th class="font-normal px-4 py-2.5">สถานะ</th><th class="px-4 py-2.5"></th>
      </tr></thead>
      <tbody id="ai-bots-body"></tbody>
    </table></div>
  </div>
  <p class="text-xs text-slate-400 mt-3"><i class="ti ti-alert-triangle mr-1"></i>"Billing helper" จบงานได้ 38% แต่ CSAT 66 — อัตราการจบสูงโดย CSAT ต่ำแปลว่าเรากำลังไล่ลูกค้า ไม่ใช่ช่วยลูกค้า</p>
</section>

<!-- ===== Bot form (new/edit) ===== -->
<section class="view" data-view="bot-form">
  <button onclick="showView('bots')" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-teal-700 mb-3"><i class="ti ti-arrow-left"></i><span data-i18n="btnBack">Back</span></button>
  <h1 id="bf-heading" class="text-xl font-semibold mb-5">New virtual agent</h1>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 max-w-5xl">
    <div class="lg:col-span-2 space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2"><label class="fld">ชื่อบอต</label><input id="bf-name" class="inp"></div>
          <div><label class="fld">ระดับความสามารถ</label>
            <select id="bf-level" class="inp">
              <option value="L1">L1 — เมนู/FAQ (ไม่ใช้ LLM)</option>
              <option value="L2">L2 — ตอบจากคลังความรู้ (RAG)</option>
              <option value="L3">L3 — ทำงานจริงผ่าน API</option>
            </select></div>
          <div><label class="fld">คลังความรู้ที่ใช้</label><select class="inp"><option>สาธารณะ (ทั้งหมด)</option><option>สาธารณะ — เฉพาะจัดส่ง</option><option>ภายใน + สาธารณะ</option></select></div>
          <div><label class="fld">เกณฑ์ความมั่นใจขั้นต่ำ</label><input id="bf-conf" type="number" step="0.01" class="inp" value="0.62"></div>
          <div><label class="fld">จำนวนรอบสูงสุดก่อนส่งต่อคน</label><input id="bf-turns" type="number" class="inp" value="6"></div>
          <div class="md:col-span-2"><label class="fld">คิวที่รับเมื่อส่งต่อ</label><select id="bf-queue" class="inp"><option>General Support</option><option>Technical Support</option><option>Sales (TH)</option></select></div>
        </div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-1">บุคลิกและข้อห้าม</h2>
        <p class="text-xs text-slate-400 mb-3">ข้อห้ามคือสิ่งที่ทำให้บอตปลอดภัยกว่าคำสั่งว่าต้องพูดอะไร</p>
        <textarea id="bf-persona" class="inp" rows="4"></textarea>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4 text-sm">
          <label class="flex items-center gap-2.5 border border-slate-200 rounded-lg px-3 py-2.5"><input type="checkbox" checked disabled class="accent-teal-700">ตอบได้เฉพาะจากคลังความรู้ (บังคับ)</label>
          <label class="flex items-center gap-2.5 border border-slate-200 rounded-lg px-3 py-2.5"><input type="checkbox" checked disabled class="accent-teal-700">ต้องแนบแหล่งอ้างอิงทุกคำตอบ (บังคับ)</label>
          <label class="flex items-center gap-2.5 border border-slate-200 rounded-lg px-3 py-2.5"><input type="checkbox" checked disabled class="accent-teal-700">คำว่า "คุยกับคน" ส่งต่อทันทีเสมอ (บังคับ)</label>
          <label class="flex items-center gap-2.5 border border-slate-200 rounded-lg px-3 py-2.5"><input type="checkbox" checked class="accent-teal-700">ปิดบัง PII ก่อนส่งออก provider</label>
        </div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">ทดลองคุย</h2>
        <div class="border border-slate-200 rounded-xl p-4 space-y-2 bg-slate-50/50">
          <div class="bubble bubble-in">ของถึงเมื่อไหร่ครับ สั่งไปเมื่อวาน</div>
          <div class="bubble bubble-out">รบกวนขอเลขคำสั่งซื้อครับ</div>
          <div class="bubble bubble-in">A2291</div>
          <div class="bubble bubble-out">ออเดอร์ #A2291 อยู่ระหว่างจัดส่ง คาดว่าถึงพรุ่งนี้ครับ</div>
          <div class="flex flex-wrap gap-1.5 pl-1">
            <span class="ev"><i class="ti ti-file-text"></i><span>การติดตามพัสดุ · ย่อหน้า 3</span></span>
            <span class="tag tag-ai">ความมั่นใจ 0.81</span><span class="tag">1,840 + 96 tokens</span>
          </div>
        </div>
        <div class="flex gap-2 mt-3"><input class="inp" placeholder="พิมพ์คำถามเพื่อทดลอง…"><button class="qbtn on" onclick="toast('ส่งคำถามทดลอง (mock)')"><i class="ti ti-send"></i>ส่ง</button></div>
      </div>
    </div>
    <div class="space-y-5">
      <div class="note note-warn"><i class="ti ti-lock text-lg"></i>
        <p>กด <b>เผยแพร่</b> ไม่ได้จนกว่าชุดทดสอบจะผ่านครบ — ตอนนี้ผ่าน 4 จาก 5 ข้อ</p></div>
      <div class="flex gap-3">
        <button onclick="saveMock('bots')" class="flex-1 h-10 rounded-lg bg-teal-700 text-white text-sm font-medium hover:bg-teal-800">บันทึกฉบับร่าง</button>
        <button class="flex-1 h-10 rounded-lg border border-slate-200 text-sm text-slate-400 cursor-not-allowed">เผยแพร่</button>
      </div>
    </div>
  </div>
</section>

<!-- ===== Bot tests ===== -->
<section class="view" data-view="bot-tests">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="botTestTitle">Test sets</h1>
    <p class="text-sm text-slate-500" data-i18n="botTestSubtitle">Real questions from transcripts — publishing is blocked until they pass</p></div>
    <div class="flex gap-2">
      <select class="inp w-56"><option>Order status (RAG)</option><option>Support TH — FAQ</option></select>
      <button onclick="toast('รันทั้งชุด (mock)')" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-player-play"></i>รันทั้งชุด</button>
    </div>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
    <div class="mcard"><div class="mcard-num">5</div><div class="mcard-lbl">เคสทดสอบ</div></div>
    <div class="mcard"><div class="mcard-num text-emerald-700">4</div><div class="mcard-lbl">ผ่าน</div></div>
    <div class="mcard"><div class="mcard-num text-rose-600">1</div><div class="mcard-lbl">ไม่ผ่าน</div></div>
    <div class="mcard"><div class="mcard-num">v2 → v3</div><div class="mcard-lbl">รอเผยแพร่</div></div>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">คำถามจริงจากบทสนทนา</th><th class="font-normal px-4 py-2.5">ผลที่คาดหวัง</th>
        <th class="font-normal px-4 py-2.5">ผลล่าสุด</th><th class="px-4 py-2.5"></th></tr></thead>
      <tbody id="ai-tests-body"></tbody>
    </table>
  </div>
</section>

<!-- ===== Deflection ===== -->
<section class="view" data-view="deflection">
  <div class="mb-4"><h1 class="text-xl font-semibold" data-i18n="deflTitle">Deflection</h1>
  <p class="text-sm text-slate-500" data-i18n="deflSubtitle">Containment, cost per session and why the bot handed off</p></div>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-5">
    <div class="mcard"><div class="mcard-num">12,470</div><div class="mcard-lbl">session (30 วัน)</div></div>
    <div class="mcard"><div class="mcard-num text-emerald-700">51%</div><div class="mcard-lbl">จบด้วยบอต</div></div>
    <div class="mcard"><div class="mcard-num">79</div><div class="mcard-lbl">CSAT ของ session ที่จบด้วยบอต</div></div>
    <div class="mcard"><div class="mcard-num">฿1.42</div><div class="mcard-lbl">ต้นทุนต่อ session</div></div>
    <div class="mcard"><div class="mcard-num">6,110</div><div class="mcard-lbl">งานที่ไม่ต้องใช้คน</div></div>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-4">เหตุผลที่ส่งต่อคน</h2>
      <div class="space-y-3 text-sm">
        <div><div class="flex justify-between mb-1"><span>ไม่มีคำตอบในคลังความรู้</span><b>2,410</b></div><div class="prog"><div class="p-warn" style="width:72%"></div></div></div>
        <div><div class="flex justify-between mb-1"><span>ลูกค้าขอคุยกับคน</span><b>1,880</b></div><div class="prog"><div style="width:56%"></div></div></div>
        <div><div class="flex justify-between mb-1"><span>ความมั่นใจต่ำกว่าเกณฑ์</span><b>1,204</b></div><div class="prog"><div style="width:36%"></div></div></div>
        <div><div class="flex justify-between mb-1"><span>ครบจำนวนรอบสูงสุด</span><b>866</b></div><div class="prog"><div style="width:26%"></div></div></div>
      </div>
      <p class="text-xs text-slate-400 mt-4">"ไม่มีคำตอบในคลัง" เป็นเหตุผลอันดับหนึ่ง → เป็นคิวงานใน <a class="underline" onclick="showView('kb-gaps')">คำถามที่ยังไม่มีคำตอบ</a> โดยอัตโนมัติ</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-4">งานที่บอตรับไปได้มากที่สุด</h2>
      <table class="w-full text-sm">
        <thead class="text-slate-500 text-left"><tr><th class="font-normal py-2">หัวข้อ</th><th class="font-normal py-2">session</th><th class="font-normal py-2">จบเอง</th></tr></thead>
        <tbody class="text-slate-600">
          <tr class="border-t border-slate-100"><td class="py-2">ติดตามพัสดุ</td><td class="py-2">4,120</td><td class="py-2 text-emerald-700 font-medium">78%</td></tr>
          <tr class="border-t border-slate-100"><td class="py-2">เวลาทำการ / สาขา</td><td class="py-2">2,240</td><td class="py-2 text-emerald-700 font-medium">91%</td></tr>
          <tr class="border-t border-slate-100"><td class="py-2">รีเซ็ตรหัสผ่าน</td><td class="py-2">1,860</td><td class="py-2 text-emerald-700 font-medium">69%</td></tr>
          <tr class="border-t border-slate-100"><td class="py-2">ยอดค้างชำระ</td><td class="py-2">1,410</td><td class="py-2 text-amber-600 font-medium">42%</td></tr>
          <tr class="border-t border-slate-100"><td class="py-2">เคลม/คืนสินค้า</td><td class="py-2">980</td><td class="py-2 text-rose-600 font-medium">14%</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- ===== Knowledge base (list) ===== -->
<section class="view" data-view="kb">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="kbTitle">Knowledge articles</h1>
    <p class="text-sm text-slate-500" data-i18n="kbSubtitle">One source of truth for bots, agents and customers</p></div>
    <button onclick="newKb()" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i>เขียนบทความ</button>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">บทความ</th><th class="font-normal px-4 py-2.5">คลัง</th>
        <th class="font-normal px-4 py-2.5">เจ้าของ</th><th class="font-normal px-4 py-2.5">แก้ล่าสุด</th>
        <th class="font-normal px-4 py-2.5">ทบทวนครั้งหน้า</th><th class="font-normal px-4 py-2.5">ถูกใช้ตอบ</th>
        <th class="font-normal px-4 py-2.5">นำไปสู่การส่งต่อ</th><th class="font-normal px-4 py-2.5">สถานะ</th><th class="px-4 py-2.5"></th>
      </tr></thead>
      <tbody id="ai-kb-body"></tbody>
    </table></div>
  </div>
  <p class="text-xs text-slate-400 mt-3"><i class="ti ti-info-circle mr-1"></i>บทความที่เลยกำหนดทบทวนจะถูก<b>ลดน้ำหนัก</b>ในการค้นหาอัตโนมัติ — คลังที่ไม่มีวันหมดอายุจะกลายเป็นคลังคำตอบผิดภายใน 18 เดือน</p>
</section>

<!-- ===== KB form (new/edit) ===== -->
<section class="view" data-view="kb-form">
  <button onclick="showView('kb')" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-teal-700 mb-3"><i class="ti ti-arrow-left"></i><span data-i18n="btnBack">Back</span></button>
  <h1 id="kbf-heading" class="text-xl font-semibold mb-5">New article</h1>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 max-w-5xl">
    <div class="lg:col-span-2 space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2"><label class="fld">หัวข้อ</label><input id="kbf-title" class="inp"></div>
          <div><label class="fld">คลัง</label><select id="kbf-col" class="inp"><option>สาธารณะ</option><option>ภายใน</option></select></div>
          <div><label class="fld">ภาษา</label><select class="inp"><option>ไทย</option><option>English</option></select></div>
          <div><label class="fld">เจ้าของ (บังคับ)</label><select id="kbf-owner" class="inp"><option>ทีมบริการ</option><option>ทีมเทคนิค</option><option>ฝ่ายขาย</option><option>ฝ่ายกฎหมาย</option><option>ฝ่ายบัญชี</option></select></div>
          <div><label class="fld">รอบทบทวน (วัน) — บังคับ</label><input id="kbf-review" type="number" class="inp" value="180"></div>
          <div class="md:col-span-2"><label class="fld">แท็ก</label><input id="kbf-tags" class="inp" placeholder="จัดส่ง, พัสดุ"></div>
        </div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">เนื้อหา</h2>
        <textarea id="kbf-body" class="inp" rows="10"></textarea>
      </div>
    </div>
    <div class="space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">ทดสอบการค้นเจอ</h2>
        <input class="inp mb-3" placeholder="ลองพิมพ์คำถามของลูกค้า">
        <p class="text-sm text-slate-600">คำถามที่บทความนี้ควรตอบได้:</p>
        <ul class="text-sm text-slate-600 mt-2 space-y-1">
          <li><i class="ti ti-check text-emerald-600 mr-1"></i>ของถึงเมื่อไหร่</li>
          <li><i class="ti ti-check text-emerald-600 mr-1"></i>เช็กเลขพัสดุยังไง</li>
          <li><i class="ti ti-x text-rose-500 mr-1"></i>ส่งต่างประเทศได้ไหม <span class="text-xs text-slate-400">(ยังไม่มีในบทความ)</span></li>
        </ul>
      </div>
      <div class="flex gap-3">
        <button onclick="saveMock('kb')" class="flex-1 h-10 rounded-lg bg-teal-700 text-white text-sm font-medium hover:bg-teal-800" data-i18n="btnSave">Save</button>
        <button onclick="showView('kb')" class="flex-1 h-10 rounded-lg border border-slate-300 text-sm hover:bg-slate-50" data-i18n="btnCancel">Cancel</button>
      </div>
    </div>
  </div>
</section>

<!-- ===== KB gaps ===== -->
<section class="view" data-view="kb-gaps">
  <div class="mb-4"><h1 class="text-xl font-semibold" data-i18n="kbGapTitle">Knowledge gaps</h1>
  <p class="text-sm text-slate-500" data-i18n="kbGapSubtitle">Questions with no answer yet — the writing queue</p></div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">คำถามที่ตอบไม่ได้</th><th class="font-normal px-4 py-2.5">จำนวน</th>
        <th class="font-normal px-4 py-2.5">พบครั้งแรก</th><th class="font-normal px-4 py-2.5">มอบหมาย</th>
        <th class="font-normal px-4 py-2.5">สถานะ</th><th class="px-4 py-2.5"></th></tr></thead>
      <tbody id="ai-gaps-body"></tbody>
