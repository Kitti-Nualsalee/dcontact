<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Contact — Journeys</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-slate-50 text-slate-800" data-area="journeys" data-default="journeys">
<div id="app"></div>
<template id="area-main"><main class="p-6">

<!-- ===== Journeys (list) ===== -->
<section class="view active" data-view="journeys">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="jrTitle">Journeys</h1>
    <p class="text-sm text-slate-500" data-i18n="jrSubtitle">Automation that lives with the customer, not with a single contact</p></div>
    <button onclick="newJourney()" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i><span data-i18n="btnNew">New</span></button>
  </div>
  <div class="note note-info mb-4"><i class="ti ti-info-circle text-lg"></i>
    <p>ลำดับการติดต่อ <b>ไม่สร้างงานเอง</b> — มันสั่งผ่านช่องทาง/แคมเปญ/เคส เหมือนที่ dialer ทำ
    (<a class="underline" href="../docs/adr/025-journey-orchestration.md">ADR-025</a> ข้อ 2) และทุกขั้นต้องผ่าน
    <a class="underline" onclick="showView('contact-policy')">เพดานการติดต่อของลูกค้า</a>ก่อนเสมอ</p></div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">ลำดับการติดต่อ</th><th class="font-normal px-4 py-2.5">เริ่มเมื่อ</th>
        <th class="font-normal px-4 py-2.5">กำลังอยู่ในลำดับ</th><th class="font-normal px-4 py-2.5">บรรลุเป้าหมาย</th>
        <th class="font-normal px-4 py-2.5">สายที่ไม่เกิด</th><th class="font-normal px-4 py-2.5">สถานะ</th><th class="px-4 py-2.5"></th>
      </tr></thead>
      <tbody id="jr-body"></tbody>
    </table></div>
  </div>
  <p class="text-xs text-slate-400 mt-3"><i class="ti ti-flag-check mr-1"></i>"สายที่ไม่เกิด" วัดจากการเทียบกลุ่มที่อยู่ในลำดับกับ<b>กลุ่มควบคุม 5%</b> ที่กันไว้ไม่ให้เข้า — ไม่ใช่การเดา</p>
</section>

<!-- ===== Journey form (new/edit) ===== -->
<section class="view" data-view="journey-form">
  <button onclick="showView('journeys')" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-teal-700 mb-3"><i class="ti ti-arrow-left"></i><span data-i18n="btnBack">Back</span></button>
  <h1 id="jrf-heading" class="text-xl font-semibold mb-5">New journey</h1>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 max-w-5xl">
    <div class="lg:col-span-2 space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">1 · เริ่มเมื่อไหร่</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2"><label class="fld">ชื่อ</label><input id="jrf-name" class="inp" placeholder="เช่น ทวงถามค่างวดที่จ่ายไม่ผ่าน"></div>
          <div><label class="fld">ตัวกระตุ้น</label>
            <select id="jrf-trigger" class="inp">
              <option>เหตุการณ์จากระบบภายนอก</option>
              <option>ตารางเวลา</option>
              <option>เข้ากลุ่มเป้าหมาย</option>
              <option>ผลของการติดต่อ (เช่น CSAT ต่ำ)</option>
            </select></div>
          <div><label class="fld">ชื่อเหตุการณ์</label><input id="jrf-event" class="inp font-mono text-[13px]" placeholder="payment.failed"></div>
          <div class="md:col-span-2"><label class="fld">กลุ่มเป้าหมาย</label>
            <select id="jrf-segment" class="inp"><option>ลูกค้าที่มียอดค้าง</option><option>ใกล้หมดอายุใน 30 วัน</option><option>VIP ที่ติดต่อบ่อยเดือนนี้</option><option>— ทุกคนที่เข้าเงื่อนไขเหตุการณ์ —</option></select></div>
        </div>
        <div class="note note-info mt-4"><i class="ti ti-api text-lg"></i>
          <p>ระบบธุรกิจของคุณยิงเหตุการณ์เข้ามาที่ <code>POST /api/v1/events</code> — เป็นทางเข้าเดียวกับที่
          <a class="underline" href="integrations.html?view=event-catalog">แคตตาล็อก event</a> ประกาศไว้</p></div>
      </div>

      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">2 · ทำอะไรบ้าง</h2>
        <div class="space-y-2">
          <div class="qq flex items-center gap-3"><span class="chat-ic" style="background:#dcfce7;color:#15803d"><i class="ti ti-brand-line"></i></span>
            <div class="flex-1"><b class="text-sm">วันที่ 0 — ส่ง LINE พร้อมลิงก์ชำระ</b><p class="text-xs text-slate-500">ผ่านเพดานการติดต่อ · ชนิด: ประชาสัมพันธ์</p></div>
            <span class="icon-btn"><i class="ti ti-pencil"></i></span></div>
          <div class="qq flex items-center gap-3"><span class="chat-ic" style="background:#f1f5f9;color:#64748b"><i class="ti ti-clock"></i></span>
            <div class="flex-1"><b class="text-sm">รอ 24 ชั่วโมง</b><p class="text-xs text-slate-500">ถ้าจ่ายแล้วออกจากลำดับทันที</p></div>
            <span class="icon-btn"><i class="ti ti-pencil"></i></span></div>
          <div class="qq flex items-center gap-3"><span class="chat-ic" style="background:#fef3c7;color:#b45309"><i class="ti ti-message"></i></span>
            <div class="flex-1"><b class="text-sm">วันที่ 1 — ส่ง SMS ย้ำ</b><p class="text-xs text-slate-500">เฉพาะคนที่ยังไม่จ่าย</p></div>
            <span class="icon-btn"><i class="ti ti-pencil"></i></span></div>
          <div class="qq flex items-center gap-3"><span class="chat-ic" style="background:#e0e7ff;color:#4338ca"><i class="ti ti-phone-outgoing"></i></span>
            <div class="flex-1"><b class="text-sm">วันที่ 3 — ป้อนเข้าแคมเปญโทร (preview)</b><p class="text-xs text-slate-500">ใช้ pacing และ DNC ของแคมเปญนั้น — ไม่สร้างสายเอง</p></div>
            <span class="icon-btn"><i class="ti ti-pencil"></i></span></div>
          <div class="qq flex items-center gap-3"><span class="chat-ic" style="background:#ede9fe;color:#6d28d9"><i class="ti ti-ticket"></i></span>
            <div class="flex-1"><b class="text-sm">วันที่ 5 — เปิดเคสให้ทีมติดตาม</b><p class="text-xs text-slate-500">ประเภท: ติดตามหนี้ · SLA 3 วัน</p></div>
            <span class="icon-btn"><i class="ti ti-pencil"></i></span></div>
        </div>
        <button class="qbtn mt-3" onclick="toast('เพิ่มขั้นตอน (mock)')"><i class="ti ti-plus"></i>เพิ่มขั้นตอน</button>
      </div>

      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">3 · จบเมื่อไหร่ (บังคับกรอก)</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2"><label class="fld">เป้าหมายที่วัดได้</label><input id="jrf-goal" class="inp" placeholder="เช่น payment.succeeded ภายใน 7 วัน"></div>
          <div><label class="fld">อายุสูงสุด (วัน)</label><input id="jrf-maxdays" type="number" class="inp" value="30"></div>
          <div><label class="fld">ลำดับความสำคัญ</label><input id="jrf-priority" type="number" class="inp" value="5"></div>
        </div>
        <h3 class="text-sm font-medium text-slate-700 mt-4 mb-2">ออกจากลำดับเมื่อ</h3>
        <div class="space-y-2 text-sm">
          <label class="flex items-center gap-2.5 border border-slate-200 rounded-lg px-3 py-2.5"><input type="checkbox" checked disabled class="accent-teal-700">บรรลุเป้าหมาย (บังคับ)</label>
          <label class="flex items-center gap-2.5 border border-slate-200 rounded-lg px-3 py-2.5"><input type="checkbox" checked class="accent-teal-700">ลูกค้ากำลังคุยกับเจ้าหน้าที่อยู่</label>
          <label class="flex items-center gap-2.5 border border-slate-200 rounded-lg px-3 py-2.5"><input type="checkbox" checked class="accent-teal-700">ลูกค้าขอไม่ให้ติดต่อ</label>
          <label class="flex items-center gap-2.5 border border-slate-200 rounded-lg px-3 py-2.5"><input type="checkbox" class="accent-teal-700">เข้าลำดับอื่นที่สำคัญกว่า</label>
        </div>
      </div>
    </div>

    <div class="space-y-5">
      <div class="note note-warn"><i class="ti ti-flag-off text-lg"></i>
        <p><b>ไม่มีลำดับที่ไม่มีวันจบ</b> — ต้องมีเป้าหมายที่วัดได้และเพดานอายุ ไม่งั้น publish ไม่ผ่าน
        ลูกค้าที่จ่ายเงินแล้วต้องหลุดจากลำดับทวงถามทันที</p></div>
      <div class="note note-bad"><i class="ti ti-shield-half text-lg"></i>
        <p>ทุกขั้นที่ติดต่อลูกค้าผ่าน <b>เพดานการติดต่อรายลูกค้า</b> ก่อนเสมอ — ถูกกดแล้วบันทึกเหตุผล ไม่หายเงียบ</p></div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-2">กลุ่มควบคุม</h2>
        <label class="flex items-center gap-2.5 text-sm"><input type="checkbox" checked class="accent-teal-700">กัน 5% ไม่ให้เข้าลำดับนี้</label>
        <p class="text-xs text-slate-400 mt-2">ใช้วัดว่าลำดับนี้ลดสายเข้าได้จริงเท่าไร — ตั้งไม่ได้ทีหลัง ต้องตั้งตั้งแต่วันแรก</p>
      </div>
      <div class="flex gap-3">
        <button onclick="saveMock('journeys')" class="flex-1 h-10 rounded-lg bg-teal-700 text-white text-sm font-medium hover:bg-teal-800">บันทึกฉบับร่าง</button>
        <button onclick="toast('ต้องมีคนที่สองอนุมัติก่อน publish (mock)')" class="flex-1 h-10 rounded-lg border border-slate-300 text-sm hover:bg-slate-50">ขออนุมัติ</button>
      </div>
    </div>
  </div>
</section>

<!-- ===== Journey results ===== -->
<section class="view" data-view="journey-insights">
  <div class="mb-4"><h1 class="text-xl font-semibold" data-i18n="jrResTitle">Journey results</h1>
  <p class="text-sm text-slate-500" data-i18n="jrResSubtitle">Did it help, or did we just interrupt people?</p></div>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-5">
    <div class="mcard"><div class="mcard-num">10,385</div><div class="mcard-lbl">คนที่อยู่ในลำดับตอนนี้</div></div>
    <div class="mcard"><div class="mcard-num text-emerald-700">52%</div><div class="mcard-lbl">บรรลุเป้าหมาย</div></div>
    <div class="mcard"><div class="mcard-num text-emerald-700">-27%</div><div class="mcard-lbl">สายเข้าที่ลดลง เทียบกลุ่มควบคุม</div></div>
    <div class="mcard"><div class="mcard-num text-amber-600">8.4%</div><div class="mcard-lbl">ถูกเพดานการติดต่อกดไว้</div></div>
    <div class="mcard"><div class="mcard-num text-rose-600">0.9%</div><div class="mcard-lbl">ขอเลิกรับข้อความ</div></div>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-4">เทียบกับกลุ่มควบคุม (30 วัน)</h2>
      <table class="w-full text-sm">
        <thead class="text-slate-500 text-left"><tr><th class="font-normal py-2">ลำดับ</th><th class="font-normal py-2">อยู่ในลำดับ</th><th class="font-normal py-2">กลุ่มควบคุม</th><th class="font-normal py-2">ต่าง</th></tr></thead>
        <tbody class="text-slate-600">
          <tr class="border-t border-slate-100"><td class="py-2">แจ้งสถานะการจัดส่ง</td><td class="py-2">สายถามสถานะ 4%</td><td class="py-2">14%</td><td class="py-2 text-emerald-700 font-semibold">-71%</td></tr>
          <tr class="border-t border-slate-100"><td class="py-2">ทวงถามค่างวด</td><td class="py-2">จ่ายใน 7 วัน 46%</td><td class="py-2">31%</td><td class="py-2 text-emerald-700 font-semibold">+15 จุด</td></tr>
          <tr class="border-t border-slate-100"><td class="py-2">ต่ออายุก่อนหมดสัญญา</td><td class="py-2">ต่ออายุ 29%</td><td class="py-2">26%</td><td class="py-2 text-amber-600">+3 จุด</td></tr>
        </tbody>
      </table>
      <p class="text-xs text-slate-400 mt-3">"ต่ออายุ" ต่างกันแค่ 3 จุด — คุ้มกับการรบกวนลูกค้าหรือยัง เป็นคำถามที่ต้องตอบก่อนขยายลำดับนี้</p>
    </div>
    <div class="space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">ผลข้างเคียงที่ต้องเฝ้า</h2>
        <div class="space-y-3 text-sm">
          <div><div class="flex justify-between mb-1"><span>ถูกเพดานกด (suppression)</span><b class="text-amber-600">8.4%</b></div><div class="prog"><div class="p-warn" style="width:8.4%"></div></div></div>
          <div><div class="flex justify-between mb-1"><span>ขอเลิกรับข้อความ</span><b class="text-rose-600">0.9%</b></div><div class="prog"><div class="p-bad" style="width:9%"></div></div></div>
          <div><div class="flex justify-between mb-1"><span>ตอบกลับแล้วกลายเป็นงานของคน</span><b>12%</b></div><div class="prog"><div style="width:12%"></div></div></div>
        </div>
        <div class="note note-warn mt-4"><i class="ti ti-alert-triangle text-lg"></i>
          <p>suppression 8.4% แปลว่า <b>ทุก 12 ข้อความที่ตั้งใจส่ง มี 1 ข้อความไม่ได้ส่ง</b> — ถ้าตัวเลขนี้โตขึ้นเรื่อย ๆ แปลว่าลำดับต่าง ๆ กำลังแย่งโควตากันเอง</p></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== Segments ===== -->
<section class="view" data-view="segments">
  <div class="flex items-end justify-between mb-4">
    <div><h1 class="text-xl font-semibold" data-i18n="sgTitle">Segments</h1>
    <p class="text-sm text-slate-500" data-i18n="sgSubtitle">Definitions, not frozen lists</p></div>
    <button onclick="newSegment()" class="inline-flex items-center gap-1.5 text-sm font-medium bg-teal-700 text-white rounded-lg px-3.5 py-2 hover:bg-teal-800"><i class="ti ti-plus"></i><span data-i18n="btnNew">New</span></button>
  </div>
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap">
      <thead class="text-slate-500 text-left bg-slate-50/60"><tr class="border-b border-slate-100">
        <th class="font-normal px-4 py-2.5">กลุ่ม</th><th class="font-normal px-4 py-2.5">นิยาม</th>
        <th class="font-normal px-4 py-2.5">ขนาดล่าสุด</th><th class="font-normal px-4 py-2.5">ประเมินใหม่</th>
        <th class="font-normal px-4 py-2.5">ถูกใช้โดย</th><th class="px-4 py-2.5"></th>
      </tr></thead>
      <tbody id="sg-body"></tbody>
    </table></div>
  </div>
  <p class="text-xs text-slate-400 mt-3"><i class="ti ti-info-circle mr-1"></i>ค่าที่ดึงสดจาก CRM ใช้ทำกลุ่มไม่ได้ — ประเมินกลุ่มทีละแสนคนแปลว่ายิง CRM แสนครั้ง ค่าที่ใช้เล็งกลุ่มต้องถูกซิงก์มาตามรอบ</p>
</section>

<!-- ===== Segment form (new/edit) ===== -->
<section class="view" data-view="segment-form">
  <button onclick="showView('segments')" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-teal-700 mb-3"><i class="ti ti-arrow-left"></i><span data-i18n="btnBack">Back</span></button>
  <h1 id="sgf-heading" class="text-xl font-semibold mb-5">New segment</h1>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 max-w-5xl">
    <div class="lg:col-span-2 bg-white border border-slate-200 rounded-xl p-5 space-y-4">
      <div><label class="fld">ชื่อกลุ่ม</label><input id="sgf-name" class="inp"></div>
      <div><label class="fld">นิยาม (นิพจน์ sandbox เดียวกับ Flow)</label>
        <textarea id="sgf-def" class="inp font-mono text-[13px]" rows="3" placeholder="attrs.balanceDue > 0 && interactions30d < 3"></textarea></div>
      <div><label class="fld">ประเมินใหม่ทุก (นาที)</label><input id="sgf-refresh" type="number" class="inp" value="60"></div>
      <div class="note note-info"><i class="ti ti-users text-lg"></i><p>ขนาดโดยประมาณตอนนี้: <b>4,820 คน</b> · คนที่เข้าใหม่ในกลุ่มนี้จะถูกดึงเข้าลำดับที่ผูกไว้โดยอัตโนมัติ</p></div>
      <div class="flex gap-3 max-w-sm">
        <button onclick="saveMock('segments')" class="flex-1 h-10 rounded-lg bg-teal-700 text-white text-sm font-medium hover:bg-teal-800" data-i18n="btnSave">Save</button>
        <button onclick="showView('segments')" class="flex-1 h-10 rounded-lg border border-slate-300 text-sm hover:bg-slate-50" data-i18n="btnCancel">Cancel</button>
      </div>
    </div>
  </div>
</section>

<!-- ===== Contact policy ===== -->
<section class="view" data-view="contact-policy">
  <div class="mb-4"><h1 class="text-xl font-semibold" data-i18n="cpTitle2">Contact policy</h1>
  <p class="text-sm text-slate-500" data-i18n="cpSubtitle2">One ceiling per customer across every campaign, journey and broadcast</p></div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
    <div class="lg:col-span-2 space-y-5">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">เพดานต่อลูกค้าหนึ่งคน</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div><label class="fld">สูงสุดต่อวัน</label><input type="number" class="inp" value="1"></div>
          <div><label class="fld">สูงสุดต่อสัปดาห์</label><input type="number" class="inp" value="3"></div>
