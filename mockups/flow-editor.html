function buildGraph(id) {
  const g = G[id] || G.flow_voice_mainmenu;
  const nodes = g.n.map(function (r) {
    return { id: r[0], type: 'flow', position: { x: r[4], y: r[5] }, data: mkData(r[1], r[2], r[3]) };
  });
  const edges = g.e.map(function (r, i) {
    return { id: 'e' + i, source: r[0], target: r[1], label: r[2] || undefined,
             markerEnd: { type: MarkerType.ArrowClosed }, style: { stroke: '#94a3b8' } };
  });
  return { nodes: nodes, edges: edges };
}

/* ---------- custom node ---------- */
function FlowNode(props) {
  const d = props.data;
  return html`<div class=${'fn' + (props.selected ? ' sel' : '')} style=${{ '--c': d.color }}>
    <${Handle} type="target" position=${Position.Top} />
    <div class="fn-h"><i class=${'ti ' + d.icon}></i><span>${d.nlabel}</span></div>
    <div class="fn-b">
      <div class="fn-t">${d.title}</div>
      ${d.subtitle ? html`<div class="fn-s">${d.subtitle}</div>` : null}
    </div>
    <${Handle} type="source" position=${Position.Bottom} />
  </div>`;
}
const nodeTypes = { flow: FlowNode };

/* ---------- toast ---------- */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'fixed bottom-6 right-6 z-50 bg-slate-800 text-white text-sm rounded-lg px-4 py-2.5 shadow-lg flex items-center gap-2';
  el.innerHTML = '<i class="ti ti-check text-emerald-400"></i>' + msg;
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 2200);
}

/* ---------- editor ---------- */
function Editor() {
  const rf = useReactFlow();
  const idc = useRef(100);
  const flowId = new URLSearchParams(location.search).get('id') || 'flow_voice_mainmenu';
  const meta = FLOW_META[flowId] || FLOW_META.flow_voice_mainmenu;
  const init = useMemo(function () { return buildGraph(flowId); }, [flowId]);
  const [nodes, setNodes, onNodesChange] = useNodesState(init.nodes);
  const [edges, setEdges, onEdgesChange] = useEdgesState(init.edges);
  const [selId, setSelId] = useState(null);
  const selNode = useMemo(function () { return nodes.find(function (n) { return n.id === selId; }) || null; }, [nodes, selId]);

  const onConnect = useCallback(function (params) {
    setEdges(function (es) { return addEdge(Object.assign({}, params, { markerEnd: { type: MarkerType.ArrowClosed }, style: { stroke: '#94a3b8' } }), es); });
  }, [setEdges]);

  const onDrop = useCallback(function (e) {
    e.preventDefault();
    const kind = e.dataTransfer.getData('application/flownode');
    if (!kind || !NODE_DEF[kind]) return;
    const pos = rf.screenToFlowPosition({ x: e.clientX, y: e.clientY });
    const id = 'n' + (idc.current++);
    const def = NODE_DEF[kind];
    setNodes(function (ns) { return ns.concat({ id: id, type: 'flow', position: pos, data: mkData(kind, def.label, '') }); });
  }, [rf, setNodes]);
  const onDragOver = useCallback(function (e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }, []);

  const onNodeClick = useCallback(function (e, node) { setSelId(node.id); }, []);
  const onPaneClick = useCallback(function () { setSelId(null); }, []);
  const updateField = useCallback(function (field, val) {
    setNodes(function (ns) { return ns.map(function (n) { return n.id === selId ? Object.assign({}, n, { data: Object.assign({}, n.data, { [field]: val }) }) : n; }); });
  }, [selId, setNodes]);
  const deleteNode = useCallback(function (id) {
    setNodes(function (ns) { return ns.filter(function (n) { return n.id !== id; }); });
    setEdges(function (es) { return es.filter(function (e) { return e.source !== id && e.target !== id; }); });
    setSelId(null);
  }, [setNodes, setEdges]);

  const statusPill = meta.status === 'published'
    ? html`<span class="st st-available">Published</span>`
    : html`<span class="st st-acw">Draft</span>`;

  return html`<div class="h-screen flex flex-col">
    <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 shrink-0">
      <div class="flex items-center gap-3 min-w-0">
        <a href="routing.html?view=flows" class="text-slate-400 hover:text-teal-700 shrink-0" title="Back to Flows"><i class="ti ti-arrow-left text-lg"></i></a>
        <span class="w-8 h-8 rounded-lg bg-teal-700 text-white flex items-center justify-center text-sm font-semibold shrink-0">D</span>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <input class="font-semibold text-slate-800 text-sm bg-transparent border-0 focus:outline-none focus:bg-slate-50 rounded px-1 -ml-1 min-w-0" value=${meta.name} />
            <span class="text-xs text-slate-400 shrink-0">v${meta.ver}</span>
          </div>
          <div class="flex items-center gap-2 mt-0.5">
            <span class=${'ch ch-' + meta.ch} style=${{ height: '18px', fontSize: '10px', padding: '0 6px' }}><i class=${'ti ' + CH_ICON[meta.ch]}></i>${meta.ch}</span>
            ${statusPill}
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button class="h-9 px-3 rounded-lg border border-slate-300 text-sm hover:bg-slate-50 flex items-center gap-1.5" onClick=${function () { toast('Simulation started (mock)'); }}><i class="ti ti-player-play"></i>Simulate</button>
        <button class="h-9 px-3 rounded-lg border border-slate-300 text-sm hover:bg-slate-50" onClick=${function () { toast('Draft saved (mock)'); }}>Save draft</button>
        <button class="h-9 px-3.5 rounded-lg bg-teal-700 text-white text-sm font-medium hover:bg-teal-800 flex items-center gap-1.5" onClick=${function () { toast('Flow published (mock)'); }}><i class="ti ti-rocket"></i>Publish</button>
      </div>
    </header>
    <div class="flex-1 flex min-h-0">
      <${Palette} />
      <div class="flex-1 relative" onDrop=${onDrop} onDragOver=${onDragOver}>
        <${ReactFlow}
          nodes=${nodes} edges=${edges} nodeTypes=${nodeTypes}
          onNodesChange=${onNodesChange} onEdgesChange=${onEdgesChange} onConnect=${onConnect}
          onNodeClick=${onNodeClick} onPaneClick=${onPaneClick}
          fitView fitViewOptions=${{ padding: 0.15 }} minZoom=${0.2}
          onInit=${function (inst) { setTimeout(function () { inst.fitView({ padding: 0.15 }); }, 60); }}
          proOptions=${{ hideAttribution: true }}>
          <${Background} color="#e2e8f0" gap=${18} />
          <${Controls} />
          <${MiniMap} pannable zoomable nodeColor=${function (n) { return n.data && n.data.color ? n.data.color : '#94a3b8'; }} />
        </${ReactFlow}>
      </div>
      <${Inspector} node=${selNode} onChange=${updateField} onDelete=${deleteNode} />
    </div>
  </div>`;
}

createRoot(document.getElementById('root')).render(
  html`<${ReactFlowProvider}><${Editor} /></${ReactFlowProvider}>`
);
</script>
</body>
</html>
