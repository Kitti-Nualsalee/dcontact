      <textarea id="cmp" class="ctl" rows="2" placeholder="พิมพ์ข้อความถึงลูกค้า" style="${['offer','offer-low','default'].includes(state) ? 'box-shadow:var(--dc-focus-ring)' : ''}">${draft}</textarea>
      <div class="flex items-center gap-3 mt-2"><span class="text-[12px] text-slate-500">Enter ส่ง · Shift+Enter ขึ้นบรรทัดใหม่</span><span class="flex-1"></span>
        <span class="mono text-[12px] text-slate-500">${draft.length} / 2,000</span>
        <button class="btn btn-primary" ${off || !draft ? 'disabled' : ''}><i class="ti ti-send"></i>ส่ง</button></div></div>`;
  }
  m.innerHTML = head + bar + tabs + scroller + composer;
  const sc = $('scroll'); if (sc && state !== 'long') sc.scrollTop = sc.scrollHeight;
  if (sc && state === 'long') sc.scrollTop = 120;
}

// ---------- inspector ----------
function renderInspector(rooms, sel) {
  const r = sel ? rooms[sel] : null;
  $('itabs').innerHTML = ['สรุปผล','รายละเอียด','เหตุการณ์','ความพร้อม'].map((t,i) => `<button class="tab ${i===0?'on':''}" role="tab">${t}</button>`).join('');
  const ins = $('inspector');
  if (!r) { ins.innerHTML = `<p class="text-[13px] text-slate-600">ยังไม่มีงานที่ต้องสรุปผล</p>`; return; }
  if (r.state !== 'wrap') {
    ins.innerHTML = `<p class="text-[13px] text-slate-600">บันทึกผลได้เมื่อแชท <b>${r.name}</b> จบ (Agent กดจบแชท, ลูกค้าออก หรือระบบปิดเพราะไม่มีการตอบ)</p>
      <dl class="mt-4 grid gap-y-2 text-[13px]" style="grid-template-columns:96px 1fr"><dt class="text-slate-500">ช่องทาง</dt><dd>Web Chat</dd><dt class="text-slate-500">คิว</dt><dd>${r.queue}</dd><dt class="text-slate-500">ลูกค้า</dt><dd><span class="text-amber-800 font-medium">ยังไม่ได้เลือก</span></dd><dt class="text-slate-500">รหัสงาน</dt><dd class="mono text-[12px] text-slate-500">7f3c2e10-…-a91e</dd></dl>`;
    return;
  }
  ins.innerHTML = `<div class="space-y-4">
    <div><p class="text-[12px] text-slate-500">หลังจบแชท · ${r.name}</p><h3 class="text-[15px] font-semibold">สรุปผลหลังแชท</h3>
      <p class="text-[13px] text-slate-600 mt-1">เลือกผลการติดต่อและเขียนโน้ตก่อนปิดงาน ห้องนี้นับในเพดานจนกว่าจะบันทึกผล</p></div>
    <fieldset><legend class="fld2">ผลการติดต่อ</legend><div class="space-y-2">
      <label class="radio on"><input type="radio" name="d" checked class="accent-teal-700">ลูกค้าได้รับความช่วยเหลือ</label>
      <label class="radio"><input type="radio" name="d" class="accent-teal-700">ต้องติดตามต่อ</label></div></fieldset>
    <div><label class="fld2" for="wn">โน้ตสรุป</label><textarea id="wn" class="ctl" rows="5">ลูกค้าขอเปลี่ยนที่อยู่จัดส่ง ยังไม่ได้ให้เลขคำสั่งซื้อก่อนออกจากแชท</textarea>
      <p class="help"><span></span><span class="mono">58 / 2,000 ตัวอักษร</span></p></div>
    <button class="btn btn-primary w-full">บันทึกผล</button>
  </div>`;
}

function render() {
  const rooms = roomsFor(state);
  const sel = selectedFor(state);
  renderTop(rooms); renderAlerts(); renderList(rooms, sel); renderMain(rooms, sel); renderInspector(rooms, sel);
  $('layer').innerHTML = state === 'saved' ? `<div class="toast" role="status"><i class="ti ti-circle-check text-emerald-600 text-lg"></i>บันทึกผลแชท #E5F6 แล้ว</div>` : '';
  const sel2 = $('mk-state');
  sel2.innerHTML = Object.keys(STATES).map(s => `<option ${s === state ? 'selected' : ''}>${s}</option>`).join('');
  $('mk-desc').textContent = STATES[state];
}
$('mk-state').onchange = e => { state = e.target.value; const u = new URL(location.href); u.searchParams.set('state', state); history.replaceState(null,'',u); render(); };
render();
</script>
</body>
</html>
