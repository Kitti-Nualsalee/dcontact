<body>
<div class="mk-bar" id="mk-bar">
  <b>#1044 Console</b>
  <button data-v="settings">1 ตั้งค่า Web Chat</button>
  <button data-v="team">2 ประวัติงานของทีม</button>
  <button data-v="detail">3 รายละเอียดงานแชท</button>
  <button data-v="mine">4 ประวัติงานของฉัน (Agent)</button>
  <label>state <select id="mk-state"></select></label>
</div>

<div class="flex" style="min-height:calc(100vh - var(--mk,0px))">
  <aside class="rail" id="rail"></aside>
  <nav class="subnav bg-white border-r border-slate-200 p-2 shrink-0" style="width:220px" id="subnav"></nav>
  <div class="flex-1 min-w-0 flex flex-col">
    <header class="h-11 shrink-0 bg-white border-b border-slate-200 flex items-center gap-3 px-6 text-[13px]" id="crumb"></header>
    <main class="p-6" id="c-main"></main>
  </div>
</div>
<div id="layer"></div>

<script>
const STATES = {
  settings: ['default','first-time','cannot-enable','validation','save-error','saved','loading','supervisor-readonly','forbidden','long'],
  team: ['default','filter-chat','empty-chat','loading','error'],
  detail: ['default','unlinked-idle','partial','long'],
  mine: ['default'],
};
const P = new URLSearchParams(location.search);
let view = P.get('view') || 'settings';
let state = P.get('state') || 'default';
if (P.get('shot')) document.body.classList.add('shot');
document.documentElement.style.setProperty('--mk', P.get('shot') ? '0px' : document.getElementById('mk-bar').offsetHeight + 'px');
const $ = id => document.getElementById(id);

function shell() {
  const hist = view !== 'settings';
  $('rail').innerHTML = [['ti-home','หน้าแรก'],['ti-history','ประวัติ',hist],['ti-route','การกระจายงาน'],['ti-users','บุคลากร'],['ti-plug-connected','การเชื่อมต่อ',!hist]]
    .map(([i,l,on]) => `<button class="rail-btn ${on ? 'active' : ''}" ${on ? 'aria-current="page"' : ''} title="${l}"><i class="ti ${i}"></i><span class="rail-label">${l}</span></button>`).join('');
  $('subnav').setAttribute('aria-label', hist ? 'ประวัติ' : 'การเชื่อมต่อ');
  $('subnav').innerHTML = hist
    ? `<div class="h-9 flex items-center px-3 text-[13px] font-semibold">ประวัติ</div><p class="sh">งาน</p>
       ${view === 'mine' ? `<a href="#" class="on" aria-current="page"><i class="ti ti-user"></i>ประวัติงานของฉัน</a>` : `<a href="#" class="on" aria-current="page"><i class="ti ti-users-group"></i>ประวัติงานของทีม</a>`}`
    : `<div class="h-9 flex items-center px-3 text-[13px] font-semibold">การเชื่อมต่อ</div>
       <p class="sh">ช่องทางลูกค้า</p><a href="#" class="on" aria-current="page"><i class="ti ti-message-circle"></i>Web Chat</a>
       <p class="sh">ฝังระบบ</p><a href="#"><i class="ti ti-phone"></i>ฝัง dphone ในระบบอื่น</a>`;
  const who = view === 'mine' ? 'ปกรณ์ ศรีสุข' : state === 'supervisor-readonly' ? 'อรทัย พงษ์ไพร (Supervisor)' : 'วิไล ศักดิ์สิทธิ์ (Admin)';
  $('crumb').innerHTML = `<span class="text-slate-500">demo-retail</span><span class="text-slate-400">/</span><span>${hist ? 'ประวัติ' : 'การเชื่อมต่อ'}</span><span class="text-slate-400">/</span><span>${hist ? (view === 'mine' ? 'ประวัติงานของฉัน' : 'ประวัติงานของทีม') : 'Web Chat'}</span>
    <div class="flex-1"></div><span class="text-slate-600">${who}</span><span class="w-7 h-7 rounded-full bg-slate-200 flex items-center justify-center text-xs">วศ</span>`;
}

// ---------- 1) ตั้งค่า Web Chat ----------
const ORIGINS = ['https://shop.demo-retail.co.th','https://www.demo-retail.co.th'];
function settings() {
  const first = state === 'first-time', cannot = state === 'cannot-enable', ro = state === 'supervisor-readonly';
  const val = state === 'validation', long = state === 'long';
  const enabled = !(first || cannot);
  const origins = first || cannot ? [] : long ? [...ORIGINS, 'https://promotion-campaign-2569-very-long-subdomain-for-black-friday.demo-retail-group-holdings.co.th', 'https://m.demo-retail.co.th', 'https://partner.demo-retail.co.th'] : ORIGINS;
  const queue = first ? '' : cannot ? '' : 'Online Sales';
  const dis = ro ? 'disabled' : '';
  if (state === 'loading') return `<div aria-busy="true"><span class="sr-only" role="status">กำลังโหลดการตั้งค่า Web Chat</span>
    <span class="sk mb-3" style="width:160px;height:24px"></span><span class="sk mb-5" style="width:420px;height:14px"></span>
    <div class="g3"><div class="space-y-5">${[180,200,220].map(h => `<div class="card"><span class="sk" style="height:${h}px"></span></div>`).join('')}</div>
    <div class="card"><span class="sk" style="height:180px"></span></div></div></div>`;
  if (state === 'forbidden') return `<h1 class="text-xl font-semibold mb-2">Web Chat</h1>
    <div class="card" style="max-width:560px"><div class="flex gap-3"><i class="ti ti-lock text-2xl text-slate-500"></i><div>
    <h2 class="text-[15px] font-semibold">บัญชีนี้ไม่มีสิทธิ์ดูการตั้งค่า Web Chat</h2>
    <p class="text-[13px] text-slate-600 mt-1">หน้านี้สำหรับ Admin และ Supervisor ของ tenant ติดต่อ Admin ขององค์กรถ้าต้องการเปลี่ยนการตั้งค่า</p></div></div></div>`;
  const originRows = origins.length ? origins.map(o => `<li class="orow"><i class="ti ti-world text-slate-500"></i><span class="trunc flex-1" title="${o}">${o}</span>
      ${ro ? '' : `<button class="btn btn-sm btn-ghost" aria-label="ลบโดเมน ${o}"><i class="ti ti-trash"></i>ลบ</button>`}</li>`).join('')
    : `<li class="text-[13px] text-slate-600 py-3">ยังไม่มีโดเมน widget จะไม่แสดงบนเว็บใดจนกว่าจะเพิ่มอย่างน้อย 1 โดเมน</li>`;
  const ok = (b, t, fix) => `<li><i class="ti ${b ? 'ti-circle-check ok' : 'ti-alert-circle no'}"></i><span class="flex-1">${t}</span>${!b && fix ? `<a href="#${fix}" class="text-[12px] text-teal-700 font-medium">ไปที่ช่องนี้</a>` : ''}</li>`;
  return `

    <div><h1 class="text-xl font-semibold flex items-center gap-3">Web Chat <span class="chip ${enabled ? 'chip-on' : 'chip-off'}">${enabled ? 'เปิดใช้งาน' : first ? 'ยังไม่ได้ตั้งค่า' : 'ปิดอยู่'}</span></h1>

  $('layer').innerHTML = view === 'settings' && state === 'saved' ? `<div class="toast" role="status"><i class="ti ti-circle-check text-emerald-600 text-lg"></i>บันทึกการตั้งค่า Web Chat แล้ว</div>` : '';
  document.querySelectorAll('.mk-bar [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('mk-state').innerHTML = STATES[view].map(s => `<option ${s === state ? 'selected' : ''}>${s}</option>`).join('');
}
document.querySelectorAll('.mk-bar [data-v]').forEach(b => b.onclick = () => { view = b.dataset.v; state = 'default'; sync(); });
$('mk-state').onchange = e => { state = e.target.value; sync(); };
function sync() { const u = new URL(location.href); u.searchParams.set('view', view); u.searchParams.set('state', state); history.replaceState(null, '', u); render(); }
render();
</script>
</body>
</html>
