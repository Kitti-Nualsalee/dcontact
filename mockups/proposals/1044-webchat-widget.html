<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Contact — #1044 Web Chat widget (ข้อเสนอ)</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<style>
/* ข้อเสนอ #1044 widget — อยู่นอก design system ของแอป (ไม่มี React/ui-react)
   ตัวแปรตั้งชื่อตาม token ของ packages/ui; widget จริงควร "สร้าง" ค่าเหล่านี้จาก tokens ตอน build ไม่คัดลอก hex ด้วยมือ
   ทุกตัวแปรใน widget จริงอยู่ใต้ :host ของ Shadow DOM เพื่อไม่ชนกับ CSS ของเว็บ tenant */
:root{
  --dc-surface-page:#f8fafc;--dc-surface-raised:#fff;--dc-surface-sunken:#f1f5f9;--dc-surface-brand:#0f766e;--dc-brand-800:#115e59;--dc-brand-50:#f0fdfa;--dc-brand-200:#99f6e4;
  --dc-border-subtle:#e2e8f0;--dc-border-default:#cbd5e1;--dc-border-strong:#94a3b8;
  --dc-text-primary:#1e293b;--dc-text-secondary:#475569;--dc-text-muted:#64748b;--dc-text-on-brand:#fff;--dc-text-brand:#0f766e;
  --dc-attention-bg-subtle:#fffbeb;--dc-attention-border:#fde68a;--dc-attention-fg-strong:#92400e;
  --dc-critical-bg-subtle:#fff1f2;--dc-critical-border:#fecaca;--dc-critical-fg:#b91c1c;
  --dc-neutral-bg:#f1f5f9;--dc-neutral-fg:#475569;
  --dc-shadow-floating:0 10px 30px rgba(15,23,42,.3);
  --dc-focus-ring:0 0 0 2px #fff,0 0 0 4px #0f766e;--dc-focus-ring-inverse:0 0 0 2px #0f766e,0 0 0 4px #fff;
  --dc-radius-md:4px;--dc-radius-lg:5px;--dc-radius-xl:7px;
}
*,::before,::after{box-sizing:border-box}
html{font-size:16px}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI','Noto Sans Thai','Leelawadee UI',sans-serif;background:#e7ecef;color:var(--dc-text-primary)}
button,textarea{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}
:where(button,textarea,a):focus-visible{outline:none;box-shadow:var(--dc-focus-ring)}
.page-h{padding:20px 24px 4px;font-size:20px;font-weight:600}
.page-p{padding:0 24px 16px;font-size:13px;color:var(--dc-text-secondary);max-width:900px;line-height:1.5}
.gallery{display:grid;grid-template-columns:repeat(4,360px);gap:28px 24px;padding:8px 24px 32px;align-items:start}
.cell>h2{font-size:13px;font-weight:600;margin:0 0 6px}
.cell>h2 span{font-weight:400;color:var(--dc-text-muted)}
/* ---------- widget ---------- */
.wg{width:360px;height:560px;background:var(--dc-surface-raised);border-radius:var(--dc-radius-xl);box-shadow:var(--dc-shadow-floating);display:flex;flex-direction:column;overflow:hidden;position:relative;font-size:14px}
.wg-h{background:var(--dc-surface-brand);color:var(--dc-text-on-brand);display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;height:56px;flex-shrink:0}
.wg-h :focus-visible{box-shadow:var(--dc-focus-ring-inverse)}
.wg-t{flex:1;min-width:0}
.wg-t b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.wg-t span{display:flex;align-items:center;gap:5px;font-size:12px;opacity:.95}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.ib{width:36px;height:36px;border:0;border-radius:var(--dc-radius-md);background:none;display:inline-flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:inherit}
.ib:hover{background:rgba(255,255,255,.14)}
.tb{height:32px;padding:0 10px;border:1px solid rgba(255,255,255,.6);border-radius:var(--dc-radius-md);background:none;color:#fff;font-size:13px;cursor:pointer}
.wg-body{flex:1;min-height:0;overflow:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px;background:var(--dc-surface-raised)}
.m{max-width:80%;width:max-content}
.m .b{padding:8px 12px;border-radius:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:break-word}
.m .meta{font-size:11px;color:var(--dc-text-muted);margin-top:2px}
.m.in{align-self:flex-start}.m.in .b{background:var(--dc-surface-sunken);border-top-left-radius:3px}
.m.out{align-self:flex-end;text-align:right}.m.out .b{background:var(--dc-surface-brand);color:var(--dc-text-on-brand);border-top-right-radius:3px;text-align:left}
.m.out.fail .b{background:var(--dc-critical-bg-subtle);color:var(--dc-text-primary);border:1px solid var(--dc-critical-border)}
.m.out.pending .b{background:var(--dc-brand-800);opacity:.75}
.fail-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--dc-critical-fg)}
.lnk{border:0;background:none;color:var(--dc-text-brand);font-weight:600;text-decoration:underline;cursor:pointer;padding:2px;font-size:12px}
.sys{align-self:center;text-align:center;font-size:12px;color:var(--dc-text-secondary);padding:2px 10px;background:var(--dc-surface-page);border:1px solid var(--dc-border-subtle);border-radius:999px}
.welcome{background:var(--dc-brand-50);border:1px solid var(--dc-brand-200);border-radius:var(--dc-radius-lg);padding:12px;line-height:1.55}
.welcome small{display:block;margin-top:8px;color:var(--dc-text-secondary);font-size:12px}
.band{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;font-size:13px;line-height:1.5;border-bottom:1px solid}
.band i{font-size:17px;margin-top:1px}
.band-wait{background:var(--dc-surface-page);border-color:var(--dc-border-subtle);color:var(--dc-text-secondary)}
.band-warn{background:var(--dc-attention-bg-subtle);border-color:var(--dc-attention-border);color:var(--dc-attention-fg-strong)}
.band-bad{background:var(--dc-critical-bg-subtle);border-color:var(--dc-critical-border);color:var(--dc-critical-fg)}
.spin{width:14px;height:14px;border:2px solid var(--dc-border-default);border-top-color:var(--dc-surface-brand);border-radius:50%;animation:sp 1s linear infinite;flex-shrink:0;margin-top:3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.wg-f{border-top:1px solid var(--dc-border-subtle);padding:10px 12px;flex-shrink:0;background:var(--dc-surface-raised)}
.cmp{display:flex;gap:8px;align-items:flex-end}
.cmp textarea{flex:1;min-height:40px;max-height:120px;resize:none;border:1px solid var(--dc-border-strong);border-radius:var(--dc-radius-lg);padding:9px 10px;font-size:14px;line-height:1.4}
.cmp textarea:disabled{background:var(--dc-surface-sunken);color:var(--dc-text-muted);border-color:var(--dc-border-default)}
.send{width:40px;height:40px;border:0;border-radius:var(--dc-radius-lg);background:var(--dc-surface-brand);color:#fff;font-size:18px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.send:disabled{background:var(--dc-neutral-bg);color:var(--dc-text-muted);cursor:not-allowed}
.hint{display:flex;justify-content:space-between;font-size:11px;color:var(--dc-text-muted);margin-top:4px}
.pbtn{height:40px;width:100%;border:0;border-radius:var(--dc-radius-lg);background:var(--dc-surface-brand);color:#fff;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.sbtn{height:40px;width:100%;border:1px solid var(--dc-border-strong);border-radius:var(--dc-radius-lg);background:#fff;font-size:14px;cursor:pointer}
.ended{text-align:center;padding:4px 4px 2px}
.ended p{font-size:13px;color:var(--dc-text-secondary);margin-bottom:10px;line-height:1.5}
.sheet{position:absolute;inset:56px 0 0;background:rgba(15,23,42,.35);display:flex;align-items:flex-end}
.sheet>div{background:#fff;width:100%;padding:16px;border-radius:var(--dc-radius-xl) var(--dc-radius-xl) 0 0}
.sheet h3{font-size:15px;margin-bottom:4px}
.sheet p{font-size:13px;color:var(--dc-text-secondary);margin-bottom:12px;line-height:1.5}
.state-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:8px;color:var(--dc-text-secondary);font-size:13px;line-height:1.55}
.state-c i{font-size:32px;color:var(--dc-text-muted)}
.state-c b{color:var(--dc-text-primary);font-size:15px}
/* launcher */
.stage{width:360px;height:560px;position:relative;border-radius:var(--dc-radius-xl);background:repeating-linear-gradient(135deg,#f8fafc 0 14px,#f1f5f9 14px 28px);border:1px dashed var(--dc-border-default)}
.stage::before{content:'เว็บไซต์ของ tenant';position:absolute;left:12px;top:10px;font-size:12px;color:var(--dc-text-muted)}
.launch{position:absolute;right:20px;bottom:20px;height:56px;min-width:56px;padding:0 18px 0 16px;border:0;border-radius:999px;background:var(--dc-surface-brand);color:#fff;box-shadow:var(--dc-shadow-floating);display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;cursor:pointer}
.launch i{font-size:24px}
.launch .badge2{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:999px;background:#b91c1c;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<h1 class="page-h">#1044 Web Chat widget — state ทั้งหมด (360×560)</h1>
<p class="page-p">หน้าต่างแชทลอยมุมขวาล่างของเว็บ tenant หน้าตามาตรฐานเดียว ภาษาตาม browser (th* = ไทย นอกนั้นอังกฤษ) render ใน Shadow DOM
  สีจาก token ของ packages/ui ข้อความทุกคู่ผ่าน WCAG AA (ขาวบน --dc-surface-brand 5.47:1, --dc-text-secondary บนขาว 7.6:1)</p>
<div class="gallery" id="g"></div>

<script>
const T = {
  title:'Demo Retail', sub:{ready:'แชทกับเจ้าหน้าที่',wait:'กำลังหาเจ้าหน้าที่',chat:'คุยกับเจ้าหน้าที่อยู่',ended:'แชทจบแล้ว',off:'ไม่มีเจ้าหน้าที่ออนไลน์',reconnect:'กำลังเชื่อมต่อใหม่'},
};
const head = (sub, dot, end=true) => `<div class="wg-h"><div class="wg-t"><b>${T.title}</b><span><span class="dot" aria-hidden="true"></span>${sub}</span></div>
  ${end ? '<button class="tb">จบแชท</button>' : ''}<button class="ib" aria-label="ย่อหน้าต่างแชท"><i class="ti ti-chevron-down"></i></button></div>`;
const cmp = ({val='', disabled=false, sendOff, ph='พิมพ์ข้อความ'}={}) => `<div class="wg-f"><div class="cmp">
  <label class="sr" for="x">ข้อความ</label><textarea id="x" rows="1" placeholder="${ph}" ${disabled ? 'disabled' : ''}>${val}</textarea>
  <button class="send" aria-label="ส่งข้อความ" ${disabled || sendOff || !val ? 'disabled' : ''}><i class="ti ti-send"></i></button></div>
  <div class="hint"><span>Enter ส่ง · Shift+Enter ขึ้นบรรทัดใหม่</span><span>${val.length} / 2000</span></div></div>`;
const welcome = `<div class="welcome">สวัสดีค่ะ ยินดีต้อนรับสู่ Demo Retail สอบถามเรื่องสินค้า การสั่งซื้อ หรือการจัดส่งได้เลยค่ะ
  <small>เจ้าหน้าที่จะตอบในแชทนี้ อย่าส่งรหัสผ่าน รหัส OTP หรือเลขบัตร</small></div>`;
const inM = (t, time='10:31') => `<div class="m in"><div class="b">${t}</div><div class="meta">เจ้าหน้าที่ · ${time}</div></div>`;
const outM = (t, time='10:29') => `<div class="m out"><div class="b">${t}</div><div class="meta">${time}</div></div>`;
const sys = t => `<p class="sys">${t}</p>`;
const convo = sys('เจ้าหน้าที่เข้าร่วมแชท') + inM('สวัสดีค่ะ ยินดีให้บริการค่ะ รบกวนขอเลขคำสั่งซื้อด้วยนะคะ') + outM('SO-2569-118842 ค่ะ','10:33') + inM('ขอบคุณค่ะ ขอเวลาตรวจสอบกับขนส่งสักครู่นะคะ','10:34');
const W = (inner) => `<div class="wg" role="dialog" aria-label="แชทกับ Demo Retail">${inner}</div>`;

const CELLS = [
  ['1 ปิดอยู่','ปุ่มลอย', `<div class="stage"><button class="launch" aria-label="เปิดแชทกับ Demo Retail"><i class="ti ti-message-circle"></i>แชทกับเรา</button></div>`],
  ['2 ย่ออยู่ระหว่างคุย','มีข้อความใหม่', `<div class="stage"><button class="launch" aria-label="เปิดแชท มีข้อความใหม่ 1 ข้อความ"><i class="ti ti-message-circle"></i>แชทกับเรา<span class="badge2" aria-hidden="true">1</span></button></div>`],
  ['3 เปิดครั้งแรก','ก่อนส่งข้อความแรก', W(head(T.sub.ready,1,false) + `<div class="wg-body">${welcome}</div>` + cmp())],
  ['4 ส่งข้อความแรกแล้ว','กำลังรอเจ้าหน้าที่', W(head(T.sub.wait) + `<div class="band band-wait" role="status"><span class="spin" aria-hidden="true"></span><span>กำลังหาเจ้าหน้าที่ให้คุณ พิมพ์รายละเอียดเพิ่มได้ระหว่างรอ ไม่ต้องปิดหน้านี้</span></div>
    <div class="wg-body">${welcome}${outM('สวัสดีค่ะ สั่งของไปเมื่อวันที่ 20 ยังไม่ได้รับเลยค่ะ')}</div>` + cmp())],
  ['5 กำลังคุย','', W(head(T.sub.chat) + `<div class="wg-body">${welcome}${outM('สวัสดีค่ะ สั่งของไปเมื่อวันที่ 20 ยังไม่ได้รับเลยค่ะ')}${convo}</div>` + cmp({val:'ได้ค่ะ'}))],
  ['6 ส่งไม่สำเร็จ','ลองใหม่ได้', W(head(T.sub.chat) + `<div class="wg-body">${convo}<div class="m out fail"><div class="b">ถ้าไม่ได้ภายในสัปดาห์นี้ขอคืนเงินได้ไหมคะ</div></div>
    <div class="fail-row" role="alert"><i class="ti ti-alert-circle"></i>ส่งไม่สำเร็จ<button class="lnk">ส่งอีกครั้ง</button></div></div>` + cmp())],
  ['7 เน็ตหลุด','กำลังเชื่อมต่อใหม่', W(head(T.sub.reconnect) + `<div class="band band-warn" role="status"><span class="spin" aria-hidden="true"></span><span>การเชื่อมต่อขาด กำลังเชื่อมต่อใหม่ แชทของคุณยังอยู่ ข้อความที่พิมพ์ไว้จะไม่หาย</span></div>
    <div class="wg-body">${convo}</div>` + cmp({val:'ได้ค่ะ รอได้', sendOff:true}))],
  ['8 ลูกค้ากดจบแชท','ยืนยันก่อน', W(head(T.sub.chat) + `<div class="wg-body">${convo}</div>` + cmp() +
    `<div class="sheet"><div role="alertdialog" aria-labelledby="e1" aria-describedby="e2"><h3 id="e1">จบแชทนี้?</h3><p id="e2">เจ้าหน้าที่จะไม่เห็นข้อความใหม่จากคุณอีก ถ้ามีเรื่องเพิ่มเริ่มแชทใหม่ได้</p>
    <div style="display:grid;gap:8px"><button class="pbtn" style="box-shadow:var(--dc-focus-ring)">จบแชท</button><button class="sbtn">คุยต่อ</button></div></div></div>`)],
  ['9 เจ้าหน้าที่จบแชท','', W(head(T.sub.ended,0,false) + `<div class="wg-body">${convo}${inM('พัสดุจะถึงภายในวันนี้ค่ะ ขอบคุณที่ติดต่อมานะคะ','10:41')}${sys('เจ้าหน้าที่จบแชทแล้ว')}</div>
    <div class="wg-f ended"><p>แชทนี้จบแล้ว ถ้ายังมีเรื่องสอบถาม เริ่มแชทใหม่ได้</p><button class="pbtn"><i class="ti ti-message-plus"></i>เริ่มแชทใหม่</button></div>`)],
  ['10 ปิดเพราะไม่มีการตอบ','ลูกค้าเงียบเกินเวลา', W(head(T.sub.ended,0,false) + `<div class="wg-body">${convo}${sys('แชทปิดอัตโนมัติเพราะไม่มีข้อความจากคุณเกิน 10 นาที')}</div>
    <div class="wg-f ended"><p>ถ้ายังต้องการความช่วยเหลือ เริ่มแชทใหม่ได้</p><button class="pbtn"><i class="ti ti-message-plus"></i>เริ่มแชทใหม่</button></div>`)],
  ['11 ไม่มีเจ้าหน้าที่ออนไลน์','พิมพ์ไม่ได้', W(head(T.sub.off,0,false) + `<div class="wg-body"><div class="state-c"><i class="ti ti-moon"></i><b>ตอนนี้ไม่มีเจ้าหน้าที่ออนไลน์</b>
    <span>จึงยังเริ่มแชทใหม่ไม่ได้ ลองใหม่ภายหลัง หรือติดต่อช่องทางอื่นของ Demo Retail</span><button class="sbtn" style="width:auto;padding:0 16px;margin-top:4px">ตรวจอีกครั้ง</button></div></div>` + cmp({disabled:true, ph:'ยังส่งข้อความไม่ได้'}))],
  ['12 widget ถูกปิดใช้งาน','ระหว่างเปิดหน้าต่าง', W(head(T.sub.ended,0,false) + `<div class="wg-body"><div class="state-c"><i class="ti ti-message-off"></i><b>แชทปิดให้บริการชั่วคราว</b>
    <span>ติดต่อ Demo Retail ทางช่องทางอื่นได้ หน้านี้จะไม่แสดงปุ่มแชทจนกว่าเปิดให้บริการอีกครั้ง</span></div></div>`)],
  ['13 English','browser ไม่ใช่ภาษาไทย', W(`<div class="wg-h"><div class="wg-t"><b>Demo Retail</b><span><span class="dot"></span>Looking for an agent</span></div><button class="tb">End chat</button><button class="ib" aria-label="Minimize chat"><i class="ti ti-chevron-down"></i></button></div>
    <div class="band band-wait" role="status"><span class="spin"></span><span>Finding an agent for you. You can add details while you wait; keep this page open.</span></div>
    <div class="wg-body"><div class="welcome">Hello, welcome to Demo Retail. Ask us about products, orders or delivery.<small>An agent will reply in this chat. Never send passwords, OTP codes or card numbers.</small></div>
    <div class="m out"><div class="b">Hi, my order from the 20th hasn't arrived yet.</div><div class="meta">10:29</div></div></div>
    <div class="wg-f"><div class="cmp"><textarea rows="1" placeholder="Type a message"></textarea><button class="send" aria-label="Send message" disabled><i class="ti ti-send"></i></button></div><div class="hint"><span>Enter to send · Shift+Enter for a new line</span><span>0 / 2000</span></div></div>`)],
  ['14 ข้อความยาว','2,000 ตัวอักษร', W(head(T.sub.chat) + `<div class="wg-body">${outM(('สั่งซื้อหม้อทอดไร้น้ำมันรุ่น AF-500 ไปเมื่อวันที่ 20 พ.ย. ระบบแจ้งว่าจัดส่งแล้วแต่ยังไม่ได้รับของ ติดต่อขนส่งแล้วบอกว่าพัสดุอยู่ที่ศูนย์กระจายสินค้า ').repeat(4))}</div>` +
    `<div class="wg-f"><div class="cmp"><textarea rows="3" style="border-color:var(--dc-critical-fg)" aria-invalid="true" aria-describedby="lim">${'ข'.repeat(60)}</textarea><button class="send" aria-label="ส่งข้อความ" disabled><i class="ti ti-send"></i></button></div>
    <div class="hint" id="lim"><span style="color:var(--dc-critical-fg)">ยาวเกิน 2000 ตัวอักษร ตัดให้สั้นลงก่อนส่ง</span><span style="color:var(--dc-critical-fg)">2014 / 2000</span></div></div>`)],
];
document.getElementById('g').innerHTML = CELLS.map(c => `<section class="cell"><h2>${c[0]} <span>${c[1]}</span></h2>${c[2]}</section>`).join('');
</script>
