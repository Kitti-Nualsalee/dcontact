<!doctype html>
<!--
  E1.15 (#489): reference host of the embedded dphone — plain HTML, no framework (E1.7 #463 item 3)

  Usage: replace DPHONE_ORIGIN with the dphone origin (e.g. https://dphone.example.com) and TENANT with the alias
  of the tenant, then open this page from an origin that is in the allowlist of Console › Integrations › dphone embedding
  See the full guide at docs/dphone-embed/README.md
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample CRM — dphone</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: grid;
        grid-template-columns: 1fr 380px;
        min-height: 100vh;
      }
      main {
        padding: 24px;
      }
      dphone-launcher {
        height: 100vh;
        border-left: 1px solid #d0d7de;
      }
      section {
        margin-bottom: 24px;
      }
      pre {
        background: #f6f8fa;
        padding: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sample CRM</h1>

      <section aria-labelledby="call-title">
        <h2 id="call-title">Call a customer</h2>
        <form id="call-form">
          <label>Phone number <input name="number" inputmode="tel" required /></label>
          <label>Customer ID (optional) <input name="contactId" /></label>
          <button type="submit">Send number to dphone</button>
        </form>
        <p id="call-result" role="status"></p>
      </section>

      <section aria-labelledby="pop-title">
        <h2 id="pop-title">Latest screen-pop</h2>
        <pre id="screenpop">No call yet</pre>
      </section>

      <section aria-labelledby="activity-title">
        <h2 id="activity-title">Recorded activity</h2>
        <ul id="activities"></ul>
      </section>
    </main>

    <dphone-launcher></dphone-launcher>

    <script type="module">
      const dphone = document.querySelector('dphone-launcher');
      const configuredOrigin = 'DPHONE_ORIGIN';
      const configuredTenant = 'TENANT';
      const origin =
        configuredOrigin === ['DPHONE', '_ORIGIN'].join('')
          ? window.location.origin
          : configuredOrigin;
      const tenant =
        configuredTenant === ['TEN', 'ANT'].join('')
          ? new URL(window.location.href).searchParams.get('tenant')
          : configuredTenant;
      if (!tenant) throw new Error('tenant must be given in the query string');
      dphone.setAttribute('tenant', tenant);
      await import(new URL('/embed/v1/dphone-launcher.js', origin).href);
      const saved = new Set();

      dphone.addEventListener('ready', (event) => {
        document.body.dataset.dphoneReady = 'true';
        document.body.dataset.screenPopLevel = event.detail.screenPopLevel;
      });

      // data at the level the tenant set per origin — always use textContent (never insert as HTML)
      dphone.addEventListener('screenpop', (event) => {
        document.getElementById('screenpop').textContent = JSON.stringify(event.detail, null, 2);
      });

      // record the activity idempotently with interactionId; the launcher acks when the promise succeeds
      dphone.addEventListener('activity', (event) => {
        event.waitUntil(
          (async () => {
            if (saved.has(event.detail.interactionId)) return;
            saved.add(event.detail.interactionId);
            const item = document.createElement('li');
            item.textContent = `${event.detail.interactionId} · ${event.detail.disposition ?? '-'} · ${event.detail.durationSeconds} seconds`;
            document.getElementById('activities').append(item);
          })(),
        );
      });

      document.getElementById('call-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const result = document.getElementById('call-result');
        result.textContent = 'Number sent to dphone — waiting for the agent to press call';
        try {
          const outcome = await dphone.call(String(form.get('number')), {
            contactId: String(form.get('contactId') || '') || undefined,
          });
          result.textContent = `Result: ${outcome.status}${outcome.reasonCode ? ` (${outcome.reasonCode})` : ''}`;
        } catch (error) {
          result.textContent = `Send failed: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
