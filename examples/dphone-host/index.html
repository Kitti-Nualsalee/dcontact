<!doctype html>
<!--
  E1.15 (#489): host อ้างอิงของ dphone ที่ถูกฝัง — HTML ธรรมดา ไม่ใช้ framework (E1.7 #463 ข้อ 3)

  วิธีใช้: แทน DPHONE_ORIGIN ด้วย origin ของ dphone (เช่น https://dphone.example.com) และ TENANT ด้วย alias
  ของ tenant แล้วเปิดหน้านี้จาก origin ที่อยู่ใน allowlist ของ Console › Integrations › dphone embedding
  ดูคู่มือเต็มที่ docs/dphone-embed/README.md
-->
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRM ตัวอย่าง — dphone</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: grid;
        grid-template-columns: 1fr 380px;
        min-height: 100vh;
      }
      main {
        padding: 24px;
      }
      dphone-launcher {
        height: 100vh;
        border-left: 1px solid #d0d7de;
      }
      section {
        margin-bottom: 24px;
      }
      pre {
        background: #f6f8fa;
        padding: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CRM ตัวอย่าง</h1>

      <section aria-labelledby="call-title">
        <h2 id="call-title">โทรหาลูกค้า</h2>
        <form id="call-form">
          <label>เบอร์โทร <input name="number" inputmode="tel" required /></label>
          <label>รหัสลูกค้า (ไม่บังคับ) <input name="contactId" /></label>
          <button type="submit">ส่งเบอร์ให้ dphone</button>
        </form>
        <p id="call-result" role="status"></p>
      </section>

      <section aria-labelledby="pop-title">
        <h2 id="pop-title">Screen-pop ล่าสุด</h2>
        <pre id="screenpop">ยังไม่มีสาย</pre>
      </section>

      <section aria-labelledby="activity-title">
        <h2 id="activity-title">กิจกรรมที่บันทึกแล้ว</h2>
        <ul id="activities"></ul>
      </section>
    </main>

    <dphone-launcher></dphone-launcher>

    <script type="module">
      const dphone = document.querySelector('dphone-launcher');
      const configuredOrigin = 'DPHONE_ORIGIN';
      const configuredTenant = 'TENANT';
      const origin =
        configuredOrigin === ['DPHONE', '_ORIGIN'].join('')
          ? window.location.origin
          : configuredOrigin;
      const tenant =
        configuredTenant === ['TEN', 'ANT'].join('')
          ? new URL(window.location.href).searchParams.get('tenant')
          : configuredTenant;
      if (!tenant) throw new Error('ต้องระบุ tenant ใน query string');
      dphone.setAttribute('tenant', tenant);
      await import(new URL('/embed/v1/dphone-launcher.js', origin).href);
      const saved = new Set();

      dphone.addEventListener('ready', (event) => {
        document.body.dataset.dphoneReady = 'true';
        document.body.dataset.screenPopLevel = event.detail.screenPopLevel;
      });

      // ข้อมูลตามระดับที่ tenant ตั้งไว้ต่อ origin — ใช้ textContent เสมอ (ไม่ใส่เป็น HTML)
      dphone.addEventListener('screenpop', (event) => {
        document.getElementById('screenpop').textContent = JSON.stringify(event.detail, null, 2);
      });

      // บันทึกกิจกรรมแบบ idempotent ด้วย interactionId; launcher ack ให้เมื่อ promise สำเร็จ
      dphone.addEventListener('activity', (event) => {
        event.waitUntil(
          (async () => {
            if (saved.has(event.detail.interactionId)) return;
            saved.add(event.detail.interactionId);
            const item = document.createElement('li');
            item.textContent = `${event.detail.interactionId} · ${event.detail.disposition ?? '-'} · ${event.detail.durationSeconds} วินาที`;
            document.getElementById('activities').append(item);
          })(),
        );
      });

      document.getElementById('call-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const result = document.getElementById('call-result');
        result.textContent = 'ส่งเบอร์ให้ dphone แล้ว — รอ agent กดโทร';
        try {
          const outcome = await dphone.call(String(form.get('number')), {
            contactId: String(form.get('contactId') || '') || undefined,
          });
          result.textContent = `ผล: ${outcome.status}${outcome.reasonCode ? ` (${outcome.reasonCode})` : ''}`;
        } catch (error) {
          result.textContent = `ส่งไม่สำเร็จ: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
