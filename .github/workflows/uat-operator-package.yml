name: uat-operator-package

on:
  workflow_dispatch:
    inputs:
      deployed_base_sha:
        description: 'SHA ของ deployment record ปัจจุบันบน UAT สำหรับ migration guard'
        required: true
        type: string
      uat_host:
        description: 'Hostname สาธารณะของ UAT (ไม่ใช่ secret)'
        required: true
        default: 'dcontact-uat.osd.co.th'
        type: string
      full_workspace:
        description: 'เปิด full Workspace overlay ใน release นี้ (ต้องมี E1 และ nginx vhost พร้อม)'
        required: true
        default: false
        type: boolean
      workspace_host:
        description: 'Hostname ของ Workspace บน UAT (origin แยกจาก Console)'
        required: true
        default: 'dcontact-workspace-uat.osd.co.th'
        type: string
      fixture_pack_version:
        description: 'Fixture pack version ที่ฝังใน Console (ไม่ใช่ secret)'
        required: true
        default: 'uat-first-slice.v1'
        type: string

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Migration guard
        shell: bash
        env:
          DEPLOYED_BASE_SHA: ${{ inputs.deployed_base_sha }}
        run: node scripts/u1-uat-readiness.mjs --migration-guard --base "$DEPLOYED_BASE_SHA" | tee migration-guard.json

      - name: Validate UI origins
        env:
          UAT_HOST: ${{ inputs.uat_host }}
          UAT_WORKSPACE_HOST: ${{ inputs.workspace_host }}
        run: |
          node --input-type=module -e '
            const hosts = [process.env.UAT_HOST, process.env.UAT_WORKSPACE_HOST];
            if (hosts.some(h => !/^[a-z0-9]+(?:[.-][a-z0-9]+)*\.[a-z]{2,}$/.test(h)) || hosts[0] === hosts[1]) process.exit(1);
          '

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image names
        id: names
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/$owner/dcontact-uat-operator-api" >> "$GITHUB_OUTPUT"
          echo "ops=ghcr.io/$owner/dcontact-uat-operator-ops" >> "$GITHUB_OUTPUT"
          echo "console=ghcr.io/$owner/dcontact-uat-operator-console" >> "$GITHUB_OUTPUT"
          echo "keycloak=ghcr.io/$owner/dcontact-uat-operator-keycloak" >> "$GITHUB_OUTPUT"

      - name: Build + push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          provenance: false
          build-args: SOURCE_SHA=${{ github.sha }}
          tags: ${{ steps.names.outputs.api }}:${{ github.sha }}

      - name: Build + push ops image
        id: ops
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: ops
          push: true
          provenance: false
          build-args: SOURCE_SHA=${{ github.sha }}
          tags: ${{ steps.names.outputs.ops }}:${{ github.sha }}

      - name: Build + push Console image
        id: console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/console/Dockerfile
          push: true
          provenance: false
          build-args: |
            SOURCE_SHA=${{ github.sha }}
            VITE_KC_ISSUER=https://${{ inputs.uat_host }}/auth/realms/dcontact
            VITE_KC_CLIENT_ID=dcontact-uat-console
            VITE_WORKSPACE_KC_CLIENT_ID=dcontact-uat-workspace
            VITE_CONSOLE_URL=https://${{ inputs.uat_host }}
            VITE_WORKSPACE_URL=${{ inputs.full_workspace && format('https://{0}', inputs.workspace_host) || '' }}
            VITE_CONSOLE_DEFAULT_VIEW=journeys
            VITE_UAT_ENVIRONMENT=${{ vars.UAT_ENVIRONMENT || 'uat' }}
            VITE_UAT_PACK_VERSION=${{ inputs.fixture_pack_version }}
          tags: ${{ steps.names.outputs.console }}:${{ github.sha }}

      - name: Build + push Keycloak image
        id: keycloak
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/keycloak/Dockerfile
          push: true
          provenance: false
          build-args: SOURCE_SHA=${{ github.sha }}
          tags: ${{ steps.names.outputs.keycloak }}:${{ github.sha }}

      - name: Create digest-pinned release manifest
        env:
          API_IMAGE: ${{ steps.names.outputs.api }}@${{ steps.api.outputs.digest }}
          OPS_IMAGE: ${{ steps.names.outputs.ops }}@${{ steps.ops.outputs.digest }}
          CONSOLE_IMAGE: ${{ steps.names.outputs.console }}@${{ steps.console.outputs.digest }}
          KEYCLOAK_IMAGE: ${{ steps.names.outputs.keycloak }}@${{ steps.keycloak.outputs.digest }}
          UAT_WORKSPACE_HOST: ${{ inputs.workspace_host }}
          UAT_WORKSPACE_ENABLED: ${{ inputs.full_workspace }}
        run: |
          {
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "UAT_WORKSPACE_HOST=$UAT_WORKSPACE_HOST"
            echo "UAT_WORKSPACE_ENABLED=$UAT_WORKSPACE_ENABLED"
            echo "API_IMAGE=$API_IMAGE"
            echo "OPS_IMAGE=$OPS_IMAGE"
            echo "CONSOLE_IMAGE=$CONSOLE_IMAGE"
            echo "KEYCLOAK_IMAGE=$KEYCLOAK_IMAGE"
          } > release.env

      - uses: actions/upload-artifact@v4
        with:
          name: uat-operator-package-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release.env
            migration-guard.json
