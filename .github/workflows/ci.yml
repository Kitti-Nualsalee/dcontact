name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 01:00 ICT — J2 acceptance กินเวลา ~3 ชม. จึงรันรอบดึกแทนทุก push
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      acceptance:
        # สั่งเฉพาะชุดที่ต้องการได้ ไม่ต้องลาก convergence ที่ใช้เวลานานมาทุก main push
        description: 'acceptance ที่จะรัน (all | s1 | cg4 | cg5 | j2 | j5 | j5-focused | s2 | s2-focused)'
        type: choice
        options: [all, s1, cg4, cg5, j2, j5, j5-focused, s2, s2-focused]
        default: all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build all packages
        run: pnpm build

      - name: Prettier check
        run: pnpm lint

      - name: CG5 external OpenAPI breaking-change guard
        run: node scripts/cg5-openapi-breaking-check.mjs && node --test scripts/cg5-openapi-breaking-check.test.mjs
        env:
          CG5_EXTERNAL_OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      # CG4.11 (#194): registry/validator/marker suppression รันได้โดยไม่ต้องมี infrastructure
      - name: CG4 readiness validator tests
        run: pnpm test:cxa-cg4-readiness

      - name: J3 readiness validator tests
        run: pnpm test:cxa-j3-readiness

      # CG5.11 (#295): registry/validator/marker suppression และ MG01 migration scan ไม่ต้องใช้ infrastructure
      - name: CG5 readiness validator tests
        run: pnpm test:cxa-cg5-readiness

      # J5.1 (#339): registry ของ schema ตรงกับ migration และ rls.sql โดยไม่ต้องใช้ infrastructure
      - name: J5 schema readiness validator tests
        run: pnpm test:cxa-j5-schema-readiness

      # S2.1 (#365): registry ของ LINE persistence ตรงกับ migration/rls.sql และ migration เป็น expand-only
      - name: S2 schema readiness validator tests
        run: pnpm test:cxa-s2-schema-readiness

      # S2.6 (#366): 19-check registry, manifest/bundle validator, marker suppression และ negative scan
      - name: S2 readiness validator tests
        run: pnpm test:cxa-s2-readiness

      # A1.1 (#406): registry ของ control-plane schema ตรง migration/rls.sql และ migration เป็น expand-only
      - name: A1 schema readiness validator tests
        run: pnpm test:a1-schema-readiness

      # A1.2 (#407): token matrix + guard ผ่าน HTTP จริง (token ลงนามในเครื่อง ไม่ต้องใช้ Keycloak)
      # real-boundary กับ Keycloak จริงรันด้วย `pnpm a1:auth:boundary` หลัง `pnpm infra:up`
      - name: A1.2 platform auth boundary tests
        run: pnpm --filter @d-contact/platform-api test

  a1-platform-control-fast-gate:
    # A1.1 (#406) / #393 Fast PR gate: idempotency, reservation race, tombstone, CAS, completion
    # invariant, append-only และสิทธิ์ของ role บน Postgres จริง — ไม่ต้องใช้ Keycloak/UI
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dcontact
          POSTGRES_PASSWORD: dcontact
          POSTGRES_DB: dcontact
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dcontact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
      PLATFORM_DATABASE_URL: postgresql://dcontact_platform:dcontact_platform@localhost:5433/dcontact?schema=public
      APPLICATION_DATABASE_URL: postgresql://dcontact_app:dcontact_app@localhost:5433/dcontact?schema=public
      # A1.4 (#409): role ของ tenant bootstrap (#388 decision) — RLS ยอมเฉพาะ tenant ที่ยัง PROVISIONING
      PROVISIONER_DATABASE_URL: postgresql://dcontact_provisioner:dcontact_provisioner@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build platform-control + platform-api dependencies
        run: pnpm --filter "@d-contact/platform-api^..." build

      - name: Migrate and bootstrap roles/RLS
        run: pnpm db:migrate && pnpm db:rls

      - name: Platform control unit tests
        run: pnpm --filter @d-contact/platform-control test

      # A1.8 (#413): alert rule ของ Platform provisioning ต้องผ่าน promtool unit test
      - name: Platform provisioning alert rules
        run: pnpm a1:alerts:test

      # A1.4b (#436): extension ใช้ internal SPI ของ Keycloak — compile เทียบ image เวอร์ชันเดียวกับ runtime
      - name: Build Keycloak invitation guard extension
        run: bash scripts/keycloak-extensions-build.sh

      - name: Platform control integration tests
        run: pnpm --filter @d-contact/platform-control test:integration

      # A1.6 (#411): Platform API ผ่าน HTTP จริง — permission matrix, idempotency, 404/409/429/503
      - name: Platform API integration
        run: pnpm --filter @d-contact/platform-api test:integration

  a1-platform-console:
    # A1.7 (#412): Platform Console — logic + Playwright/axe กับ Platform API ที่ mock ตาม contract
    # (UAT กับ Keycloak/API/worker จริงรันด้วย `pnpm a1:console:uat` ในเครื่อง)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @d-contact/platform-console exec playwright install --with-deps chromium

      - name: Platform Console unit tests + typecheck
        run: pnpm --filter @d-contact/platform-console test && pnpm --filter @d-contact/platform-console typecheck

      - name: Platform Console e2e (Playwright + axe)
        run: pnpm --filter @d-contact/platform-console test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-console-playwright
          path: apps/platform-console/test-results
          retention-days: 7

  s1-convergence-acceptance:
    # S1 ใช้เวลานานและ J3 final gate เรียกเองอยู่แล้ว: ไม่รันทุก main push
    # เพื่อให้ development ใช้ focused gate ได้ก่อน แล้วเรียก S1 เมื่อเลือก manual เท่านั้น
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance == 's1'
    runs-on: ubuntu-latest
    concurrency:
      group: s1-convergence-acceptance-${{ github.ref }}
      cancel-in-progress: true
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure local acceptance environment
        run: |
          cp .env.example .env
          mkdir -p infra/docker/data/redpanda
          chmod 777 infra/docker/data/redpanda
          # Docker creates a bind-mount source as root when it is absent. Create
          # this one before Compose so both the Node archiver and FreeSWITCH can
          # create tenant-scoped recording directories on GitHub runners.
          mkdir -p infra/docker/data/freeswitch-recordings
          chmod 777 infra/docker/data/freeswitch-recordings

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for browser acceptance
        run: pnpm --filter @d-contact/workspace exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace prerequisites for gateway acceptance
        run: pnpm build

      - name: Bootstrap acceptance infrastructure
        run: |
          pnpm infra:ready || {
            docker compose -f infra/docker/docker-compose.dev.yml ps
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color redpanda
            exit 1
          }

      - name: Run S1 convergence acceptance on final main SHA
        run: pnpm s1:acceptance
        env:
          S1_EXPECTED_COMMIT_SHA: ${{ github.sha }}

      - name: Upload immutable S1 evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-evidence-${{ github.sha }}
          path: artifacts/s1/${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Stop acceptance infrastructure
        if: always()
        run: pnpm infra:down

  cxa-j2-acceptance:
    # J2-REG01 รัน C1 และ S1 acceptance ซ้อนอยู่ข้างใน รวมแล้วราว 3 ชม. ถ้าผูกกับทุก push
    # job จะทับกันเองเพราะ main ขยับถี่กว่านั้น จึงรันรอบดึกวันละครั้ง (และสั่งเองได้)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.acceptance != 'cg4' && inputs.acceptance != 'cg5' && inputs.acceptance != 'j5' && inputs.acceptance != 'j5-focused' && inputs.acceptance != 's2' && inputs.acceptance != 's2-focused')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: cxa-j2-acceptance
      cancel-in-progress: false
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure local acceptance environment
        run: |
          cp .env.example .env
          mkdir -p infra/docker/data/redpanda
          chmod 777 infra/docker/data/redpanda
          # Docker creates a bind-mount source as root when it is absent. Create
          # this one before Compose so both the Node archiver and FreeSWITCH can
          # create tenant-scoped recording directories on GitHub runners.
          mkdir -p infra/docker/data/freeswitch-recordings
          chmod 777 infra/docker/data/freeswitch-recordings

      - run: pnpm install --frozen-lockfile

      # phase-two-readiness เรียก workspace/console test:e2e ซึ่งใช้ Playwright
      - name: Install Playwright Chromium for browser acceptance
        run: pnpm --filter @d-contact/workspace exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace prerequisites for gateway acceptance
        run: pnpm build

      - name: Bootstrap acceptance infrastructure
        run: |
          pnpm infra:ready || {
            docker compose -f infra/docker/docker-compose.dev.yml ps
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color redpanda
            exit 1
          }

      - name: Run J2 acceptance on final main SHA
        run: pnpm cxa:j2:acceptance
        env:
          CXA_J2_EXPECTED_COMMIT_SHA: ${{ github.sha }}

      - name: Upload immutable J2 evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxa-j2-evidence-${{ github.sha }}
          path: artifacts/cxa-j2/${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Stop acceptance infrastructure
        if: always()
        run: pnpm infra:down

  cxa-cg4-acceptance:
    # CG4.11 (#194): รันรอบดึกหรือสั่งเองบน main (`gh workflow run CI --ref main -f acceptance=cg4`)
    # CG4-REG01 rerun S1 ครั้งเดียว (E0/C1/Inbound Voice อยู่ใน S1-REG-01) และแต่ละ suite รันครั้งเดียว
    # marker ออกได้เฉพาะ HEAD == origin/main == expectedCommitSha บน clean checkout
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.acceptance != 'j2' && inputs.acceptance != 'cg5' && inputs.acceptance != 'j5' && inputs.acceptance != 'j5-focused' && inputs.acceptance != 's2' && inputs.acceptance != 's2-focused')) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: cxa-cg4-acceptance
      cancel-in-progress: false
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure local acceptance environment
        run: |
          cp .env.example .env
          mkdir -p infra/docker/data/redpanda
          chmod 777 infra/docker/data/redpanda
          mkdir -p infra/docker/data/freeswitch-recordings
          chmod 777 infra/docker/data/freeswitch-recordings

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for browser acceptance
        run: |
          pnpm --filter @d-contact/workspace exec playwright install --with-deps chromium
          pnpm --filter @d-contact/console exec playwright install chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace prerequisites
        run: pnpm build

      - name: Bootstrap acceptance infrastructure
        run: |
          pnpm infra:ready || {
            docker compose -f infra/docker/docker-compose.dev.yml ps
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color redpanda
            exit 1
          }

      - name: Run CG4 acceptance on final main SHA
        run: pnpm cxa:cg4:acceptance
        env:
          CXA_CG4_EXPECTED_COMMIT_SHA: ${{ github.sha }}

      - name: Upload immutable CG4 evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxa-cg4-evidence-${{ github.sha }}
          path: |
            artifacts/cxa-cg4/${{ github.run_id }}.json
            artifacts/s1/${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Stop acceptance infrastructure
        if: always()
        run: pnpm infra:down

  cxa-cg5-acceptance:
    # CG5.11 (#295): รันรอบดึกหรือสั่งเองบน main (`gh workflow run CI --ref main -f acceptance=cg5`)
    # ไม่บังคับ marker ของ CG3/CG4/J2/J3 บน SHA เดียวกัน แต่ CG5-REG01/REG02 รัน conformance แบบเจาะจงแทน (#273 §2)
    # marker ออกได้เฉพาะ HEAD == origin/main == expectedCommitSha บน clean checkout
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'all' || inputs.acceptance == 'cg5'))) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: cxa-cg5-acceptance
      cancel-in-progress: false
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure local acceptance environment
        run: |
          cp .env.example .env
          mkdir -p infra/docker/data/redpanda
          chmod 777 infra/docker/data/redpanda
          mkdir -p infra/docker/data/freeswitch-recordings
          chmod 777 infra/docker/data/freeswitch-recordings

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for browser acceptance
        run: pnpm --filter @d-contact/console exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace prerequisites
        run: pnpm build

      - name: Bootstrap acceptance infrastructure
        run: |
          pnpm infra:ready || {
            docker compose -f infra/docker/docker-compose.dev.yml ps
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color redpanda
            exit 1
          }

      - name: Run CG5 acceptance on final main SHA
        run: pnpm cxa:cg5:acceptance
        env:
          CXA_CG5_EXPECTED_COMMIT_SHA: ${{ github.sha }}

      - name: Upload immutable CG5 evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxa-cg5-evidence-${{ github.sha }}
          path: artifacts/cxa-cg5/${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90

  cxa-j5-acceptance:
    # J5.7 (#345): full gate 16 checks — J5-REG01 รัน `cxa:j3:acceptance` (ซึ่งรัน S1/J2/CG4 ซ้อน) เพื่อให้
    # J1/J2/J3/CG3 marker อยู่บน SHA เดียวกัน จึงใช้เวลาหลายชั่วโมงและสั่งเองเท่านั้น:
    # `gh workflow run CI --ref main -f acceptance=j5` — marker ออกได้เฉพาะ clean final main SHA
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance == 'j5' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: cxa-j5-acceptance
      cancel-in-progress: false
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure local acceptance environment
        run: |
          cp .env.example .env
          mkdir -p infra/docker/data/redpanda
          chmod 777 infra/docker/data/redpanda
          mkdir -p infra/docker/data/freeswitch-recordings
          chmod 777 infra/docker/data/freeswitch-recordings

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for browser acceptance
        run: |
          pnpm --filter @d-contact/workspace exec playwright install --with-deps chromium
          pnpm --filter @d-contact/console exec playwright install chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace prerequisites
        run: pnpm build

      - name: Bootstrap acceptance infrastructure
        run: |
          pnpm infra:ready || {
            docker compose -f infra/docker/docker-compose.dev.yml ps
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color redpanda
            exit 1
          }

      - name: Run J5 acceptance on final main SHA
        run: pnpm cxa:j5:acceptance
        env:
          CXA_J5_EXPECTED_COMMIT_SHA: ${{ github.sha }}

      - name: Upload immutable J5 evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxa-j5-evidence-${{ github.sha }}
          path: |
            artifacts/cxa-j5/full-${{ github.run_id }}.json
            artifacts/cxa-j5/browser/
          if-no-files-found: error
          retention-days: 90

  cxa-j5-focused:
    # J5.7 (#345): candidate 15 checks (ไม่รวม J5-REG01) — ไม่ออก marker ไม่ว่าผลจะเป็นอย่างไร
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance == 'j5-focused'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: cxa-j5-focused
      cancel-in-progress: false
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure local acceptance environment
        run: |
          cp .env.example .env
          mkdir -p infra/docker/data/redpanda
          chmod 777 infra/docker/data/redpanda
          mkdir -p infra/docker/data/freeswitch-recordings
          chmod 777 infra/docker/data/freeswitch-recordings

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for browser acceptance
        run: |
          pnpm --filter @d-contact/workspace exec playwright install --with-deps chromium
          pnpm --filter @d-contact/console exec playwright install chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace prerequisites
        run: pnpm build

      - name: Bootstrap acceptance infrastructure
        run: |
          pnpm infra:ready || {
            docker compose -f infra/docker/docker-compose.dev.yml ps
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color redpanda
            exit 1
          }

      - name: Run J5 focused candidate
        run: pnpm cxa:j5:focused
        env:
          CXA_J5_EXPECTED_COMMIT_SHA: ${{ github.sha }}

      - name: Upload J5 candidate manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxa-j5-candidate-${{ github.sha }}
          path: |
            artifacts/cxa-j5/focused-${{ github.run_id }}.json
            artifacts/cxa-j5/browser/
          if-no-files-found: error
          retention-days: 30

  cxa-s2-provider-conformance:
    # S2.6 (#366): S2-LINE-PR01 บน protected runner (macOS ที่ถือ Keychain + local ngrok binding)
    # token/secret ไม่เข้า GitHub Actions — job นี้รับแค่ reference จาก `vars` และส่งออกเฉพาะ
    # sanitized bundle; environment `line-provider-pilot` ต้องมี required reviewer ก่อนเริ่ม
    # PR01 ไม่มี push — PR02/RB01 (S2.7) ต้องมี one-shot approval ใหม่ทุกครั้ง
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance == 's2' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, line-pilot]
    environment: line-provider-pilot
    timeout-minutes: 30
    concurrency:
      group: cxa-s2-provider
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run S2-LINE-PR01 provider conformance (no push)
        run: pnpm --filter @d-contact/delivery provider:pr01
        env:
          CXA_S2_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          CXA_S2_PILOT_TENANT_ID: ${{ vars.CXA_S2_PILOT_TENANT_ID }}
          CXA_S2_CREDENTIAL_REF_ID: ${{ vars.CXA_S2_CREDENTIAL_REF_ID }}
          CXA_S2_APPROVED_WEBHOOK_ENDPOINT_DIGEST: ${{ vars.CXA_S2_APPROVED_WEBHOOK_ENDPOINT_DIGEST }}
          CXA_S2_PROVIDER_BUNDLE_DIR: ${{ github.workspace }}/artifacts/cxa-s2/provider

      - name: Upload sanitized provider bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxa-s2-provider-bundle-${{ github.sha }}
          path: artifacts/cxa-s2/provider/
          if-no-files-found: error
          retention-days: 90

  cxa-s2-acceptance:
    # S2.6 (#366): ingestion + 19 checks — ตรวจ bundle ซ้ำ (schema/hash/final-main/negative scan)
    # แล้วรัน automated 16 checks บน SHA เดียวกัน; bundle หายหรือเสีย = candidate เท่านั้น
    # `gh workflow run CI --ref main -f acceptance=s2` — marker ออกได้เฉพาะ clean final main SHA
    needs: cxa-s2-provider-conformance
    if: always() && github.event_name == 'workflow_dispatch' && inputs.acceptance == 's2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: cxa-s2-acceptance
      cancel-in-progress: false
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure local acceptance environment
        run: |
          cp .env.example .env
          mkdir -p infra/docker/data/redpanda
          chmod 777 infra/docker/data/redpanda
          mkdir -p infra/docker/data/freeswitch-recordings
          chmod 777 infra/docker/data/freeswitch-recordings

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for regression acceptance
        run: pnpm --filter @d-contact/workspace exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace prerequisites
        run: pnpm build

      - name: Download sanitized provider bundle
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cxa-s2-provider-bundle-${{ github.sha }}
          path: artifacts/cxa-s2/provider

      - name: Bootstrap acceptance infrastructure
        run: |
          pnpm infra:ready || {
            docker compose -f infra/docker/docker-compose.dev.yml ps
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color redpanda
            exit 1
          }

      - name: Run S2 acceptance on final main SHA
        run: |
          CXA_S2_PROVIDER_BUNDLES="$(find artifacts/cxa-s2/provider -name '*.json' 2>/dev/null | sort | paste -sd, -)" \
            pnpm cxa:s2:acceptance
        env:
          CXA_S2_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          CXA_S2_PROTECTED_ENVIRONMENT: line-provider-pilot

      - name: Upload immutable S2 evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxa-s2-evidence-${{ github.sha }}
          path: |
            artifacts/cxa-s2/full-${{ github.run_id }}.json
            artifacts/cxa-s2/provider/
          if-no-files-found: error
          retention-days: 90

      - name: Stop acceptance infrastructure
        if: always()
        run: pnpm infra:down

  cxa-s2-focused:
    # S2.6 (#366): candidate 15 checks (ไม่รวม REG01 และ provider checks) — ไม่ออก marker ไม่ว่าผลจะเป็นอย่างไร
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance == 's2-focused'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: cxa-s2-focused
      cancel-in-progress: false
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure local acceptance environment
        run: |
          cp .env.example .env
          mkdir -p infra/docker/data/redpanda
          chmod 777 infra/docker/data/redpanda
          mkdir -p infra/docker/data/freeswitch-recordings
          chmod 777 infra/docker/data/freeswitch-recordings

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace prerequisites
        run: pnpm build

      - name: Bootstrap acceptance infrastructure
        run: |
          pnpm infra:ready || {
            docker compose -f infra/docker/docker-compose.dev.yml ps
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color redpanda
            exit 1
          }

      - name: Run S2 focused candidate
        run: pnpm cxa:s2:focused

      - name: Upload S2 candidate manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxa-s2-candidate-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/cxa-s2/focused-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Stop acceptance infrastructure
        if: always()
        run: pnpm infra:down
