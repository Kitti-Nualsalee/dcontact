    # S2.6 (#366): S2-LINE-PR01 on a protected runner (macOS holding the Keychain + local ngrok binding)
    # tokens/secrets never enter GitHub Actions — this job only receives references from `vars` and emits only a
    # sanitized bundle; the `line-provider-pilot` environment needs a required reviewer before starting
