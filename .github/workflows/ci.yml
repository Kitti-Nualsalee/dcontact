        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-evidence-${{ github.sha }}
          path: artifacts/s1/${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90

      # #559: the C1 manifest (J1_ACCEPTED) that S1-REG-01 ran; J2/J5 check the marker instead of re-running C1
