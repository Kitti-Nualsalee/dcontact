  cxa-u1-acceptance:
    # U1.7 (#435): acceptance gate ของ UAT first slice บน backend จริง (ไม่มี API mock) ก่อนเปิด #416
    # API entry `uat-main` (DCONTACT_API_PROFILE=uat) + Postgres/Keycloak/object storage ของ dev compose + Console ผ่าน Vite
    # สั่งเอง: `gh workflow run CI --ref main -f acceptance=u1` — marker `U1_ACCEPTANCE_GATE_PASSED` ออกเฉพาะ
    # ทุก check PASS บน U1_EXPECTED_COMMIT_SHA และแปลว่า "พร้อมเปิด #416" เท่านั้น ไม่ใช่ UAT ผ่าน
    # หลักฐาน = manifest + screenshot เท่านั้น (ห้าม trace/HAR/video ตาม #379)
