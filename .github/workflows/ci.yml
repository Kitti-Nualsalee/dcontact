  cxa-s2-provider-conformance:
    # S2.6 (#366): S2-LINE-PR01 บน protected runner (macOS ที่ถือ Keychain + local ngrok binding)
    # token/secret ไม่เข้า GitHub Actions — job นี้รับแค่ reference จาก `vars` และส่งออกเฉพาะ
    # sanitized bundle; environment `line-provider-pilot` ต้องมี required reviewer ก่อนเริ่ม
    # PR01 ไม่มี push — PR02/RB01 (S2.7) ต้องมี one-shot approval ใหม่ทุกครั้ง
    # หลัง RB01 revoke token แล้วให้รับ sanitized PR01/PR02/RB01 bundles ที่ protected runner
    # สร้างไว้ก่อนหน้าใน SHA เดียวกัน; ห้ามรัน PR01 ซ้ำด้วย token ที่ถูก revoke
    if: github.event_name == 'workflow_dispatch' && (inputs.acceptance == 's2-pr01' || inputs.acceptance == 's2') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, line-pilot]
    environment: line-provider-pilot
    env:
      CXA_S2_PROVIDER_BUNDLE_SOURCE_DIR: ${{ vars.CXA_S2_PROVIDER_BUNDLE_SOURCE_DIR }}
    timeout-minutes: 30
    concurrency:
      group: cxa-s2-provider
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace prerequisites for provider runner
        if: inputs.acceptance == 's2-pr01'
        run: pnpm build

      - name: Run S2-LINE-PR01 provider conformance (no push)
        if: inputs.acceptance == 's2-pr01'
        run: pnpm --filter @d-contact/delivery provider:pr01
        env:
          CXA_S2_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          CXA_S2_PILOT_TENANT_ID: ${{ vars.CXA_S2_PILOT_TENANT_ID }}
          CXA_S2_CREDENTIAL_REF_ID: ${{ vars.CXA_S2_CREDENTIAL_REF_ID }}
          CXA_S2_APPROVED_WEBHOOK_ENDPOINT_DIGEST: ${{ vars.CXA_S2_APPROVED_WEBHOOK_ENDPOINT_DIGEST }}
          CXA_S2_PROVIDER_BUNDLE_DIR: ${{ github.workspace }}/artifacts/cxa-s2/provider

      - name: Import sanitized pilot bundles from protected runner
        if: inputs.acceptance == 's2'
        run: |
          test -n "$CXA_S2_PROVIDER_BUNDLE_SOURCE_DIR"
          source_dir="$CXA_S2_PROVIDER_BUNDLE_SOURCE_DIR/$GITHUB_SHA"
          test -f "$source_dir/pr01.json"
          test -f "$source_dir/pilot.json"
          mkdir -p artifacts/cxa-s2/provider
          cp "$source_dir/pr01.json" artifacts/cxa-s2/provider/pr01.json
          cp "$source_dir/pilot.json" artifacts/cxa-s2/provider/pilot.json
          CXA_S2_EXPECTED_COMMIT_SHA="$GITHUB_SHA" node scripts/cxa-s2-provider-bundle.mjs \
            artifacts/cxa-s2/provider/pr01.json artifacts/cxa-s2/provider/pilot.json

      - name: Upload sanitized provider bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxa-s2-provider-bundle-${{ github.sha }}
          path: artifacts/cxa-s2/provider/
          if-no-files-found: error
          retention-days: 90

  cxa-s2-acceptance:
    # S2.6 (#366): ingestion + 19 checks — ตรวจ bundle ซ้ำ (schema/hash/final-main/negative scan)
    # แล้วรัน automated 16 checks บน SHA เดียวกัน; bundle หายหรือเสีย = candidate เท่านั้น
    # `gh workflow run CI --ref main -f acceptance=s2` — marker ออกได้เฉพาะ clean final main SHA
    needs: cxa-s2-provider-conformance
    if: always() && github.event_name == 'workflow_dispatch' && inputs.acceptance == 's2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
