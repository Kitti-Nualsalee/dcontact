name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance:
        # push/PR run the unit and integration tests related to the diff; the acceptance suites are dispatched manually
        description: 'Test suite (unit | all | integration | object-storage | a1-fast | browser | s1 | chain | cg4 | cg5 | j2 | j5 | j5-focused | s2-pr01 | s2 | s2-focused | u1)'
        type: choice
        options: [
            unit,
            all,
            integration,
            object-storage,
            a1-fast,
            browser,
            s1,
            # ADR-032: S1 → J2/CG4 → J3 → J5 in a single dispatch on the same SHA
            chain,
            cg4,
            cg5,
            j2,
            j5,
            j5-focused,
            s2-pr01,
            s2,
            s2-focused,
            u1,
          ]
        default: unit

jobs:
  integration-impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      managed: ${{ steps.impact.outputs.managed }}
      core: ${{ steps.impact.outputs.core }}
      people: ${{ steps.impact.outputs.people }}
      voice: ${{ steps.impact.outputs.voice }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the classifier and its fallback when the diff base is unusable
        run: node --test scripts/ci-impact.test.mjs
      - name: Select integration tests from the diff or the manual input
        id: impact
        run: node scripts/ci-impact.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ACCEPTANCE: ${{ inputs.acceptance }}

  managed-routing-sip:
    needs: integration-impact
    # If the classifier fails or has no output, run it anyway; manual dispatch selects integration or all
    if: always() && !cancelled() && needs.integration-impact.outputs.managed != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@d-contact/router..." build
      - name: Prepare the digest-pinned images of the dev SIP sandbox
        run: |
          docker pull postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          docker pull safarov/freeswitch@sha256:f156e01a96d48944078ed7f0e24304be63ea15f6466cf607a0aeb6cb47761da7
          docker pull ctaloi/sipp@sha256:c459f2340443ddcc159227efc798217dbdaad0dbe88b76b78b1a876aa271986a
      - name: Prove offer20s/budget60s/restart against a real caller and B-leg
        run: pnpm voice:managed-routing:acceptance
      - name: Collect SIP and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-routing-sip-evidence
          path: /tmp/managed-*/
          if-no-files-found: warn
          retention-days: 7

  core-settings-writer-races:
    needs: integration-impact
    # If the classifier fails or has no output, run it anyway; manual dispatch selects integration or all
    if: always() && !cancelled() && needs.integration-impact.outputs.core != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.4
        env:
          POSTGRES_USER: dcontact
          POSTGRES_PASSWORD: dcontact
          POSTGRES_DB: dcontact
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dcontact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
      APPLICATION_DATABASE_URL: postgresql://dcontact_app:dcontact_app@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter "@d-contact/api^..." --filter "@d-contact/journey^..." --filter "@d-contact/dialer^..." build
      - run: pnpm db:migrate && pnpm db:rls && pnpm db:rls
      - name: Check that discovery catches required cases that are missing or skipped
        run: node --test scripts/core-settings-writer-tests.test.mjs
      - name: Check Team HTTP, final constraints and actual writer races in both orders
        run: pnpm test:core-settings:writers

  tenant-people-boundary:
    needs: integration-impact
    # If the classifier fails or has no output, run it anyway; manual dispatch selects integration or all
    if: always() && !cancelled() && needs.integration-impact.outputs.people != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter "@d-contact/api^..." build
      - name: Install browser for real invitation onboarding
        run: pnpm --filter @d-contact/console exec playwright install --with-deps chromium
      - name: Check B2 HTTP/RLS and B3 intent/SMTP on a real Keycloak in a separate sandbox
        run: pnpm voice:tenant-people:intent-boundary && pnpm voice:tenant-people:boundary

  e1-voice-gateway:
    needs: integration-impact
    # If the classifier fails or has no output, run it anyway; manual dispatch selects integration or all
    if: always() && !cancelled() && needs.integration-impact.outputs.voice != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dcontact
          POSTGRES_PASSWORD: dcontact
          POSTGRES_DB: dcontact
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dcontact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
      APPLICATION_DATABASE_URL: postgresql://dcontact_app:dcontact_app@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter "@d-contact/api^..." --filter "@d-contact/telephony^..." build
      - name: Check local RTP relay isolation and shutdown without sending real media
        run: pnpm --filter @d-contact/telephony exec tsx --test src/local-rtp-relay.test.ts src/local-rtp-relay-main.test.ts
      - run: pnpm db:migrate && pnpm db:rls
      - name: Check gateway with submission/rollout/settlement under real RLS
        run: >-
          pnpm --filter @d-contact/delivery exec tsx --test --test-concurrency=1
          src/e1-voice-command-authority.integration.ts
          src/voice-originate-dispatcher.integration.ts
          src/voice-originate-outcome.integration.ts
          src/voice-rollout-control.integration.ts
      - name: Check SIP flush and credential serialization under real RLS
        run: |
          pnpm --filter @d-contact/telephony exec tsx --test src/e1-registration-flush.integration.ts
          pnpm --filter @d-contact/api exec tsx --test src/agent-sip-credentials.integration.ts
          pnpm --filter @d-contact/api exec tsx --test src/agent-availability.integration.ts
      - name: Check B6 local account deny and the existing lease after disable under real RLS
        run: |
          pnpm --filter @d-contact/api exec tsx --test src/local-account-verifier.integration.ts
          pnpm --filter @d-contact/api exec tsx --test src/tenant-people-disable.integration.ts
          pnpm --filter @d-contact/api exec tsx --test src/work-session.integration.ts
      - name: Check Voice wrap-up V1 and legacy guards under real RLS
        run: |
          pnpm --filter @d-contact/api exec tsx --test src/agent-workspace.integration.ts
          pnpm --filter @d-contact/router exec tsx --test src/inbound-voice-router.integration.ts

      - name: Check B1 catalog, command, quota and cross-tenant/team permissions over HTTP with real RLS
        run: pnpm --filter @d-contact/api exec tsx --test src/tenant-voice-catalog.integration.ts
      - name: Check B2 reservation, fenced worker, mapping and pending activation over HTTP with real RLS
        run: pnpm --filter @d-contact/api exec tsx --test src/tenant-people-operations.integration.ts
      - name: Check authority of the new B2 account and disable compensation under real RLS
        run: pnpm --filter @d-contact/api exec tsx --test src/tenant-provisioned-authority.integration.ts
      - name: Check People directory, pagination and positive identity authority over HTTP with real RLS
        run: pnpm --filter @d-contact/api exec tsx --test src/tenant-people-directory.integration.ts
      - name: Check account team transfer (#998) with revision/idle fence under real RLS
        run: pnpm --filter @d-contact/api exec tsx --test src/tenant-people-team-change.integration.ts
      - name: Check display-name edit and account re-enable (#998) with fenced worker, receipt and quota under real RLS
        run: pnpm --filter @d-contact/api exec tsx --test src/tenant-people-account-change.integration.ts
      - name: Check B4 skills, binding, scope and idle guards over HTTP with real RLS
        run: |
          pnpm --filter @d-contact/api exec tsx --test src/tenant-voice-configuration.integration.ts
          pnpm --filter @d-contact/router test:integration
      - name: Check B4 migration rejects cross-tenant assignment and enforces level/RLS
        env:
          VOICE_SKILL_TEST_CONTAINER: ${{ job.services.postgres.id }}
          VOICE_SKILL_TEST_USER: dcontact
        run: pnpm --filter @d-contact/db exec tsx --test src/voice-skill-scope.integration.ts

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build all packages
        run: pnpm build

      - name: Prettier check
        run: pnpm lint

      - name: No new Thai text in source code
        run: node --test scripts/check-no-thai.test.mjs && pnpm lint:thai

      - name: K8s UAT offline manifest checks
        run: node --test scripts/k8s-uat-render.test.mjs

      - name: Tenant onboarding operator script (#977)
        run: node --test scripts/tenant-voice-onboarding.test.mjs

      - name: Unit tests (no external services)
        run: pnpm test:unit

      - name: CG5 external OpenAPI breaking-change guard
        run: node scripts/cg5-openapi-breaking-check.mjs && node --test scripts/cg5-openapi-breaking-check.test.mjs
        env:
          CG5_EXTERNAL_OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      # CG4.11 (#194): registry/validator/marker suppression run without any infrastructure
      - name: CG4 readiness validator tests
        run: pnpm test:cxa-cg4-readiness

      - name: J3 readiness validator tests
        run: pnpm test:cxa-j3-readiness

      - name: Acceptance dependency marker tests (#559)
        run: pnpm test:acceptance-dependency

      # CG5.11 (#295): registry/validator/marker suppression and the MG01 migration scan need no infrastructure
      - name: CG5 readiness validator tests
        run: pnpm test:cxa-cg5-readiness

      # J5.1 (#339): the schema registry matches the migrations and rls.sql without infrastructure
      - name: J5 schema readiness validator tests
        run: pnpm test:cxa-j5-schema-readiness

      # S2.1 (#365): the LINE persistence registry matches the migrations/rls.sql and the migration is expand-only
      - name: S2 schema readiness validator tests
        run: pnpm test:cxa-s2-schema-readiness

      # S2.6 (#366): 19-check registry, manifest/bundle validator, marker suppression and negative scan
      - name: S2 readiness validator tests
        run: pnpm test:cxa-s2-readiness

      # A1.1 (#406): the control-plane schema registry matches the migrations/rls.sql and the migration is expand-only
      - name: A1 schema readiness validator tests
        run: pnpm test:a1-schema-readiness

      # U1.6 (#434): UAT compose/Dockerfile/realm/workflow + migration guard + live smoke against a stub
      - name: U1.6 UAT deployment readiness validator tests
        run: pnpm test:u1-uat-readiness

      - name: Check B7 read-only readiness and the Workspace profile
        run: pnpm test:voice-v1b:readiness && pnpm voice:v1b:readiness -- --static

      # U1.7 (#435): acceptance gate markers, manifest negative scan, and gate realm/env
      - name: U1.7 acceptance gate validator tests
        run: pnpm test:u1-acceptance

      # A1.2 (#407): token matrix + guard over real HTTP (tokens are signed locally, no Keycloak needed)
      # the real-boundary run against a real Keycloak uses `pnpm a1:auth:boundary` after `pnpm infra:up`
      - name: A1.2 platform auth boundary tests
        run: pnpm --filter @d-contact/platform-api test

      # ADR-029 (#532): a single S3_* config set, MINIO_* fallback, fail closed and readiness via HeadBucket
      - name: Object storage config tests
        run: pnpm test:object-storage

      # D1.11 (#450): formatter/locale/catalog check — CI fails when a key is missing in th or en
      # D1.14 (#453): no hardcoded text in the Journeys/shell pages and CSS uses tokens only
      - name: D1.11 i18n foundation tests + catalog check
        run: pnpm test:d1-i18n

      # #515: Keycloak login theme — no literal color values, tokens exist, selectors that UAT uses are still present
      - name: Keycloak login theme tests
        run: pnpm test:keycloak-theme

      # #562: inbound customer calls arrive through the simulated pstn-sim trunk and there is no static SIP credential (E1.10)
      - name: FreeSWITCH config tests
        run: pnpm test:freeswitch-config

      # E1.14 (#488): postMessage v1 contract test (JSON Schema ↔ TypeScript types ↔ parser)
      # + origin/source, rate limit, tiered screen-pop and the iframe-side activity queue
      - name: E1.14 dphone embed contract tests
        run: pnpm test:e1-embed-contract

  object-storage-contract:
    # ADR-029: the S3 contract the app uses — the same suite on every digest-pinned backend (booted from an image, no cache)
    # rustfs    (#533) dev/CI from the dev compose
    # seaweedfs (#540) UAT/on-prem with the same entrypoint as UAT (s3.json + API policy) + least privilege
    if: github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'all' || inputs.acceptance == 'object-storage')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [rustfs, seaweedfs]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start object storage (RustFS)
        if: matrix.backend == 'rustfs'
        run: |
          docker compose -f infra/docker/docker-compose.dev.yml up -d --wait object-storage || {
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color object-storage
            exit 1
          }

      - name: Start object storage (SeaweedFS, UAT entrypoint)
        if: matrix.backend == 'seaweedfs'
        run: |
          secret() { openssl rand -hex "$1"; }
          root_key="s3root$(secret 4)"; root_secret="$(secret 24)"
          api_key="uatapi$(secret 6)"; api_secret="$(secret 24)"
          for value in "$root_secret" "$api_secret"; do echo "::add-mask::$value"; done
          image="$(sed -n 's/^ *image: \(docker.io\/chrislusf\/seaweedfs:[^ ]*\)$/\1/p' infra/uat/docker-compose.uat.yml | head -n 1)"
          test -n "$image"
          docker run -d --name object-storage -p 127.0.0.1:9000:8333 \
            --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp \
            -v "$PWD/infra/uat/bin/object-storage-entrypoint.sh:/uat/object-storage-entrypoint.sh:ro" \
            -e UAT_S3_ROOT_ACCESS_KEY="$root_key" -e UAT_S3_ROOT_SECRET_KEY="$root_secret" \
            -e UAT_S3_API_ACCESS_KEY="$api_key" -e UAT_S3_API_SECRET_KEY="$api_secret" \
            --entrypoint /bin/sh "$image" /uat/object-storage-entrypoint.sh
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:9000/healthz && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:9000/healthz || { docker logs object-storage; exit 1; }
          {
            echo "S3_ENDPOINT=http://127.0.0.1:9000"
            echo "S3_ACCESS_KEY=$root_key"; echo "S3_SECRET_KEY=$root_secret"
            echo "UAT_S3_ROOT_ACCESS_KEY=$root_key"; echo "UAT_S3_ROOT_SECRET_KEY=$root_secret"
            echo "UAT_S3_API_ACCESS_KEY=$api_key"; echo "UAT_S3_API_SECRET_KEY=$api_secret"
          } >> "$GITHUB_ENV"

      - name: Bootstrap buckets twice (idempotent)
        run: node scripts/object-storage-init.mjs && node scripts/object-storage-init.mjs

      - name: Readiness via HeadBucket
        run: |
          node --input-type=module -e "
            import { missingBuckets } from './scripts/object-storage-readiness.mjs';
            const missing = await missingBuckets();
            if (missing.length) { console.error('missing:', missing.join(', ')); process.exit(1); }
            console.log('✓ HeadBucket passed for every dev bucket');
          "

      - name: S3 contract tests
        run: pnpm test:object-storage:contract

      - name: UAT bootstrap + API least privilege (policy in the UAT entrypoint)
        if: matrix.backend == 'seaweedfs'
        run: |
          node scripts/uat-object-storage.mjs init
          node scripts/uat-object-storage.mjs init
          pnpm test:object-storage:least-privilege

      - name: Object storage logs
        if: failure() && matrix.backend == 'seaweedfs'
        run: docker logs object-storage 2>&1 | tail -n 100

  a1-platform-control-fast-gate:
    # A1.1 (#406) / #393 manual gate: idempotency, reservation race, tombstone, CAS, completion
    # invariant, append-only, isolation matrix, Platform API, tenant lifecycle gate and Platform
    # Console (Playwright/axe against an API mock) — no real Keycloak needed
    if: github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'all' || inputs.acceptance == 'a1-fast')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dcontact
          POSTGRES_PASSWORD: dcontact
          POSTGRES_DB: dcontact
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dcontact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
      PLATFORM_DATABASE_URL: postgresql://dcontact_platform:dcontact_platform@localhost:5433/dcontact?schema=public
      APPLICATION_DATABASE_URL: postgresql://dcontact_app:dcontact_app@localhost:5433/dcontact?schema=public
      # A1.4 (#409): tenant bootstrap role (#388 decision) — RLS only allows tenants still in PROVISIONING
      PROVISIONER_DATABASE_URL: postgresql://dcontact_provisioner:dcontact_provisioner@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Install Playwright browser (Platform Console e2e)
        run: pnpm --filter @d-contact/platform-console exec playwright install --with-deps chromium

      - name: Build dependencies of platform-api, api gateway and console
        run: pnpm --filter "@d-contact/platform-api^..." --filter "@d-contact/api^..." --filter "@d-contact/platform-console^..." build

      - name: Migrate and bootstrap roles/RLS
        run: pnpm db:migrate && pnpm db:rls

      - name: Platform Console typecheck
        run: pnpm --filter @d-contact/platform-console typecheck

      # A1.8 (#413): the Platform provisioning alert rules must pass the promtool unit test
      - name: Platform provisioning alert rules
        run: pnpm a1:alerts:test

      # A1.8 (#413): a single runner runs every fast check of #393, then emits acceptance-manifest.json
      # (non-waivable gate: FAIL = job fails) — the real-boundary run uses `pnpm a1:acceptance:boundary`
      - name: A1 acceptance runner self-test
        run: pnpm test:a1-acceptance

      - name: A1 fast acceptance
        run: pnpm a1:acceptance

      - name: Upload A1 acceptance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-acceptance-${{ github.sha }}
          path: artifacts/a1/*/acceptance-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload A1 failure logs (redacted) + Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a1-acceptance-logs-${{ github.sha }}
          path: |
            artifacts/a1/
            apps/platform-console/test-results
          retention-days: 30

  d1-ui-react:
    # D1.10 (#449): stylelint (tokens only) + axe 0 serious/critical TH/EN + keyboard for every component
    if: github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'all' || inputs.acceptance == 'browser')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build ui-react (dist + preview)
        run: pnpm --filter "@d-contact/ui-react..." build

      - name: stylelint + typecheck
        run: pnpm --filter @d-contact/ui-react test

      - name: Install Playwright browser
        run: pnpm --filter @d-contact/ui-react exec playwright install --with-deps chromium

      - name: Preview e2e (axe + keyboard)
        run: pnpm --filter @d-contact/ui-react test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d1-ui-react-playwright
          path: packages/ui-react/test-results
          retention-days: 7

  d1-i18n-browser:
    # D1.11 (#450): switching language does not reload (performance/marker of the same page) and the formatter on real Chromium
    # D1.13 (#452): flag ui.shell.v2 — shell/legacy, shell axe, WorkspaceApp is not remounted
    # D1.14 (#453): Journeys page on i18n/component/token — existing J5 flow + TH/EN + shell on/off
    # D1.15 (#454): dphone at 3 sizes / separate window / language switch — existing SIP session and no reload (simulated transport)
    if: github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'all' || inputs.acceptance == 'browser')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Console/Workspace dependencies
        run: pnpm --filter "@d-contact/console^..." --filter "@d-contact/workspace^..." build

      - name: Install Playwright browser
        run: pnpm --filter @d-contact/console exec playwright install --with-deps chromium

      - name: Console i18n + shell e2e
        run: pnpm --filter @d-contact/console exec playwright test e2e/i18n.spec.ts e2e/shell.spec.ts e2e/journey-authoring.spec.ts e2e/home.spec.ts e2e/agent-history.spec.ts e2e/voice-routing.spec.ts e2e/voice-configuration.spec.ts e2e/tenant-people.spec.ts e2e/tenant-people-directory.spec.ts e2e/tenant-people-invitation.spec.ts e2e/tenant-people-disable.spec.ts e2e/tenant-people-account.spec.ts

      - name: Workspace shell e2e
        run: pnpm --filter @d-contact/workspace exec playwright test e2e/shell.spec.ts e2e/dphone.spec.ts e2e/dphone-embed.spec.ts e2e/dphone-host-reference.spec.ts e2e/agent-availability.spec.ts e2e/dphone-owner.spec.ts e2e/wrapup.spec.ts e2e/wrapup-recovery.spec.ts

