name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      acceptance:
        # push/PR รันชุด unit; ชุดที่ใช้ service จริงสั่งด้วยมือ
        description: 'ชุดทดสอบ (unit | all | object-storage | a1-fast | browser | s1 | chain | cg4 | cg5 | j2 | j5 | j5-focused | s2-pr01 | s2 | s2-focused | u1)'
        type: choice
        options: [
            unit,
            all,
            object-storage,
            a1-fast,
            browser,
            s1,
            # ADR-032: S1 → J2/CG4 → J3 → J5 ใน dispatch เดียวบน SHA เดียวกัน
            chain,
            cg4,
            cg5,
            j2,
            j5,
            j5-focused,
            s2-pr01,
            s2,
            s2-focused,
            u1,
          ]
        default: unit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build all packages
        run: pnpm build

      - name: Prettier check
        run: pnpm lint

      - name: Unit tests (no external services)
        run: pnpm test:unit

      - name: CG5 external OpenAPI breaking-change guard
        run: node scripts/cg5-openapi-breaking-check.mjs && node --test scripts/cg5-openapi-breaking-check.test.mjs
        env:
          CG5_EXTERNAL_OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      # CG4.11 (#194): registry/validator/marker suppression รันได้โดยไม่ต้องมี infrastructure
      - name: CG4 readiness validator tests
        run: pnpm test:cxa-cg4-readiness

      - name: J3 readiness validator tests
        run: pnpm test:cxa-j3-readiness

      - name: Acceptance dependency marker tests (#559)
        run: pnpm test:acceptance-dependency

      # CG5.11 (#295): registry/validator/marker suppression และ MG01 migration scan ไม่ต้องใช้ infrastructure
      - name: CG5 readiness validator tests
        run: pnpm test:cxa-cg5-readiness

      # J5.1 (#339): registry ของ schema ตรงกับ migration และ rls.sql โดยไม่ต้องใช้ infrastructure
      - name: J5 schema readiness validator tests
        run: pnpm test:cxa-j5-schema-readiness

      # S2.1 (#365): registry ของ LINE persistence ตรงกับ migration/rls.sql และ migration เป็น expand-only
      - name: S2 schema readiness validator tests
        run: pnpm test:cxa-s2-schema-readiness

      # S2.6 (#366): 19-check registry, manifest/bundle validator, marker suppression และ negative scan
      - name: S2 readiness validator tests
        run: pnpm test:cxa-s2-readiness

      # A1.1 (#406): registry ของ control-plane schema ตรง migration/rls.sql และ migration เป็น expand-only
      - name: A1 schema readiness validator tests
        run: pnpm test:a1-schema-readiness

      # U1.6 (#434): compose/Dockerfile/realm/workflow ของ UAT + migration guard + live smoke กับ stub
      - name: U1.6 UAT deployment readiness validator tests
        run: pnpm test:u1-uat-readiness

      # U1.7 (#435): marker ของ acceptance gate, negative scan ของ manifest และ realm/env ของ gate
      - name: U1.7 acceptance gate validator tests
        run: pnpm test:u1-acceptance

      # A1.2 (#407): token matrix + guard ผ่าน HTTP จริง (token ลงนามในเครื่อง ไม่ต้องใช้ Keycloak)
      # real-boundary กับ Keycloak จริงรันด้วย `pnpm a1:auth:boundary` หลัง `pnpm infra:up`
      - name: A1.2 platform auth boundary tests
        run: pnpm --filter @d-contact/platform-api test

      # ADR-029 (#532): config S3_* ชุดเดียว, fallback MINIO_*, fail closed และ readiness ผ่าน HeadBucket
      - name: Object storage config tests
        run: pnpm test:object-storage

      # D1.11 (#450): formatter/locale/catalog check — CI ล้มเมื่อ key ขาด th หรือ en
      # D1.14 (#453): ไม่มีข้อความ hardcode ในหน้า Journeys/shell และ CSS ใช้ token เท่านั้น
      - name: D1.11 i18n foundation tests + catalog check
        run: pnpm test:d1-i18n

      # #515: login theme ของ Keycloak — ไม่มีค่าสีตรง, token มีอยู่จริง, selector ที่ UAT ใช้ยังอยู่
      - name: Keycloak login theme tests
        run: pnpm test:keycloak-theme

      # #562: สายลูกค้าเข้าทาง trunk จำลอง pstn-sim และไม่มี static SIP credential (E1.10)
      - name: FreeSWITCH config tests
        run: pnpm test:freeswitch-config

      # E1.14 (#488): contract test ของ postMessage v1 (JSON Schema ↔ TypeScript types ↔ parser)
      # + origin/source, rate limit, screen-pop ตามระดับ และคิว activity ฝั่ง iframe
      - name: E1.14 dphone embed contract tests
        run: pnpm test:e1-embed-contract

  object-storage-contract:
    # ADR-029: S3 contract ที่แอปใช้ — ชุดเดียวกันบนทุก backend ที่ตรึง digest (บูตจาก image ไม่มี cache)
    #   rustfs    (#533) dev/CI จาก dev compose
    #   seaweedfs (#540) UAT/on-prem ด้วย entrypoint ตัวเดียวกับ UAT (s3.json + policy ของ API) + least privilege
    if: github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'all' || inputs.acceptance == 'object-storage')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [rustfs, seaweedfs]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start object storage (RustFS)
        if: matrix.backend == 'rustfs'
        run: |
          docker compose -f infra/docker/docker-compose.dev.yml up -d --wait object-storage || {
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color object-storage
            exit 1
          }

      - name: Start object storage (SeaweedFS, UAT entrypoint)
        if: matrix.backend == 'seaweedfs'
        run: |
          secret() { openssl rand -hex "$1"; }
          root_key="s3root$(secret 4)"; root_secret="$(secret 24)"
          api_key="uatapi$(secret 6)"; api_secret="$(secret 24)"
          for value in "$root_secret" "$api_secret"; do echo "::add-mask::$value"; done
          image="$(sed -n 's/^ *image: \(docker.io\/chrislusf\/seaweedfs:[^ ]*\)$/\1/p' infra/uat/docker-compose.uat.yml | head -n 1)"
          test -n "$image"
          docker run -d --name object-storage -p 127.0.0.1:9000:8333 \
            --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp \
            -v "$PWD/infra/uat/bin/object-storage-entrypoint.sh:/uat/object-storage-entrypoint.sh:ro" \
            -e UAT_S3_ROOT_ACCESS_KEY="$root_key" -e UAT_S3_ROOT_SECRET_KEY="$root_secret" \
            -e UAT_S3_API_ACCESS_KEY="$api_key" -e UAT_S3_API_SECRET_KEY="$api_secret" \
            --entrypoint /bin/sh "$image" /uat/object-storage-entrypoint.sh
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:9000/healthz && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:9000/healthz || { docker logs object-storage; exit 1; }
          {
            echo "S3_ENDPOINT=http://127.0.0.1:9000"
            echo "S3_ACCESS_KEY=$root_key"; echo "S3_SECRET_KEY=$root_secret"
            echo "UAT_S3_ROOT_ACCESS_KEY=$root_key"; echo "UAT_S3_ROOT_SECRET_KEY=$root_secret"
            echo "UAT_S3_API_ACCESS_KEY=$api_key"; echo "UAT_S3_API_SECRET_KEY=$api_secret"
          } >> "$GITHUB_ENV"

      - name: Bootstrap buckets twice (idempotent)
        run: node scripts/object-storage-init.mjs && node scripts/object-storage-init.mjs

      - name: Readiness via HeadBucket
        run: |
          node --input-type=module -e "
            import { missingBuckets } from './scripts/object-storage-readiness.mjs';
            const missing = await missingBuckets();
            if (missing.length) { console.error('missing:', missing.join(', ')); process.exit(1); }
            console.log('✓ HeadBucket ผ่านทุก dev bucket');
          "

      - name: S3 contract tests
        run: pnpm test:object-storage:contract

      - name: UAT bootstrap + least privilege ของ API (policy ใน entrypoint ของ UAT)
        if: matrix.backend == 'seaweedfs'
        run: |
          node scripts/uat-object-storage.mjs init
          node scripts/uat-object-storage.mjs init
          pnpm test:object-storage:least-privilege

      - name: Object storage logs
        if: failure() && matrix.backend == 'seaweedfs'
        run: docker logs object-storage 2>&1 | tail -n 100

  a1-platform-control-fast-gate:
    # A1.1 (#406) / #393 gate แบบสั่งเอง: idempotency, reservation race, tombstone, CAS, completion
    # invariant, append-only, isolation matrix, Platform API, tenant lifecycle gate และ Platform
    # Console (Playwright/axe กับ API mock) — ไม่ต้องใช้ Keycloak จริง
    if: github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'all' || inputs.acceptance == 'a1-fast')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dcontact
          POSTGRES_PASSWORD: dcontact
          POSTGRES_DB: dcontact
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dcontact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
      PLATFORM_DATABASE_URL: postgresql://dcontact_platform:dcontact_platform@localhost:5433/dcontact?schema=public
      APPLICATION_DATABASE_URL: postgresql://dcontact_app:dcontact_app@localhost:5433/dcontact?schema=public
      # A1.4 (#409): role ของ tenant bootstrap (#388 decision) — RLS ยอมเฉพาะ tenant ที่ยัง PROVISIONING
      PROVISIONER_DATABASE_URL: postgresql://dcontact_provisioner:dcontact_provisioner@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Install Playwright browser (Platform Console e2e)
        run: pnpm --filter @d-contact/platform-console exec playwright install --with-deps chromium

      - name: Build dependencies of platform-api, api gateway และ console
        run: pnpm --filter "@d-contact/platform-api^..." --filter "@d-contact/api^..." --filter "@d-contact/platform-console^..." build

      - name: Migrate and bootstrap roles/RLS
        run: pnpm db:migrate && pnpm db:rls

      - name: Platform Console typecheck
        run: pnpm --filter @d-contact/platform-console typecheck

      # A1.8 (#413): alert rule ของ Platform provisioning ต้องผ่าน promtool unit test
      - name: Platform provisioning alert rules
        run: pnpm a1:alerts:test

      # A1.8 (#413): runner เดียวรันทุก fast check ของ #393 แล้วออก acceptance-manifest.json
      # (non-waivable gate ที่ FAIL = job fail) — real-boundary รันด้วย `pnpm a1:acceptance:boundary`
      - name: A1 acceptance runner self-test
        run: pnpm test:a1-acceptance

      - name: A1 fast acceptance
        run: pnpm a1:acceptance

      - name: Upload A1 acceptance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-acceptance-${{ github.sha }}
          path: artifacts/a1/*/acceptance-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload A1 failure logs (redacted) + Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a1-acceptance-logs-${{ github.sha }}
          path: |
            artifacts/a1/
            apps/platform-console/test-results
          retention-days: 30

  d1-ui-react:
    # D1.10 (#449): stylelint (token เท่านั้น) + axe 0 serious/critical TH/EN + keyboard ของทุก component
    if: github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'all' || inputs.acceptance == 'browser')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build ui-react (dist + preview)
        run: pnpm --filter "@d-contact/ui-react..." build

      - name: stylelint + typecheck
        run: pnpm --filter @d-contact/ui-react test

      - name: Install Playwright browser
        run: pnpm --filter @d-contact/ui-react exec playwright install --with-deps chromium

      - name: Preview e2e (axe + keyboard)
        run: pnpm --filter @d-contact/ui-react test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d1-ui-react-playwright
          path: packages/ui-react/test-results
          retention-days: 7

  d1-i18n-browser:
    # D1.11 (#450): สลับภาษาไม่ reload (performance/marker ของหน้าเดิม) และ formatter บน Chromium จริง
    # D1.13 (#452): flag ui.shell.v2 — shell/legacy, axe ของ shell, ไม่ remount WorkspaceApp
    # D1.14 (#453): หน้า Journeys บน i18n/component/token — J5 flow เดิม + TH/EN + shell เปิด/ปิด
    # D1.15 (#454): dphone 3 ขนาด/แยกหน้าต่าง/สลับภาษา — SIP session เดิมและไม่ reload (transport จำลอง)
    if: github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'all' || inputs.acceptance == 'browser')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Console/Workspace dependencies
        run: pnpm --filter "@d-contact/console^..." --filter "@d-contact/workspace^..." build

      - name: Install Playwright browser
        run: pnpm --filter @d-contact/console exec playwright install --with-deps chromium

      - name: Console i18n + shell e2e
        run: pnpm --filter @d-contact/console exec playwright test e2e/i18n.spec.ts e2e/shell.spec.ts e2e/journey-authoring.spec.ts

      - name: Workspace shell e2e
        run: pnpm --filter @d-contact/workspace exec playwright test e2e/shell.spec.ts e2e/dphone.spec.ts e2e/dphone-embed.spec.ts e2e/dphone-host-reference.spec.ts

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d1-i18n-playwright
          path: |
            apps/console/test-results
            apps/workspace/test-results
          retention-days: 7

  s1-convergence-acceptance:
    # S1 ใช้เวลานานและ J3 final gate เรียกเองอยู่แล้ว: ไม่รันทุก main push
    # เพื่อให้ development ใช้ focused gate ได้ก่อน แล้วเรียก S1 เมื่อเลือก manual เท่านั้น
    if: github.event_name == 'workflow_dispatch' && (inputs.acceptance == 's1' || inputs.acceptance == 'chain')
    runs-on: ubuntu-latest
    concurrency:
      group: s1-convergence-acceptance-${{ github.ref }}
      cancel-in-progress: false # ADR-032: S1 ที่สั่งทีหลังต้องไม่ตัด S1 ของ chain ที่รันอยู่
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure local acceptance environment
        run: |
          cp .env.example .env
          mkdir -p infra/docker/data/redpanda
          chmod 777 infra/docker/data/redpanda
          # Docker creates a bind-mount source as root when it is absent. Create
          # this one before Compose so both the Node archiver and FreeSWITCH can
          # create tenant-scoped recording directories on GitHub runners.
          mkdir -p infra/docker/data/freeswitch-recordings
          chmod 777 infra/docker/data/freeswitch-recordings

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for browser acceptance
        run: pnpm --filter @d-contact/workspace exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace prerequisites for gateway acceptance
        run: pnpm build

      - name: Bootstrap acceptance infrastructure
        run: |
          pnpm infra:ready || {
            docker compose -f infra/docker/docker-compose.dev.yml ps
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color redpanda
            exit 1
          }

      - name: Run S1 convergence acceptance on final main SHA
        run: pnpm s1:acceptance
        env:
          S1_EXPECTED_COMMIT_SHA: ${{ github.sha }}

      - name: Upload immutable S1 evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-evidence-${{ github.sha }}
          path: artifacts/s1/${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90

      # #559: C1 manifest (J1_ACCEPTED) ที่ S1-REG-01 รันไว้ ให้ J2/J5 ตรวจ marker แทนการรัน C1 ซ้ำ
      - name: Upload immutable C1 evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxa-c1-evidence-${{ github.sha }}
          path: artifacts/cxa-c1/${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Stop acceptance infrastructure
        if: always()
        run: pnpm infra:down

  cxa-j2-acceptance:
    # #559: J2-REG01 ไม่รัน C1/S1 acceptance ซ้อนแล้ว แต่ตรวจ marker จาก artifact ของ run S1 บน SHA เดียวกัน
    # จึงต้องสั่ง `acceptance=s1` ให้ผ่านก่อน (ดู docs/acceptance-dependencies.md)
    needs: s1-convergence-acceptance
    # ADR-032: chain รอ S1 ของ run เดียวกันผ่านก่อน; โหมด j2/all ไม่รอ (S1 ถูก skip)
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (inputs.acceptance == 'all' || inputs.acceptance == 'j2' ||
      (inputs.acceptance == 'chain' && needs.s1-convergence-acceptance.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cxa-j2-acceptance
      cancel-in-progress: false
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure local acceptance environment
        run: |
          cp .env.example .env
          mkdir -p infra/docker/data/redpanda
          chmod 777 infra/docker/data/redpanda
          # Docker creates a bind-mount source as root when it is absent. Create
          # this one before Compose so both the Node archiver and FreeSWITCH can
          # create tenant-scoped recording directories on GitHub runners.
          mkdir -p infra/docker/data/freeswitch-recordings
          chmod 777 infra/docker/data/freeswitch-recordings

      - run: pnpm install --frozen-lockfile

      # phase-two-readiness เรียก workspace/console test:e2e ซึ่งใช้ Playwright
      - name: Install Playwright Chromium for browser acceptance
        run: pnpm --filter @d-contact/workspace exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace prerequisites for gateway acceptance
        run: pnpm build

      - name: Bootstrap acceptance infrastructure
        run: |
          pnpm infra:ready || {
            docker compose -f infra/docker/docker-compose.dev.yml ps
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color redpanda
            exit 1
          }

      - name: Fetch dependency evidence from runs on the same SHA
        run: node scripts/acceptance-fetch-evidence.mjs J2
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run J2 acceptance on final main SHA
        run: pnpm cxa:j2:acceptance
        env:
          CXA_J2_EXPECTED_COMMIT_SHA: ${{ github.sha }}

      - name: Upload immutable J2 evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxa-j2-evidence-${{ github.sha }}
          path: artifacts/cxa-j2/${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Stop acceptance infrastructure
        if: always()
        run: pnpm infra:down

  cxa-cg4-acceptance:
    # CG4.11 (#194): สั่งเองบน main (`gh workflow run CI --ref main -f acceptance=cg4`)
    # #572: CG4-REG01 ไม่รัน S1 ซ้อนแล้ว แต่ตรวจ S1 manifest (CG3 marker + S1-REG-01 PASS) จาก artifact
    # ของ run S1 บน SHA เดียวกัน — ต้องสั่ง `acceptance=s1` ให้ผ่านก่อน (docs/acceptance-dependencies.md)
    # marker ออกได้เฉพาะ HEAD == origin/main == expectedCommitSha บน clean checkout
    needs: s1-convergence-acceptance
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.acceptance == 'all' || inputs.acceptance == 'cg4' ||
      (inputs.acceptance == 'chain' && needs.s1-convergence-acceptance.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cxa-cg4-acceptance
      cancel-in-progress: false
    env:
      DATABASE_URL: postgresql://dcontact:dcontact@localhost:5433/dcontact?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

