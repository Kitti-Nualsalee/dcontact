            docker compose -f infra/docker/docker-compose.dev.yml ps
            docker compose -f infra/docker/docker-compose.dev.yml logs --no-color keycloak object-storage
            exit 1
          }

      - name: Run U1 acceptance gate on final main SHA
        run: pnpm cxa:u1:acceptance
        env:
          U1_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          # evidence store ของ API = object storage ของ dev compose (object-storage-init สร้าง bucket uat-evidence)
          S3_ENDPOINT: http://localhost:9000
