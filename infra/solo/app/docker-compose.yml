# #923: app VM of the D-Contact Solo UAT (192.168.31.207)
# Runs the full system like the dev stack; the database is on the data VM and TLS ends at nginx on the voice VM
#
# Use only through infra/solo/bin/solo-uat.sh. On the VM this file lives in /opt/dcontact-solo/app/
# solo.env (mode 600) sits next to this file and holds every secret. Never commit it
#
# Ports published on the host:
#   SOLO_APP_IP:8080   web (Caddy), accepts only nginx on the voice VM
#   127.0.0.1:8081     Keycloak, for the operator through an SSH tunnel only
name: dcontact-solo

x-service: &service
  restart: unless-stopped
  env_file: solo.env
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '5'

services:
  redis:
    <<: *service
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb']
    mem_limit: 320m
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    <<: *service
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --mode dev-container
      - --kafka-addr internal://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda:29092
    mem_limit: 1400m
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      rpk topic create dc.telephony.events dc.channel.events dc.interaction.events dc.agent.events dc.telephony.commands dc.channel.commands dc.journey.events dc.customer.events dc.admin.events dc.qm.jobs dc.qm.events dc.contact-governance.events dc.contact-governance.acknowledgements dc.case.commands dc.case.events dc.dialer.commands dc.dialer.events dc.delivery.commands dc.platform.dlq
      --brokers redpanda:29092 --topic-config retention.ms=604800000 || true;
      exit 0"

  object-storage:
    <<: *service
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    env_file: []
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'false'
    mem_limit: 384m
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    <<: *service
    image: axllent/mailpit:v1.20
    env_file: []
    mem_limit: 96m

  keycloak:
    <<: *service
    image: dcontact-solo/keycloak:${SOLO_IMAGE_TAG:?SOLO_IMAGE_TAG is required}
    env_file: []
    # Production mode behind a proxy: TLS ends at nginx on the voice VM, Keycloak listens on http in the internal network
    # The realm is imported on first boot only (an existing realm is not overwritten)
    command: ['start', '--import-realm', '--features=organization']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${SOLO_DATA_IP:?SOLO_DATA_IP is required}:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${SOLO_KEYCLOAK_DB_PASSWORD:?SOLO_KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: https://${SOLO_CONSOLE_HOST:?SOLO_CONSOLE_HOST is required}/auth
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD is required}
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
    mem_limit: 1200m
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import:ro
    healthcheck:
      # Same as UAT (#680): check for a 200 status line instead of grepping the body for UP
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 && grep -m 1 '^HTTP/' <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    <<: *service
    image: dcontact-solo/services:${SOLO_IMAGE_TAG}
    working_dir: /app/api
    command: ['node', 'dist/main.js']
    environment:
      PORT: '3000'
      # The API must connect as dcontact_app (not the superuser owner) so RLS applies as in production,
      # and definers that reject superuser/bypassrls sessions (such as People commands, #998) work
      DATABASE_URL: ${APPLICATION_DATABASE_URL:?APPLICATION_DATABASE_URL is required}
    mem_limit: 900m
    depends_on:
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  router:
    <<: *service
    image: dcontact-solo/services:${SOLO_IMAGE_TAG}
    working_dir: /app/router
    command: ['node', 'dist/main.js']
    mem_limit: 384m
    depends_on:
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  telephony:
    <<: *service
    image: dcontact-solo/services:${SOLO_IMAGE_TAG}
    working_dir: /app/telephony
    command: ['node', 'dist/main.js']
    mem_limit: 384m
    environment:
      # FreeSWITCH writes to this path on the voice VM; Telephony reads the same files over NFS at /mnt/dcontact-solo/recordings
      FREESWITCH_RECORDINGS_DIR: /var/lib/freeswitch/recordings
      FREESWITCH_RECORDINGS_HOST_DIR: /mnt/dcontact-solo/recordings
    volumes:
      # recordings inside is a systemd NFS automount on the host (solo-uat.sh mount_recordings).
      # Bind the parent directory, not the automount point, so the container starts even when NFS does not answer; rslave shows mounts made later
      - type: bind
        source: /mnt/dcontact-solo
        target: /mnt/dcontact-solo
        bind:
          propagation: rslave
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  qm:
    <<: *service
    # QM worker: takes interaction.ended, creates transcription jobs, consumes dc.qm.jobs and runs QmRetryDispatcher every 5 seconds.
    # It sits behind the `qm` profile: solo-uat.sh's `docker compose up -d` does not start it until the operator
    # adds COMPOSE_PROFILES=qm to solo.env after pointing QM_MEDIA_ENDPOINT and QM_TRANSCRIPTION_* at a real provider (https).
    # Started with placeholder values, every job (automatic and manual) fails maxAttempts times and becomes FAILED.
    # How to turn it on/off: docs/solo-uat.md, section QM worker
    profiles: ['qm']
    image: dcontact-solo/services:${SOLO_IMAGE_TAG}
    working_dir: /app/qm
    command: ['node', 'dist/main.js']
    environment:
      # Uses the NOBYPASSRLS app role: every QM query runs in withTenantDatabaseTransaction except reading tenants (no RLS)
      DATABASE_URL: ${APPLICATION_DATABASE_URL:?APPLICATION_DATABASE_URL is required}
    # The ASR host (QM_TRANSCRIPTION_ENDPOINT) is not in DNS: point it at nginx on the voice VM, which holds *.osd.co.th
    # Use :- not :? because compose checks variables of services whose profile is off too
    extra_hosts:
      - '${SOLO_ASR_HOST:-asr.invalid}:${SOLO_VOICE_IP:?SOLO_VOICE_IP is required}'
    mem_limit: 384m
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  qm-asr-simulator:
    <<: *service
    # Simulated ASR per D-Contact ASR Provider Protocol v1 (docs/qm-asr-provider-protocol.md) until a real model exists
    # Downloads the real recording through the signed URL and finds the sound regions, but the text is a canned simulated phrase
    # Behind the same `qm` profile as QM; reached only through https://SOLO_ASR_HOST (nginx -> web), no host port
    profiles: ['qm']
    image: dcontact-solo/services:${SOLO_IMAGE_TAG}
    # Not the whole solo.env: the simulator only gets the token and the media host
    env_file: []
    working_dir: /app/qm
    command: ['node', 'dist/asr-simulator-main.js']
    environment:
      PORT: '8090'
      # An empty value stops the simulator from starting (checked in code)
      ASR_SIMULATOR_API_KEY: ${QM_TRANSCRIPTION_API_KEY:-}
      ASR_SIMULATOR_MEDIA_HOSTS: ${SOLO_MEDIA_HOST:-}
    extra_hosts:
      - '${SOLO_MEDIA_HOST:-media.invalid}:${SOLO_VOICE_IP:?SOLO_VOICE_IP is required}'
    mem_limit: 448m

  journey:
    <<: *service
    # #1067 Journey worker: takes interaction.outcome_recorded from dc.interaction.events, matches published journeys and
    # sends owner commands (ENSURE_CASE to dc.case.commands). Behind the `journey` profile together with `cases`:
    # add it to COMPOSE_PROFILES in solo.env, with INTERACTION_OUTCOME_EVENTS=on for the API to emit the outcome facts.
    # How to turn it on/off: docs/solo-uat.md, section Journey
    profiles: ['journey']
    image: dcontact-solo/services:${SOLO_IMAGE_TAG}
    working_dir: /app/journey
    command: ['node', 'dist/main.js']
    environment:
      # NOBYPASSRLS app role: every Journey query runs in a tenant transaction except reading tenants (no RLS)
      DATABASE_URL: ${APPLICATION_DATABASE_URL:?APPLICATION_DATABASE_URL is required}
    mem_limit: 384m
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  cases:
    <<: *service
    # #1067 Cases owner worker: consumes ENSURE_CASE from dc.case.commands, writes cs_* and answers on dc.case.events
    profiles: ['journey']
    image: dcontact-solo/services:${SOLO_IMAGE_TAG}
    working_dir: /app/cases
    command: ['node', 'dist/main.js']
    environment:
      DATABASE_URL: ${APPLICATION_DATABASE_URL:?APPLICATION_DATABASE_URL is required}
    mem_limit: 256m
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  line-simulator:
    <<: *service
    # #1054 LINE simulator (scripts/line-simulator.mjs) until the tenant has a real LINE OA and a public webhook URL
    # Plays LINE's Messaging API for the API (LINE_API_BASE_URL=http://line-simulator:8890 + LINE_API_SIMULATOR=on)
    # and LINE users for the tester at https://SOLO_CONSOLE_HOST/line-sim/ (Caddy). No host port
    # Behind the `line-sim` profile: add it to COMPOSE_PROFILES in solo.env. How to: docs/solo-uat.md, section LINE
    profiles: ['line-sim']
    image: dcontact-solo/ops:${SOLO_IMAGE_TAG}
    env_file: []
    working_dir: /repo
    command: ['node', 'scripts/line-simulator.mjs']
    environment:
      LINE_SIMULATOR_HOST: 0.0.0.0
      LINE_SIMULATOR_PORT: '8890'
      # the tester pastes the Console webhook URL; the simulator sends it straight to the API inside the network
      LINE_SIMULATOR_WEBHOOK_ORIGIN: http://api:3000
    mem_limit: 128m

  web:
    <<: *service
    image: dcontact-solo/web:${SOLO_IMAGE_TAG}
    env_file: []
    environment:
      SOLO_CONSOLE_HOST: ${SOLO_CONSOLE_HOST}
      SOLO_WORKSPACE_HOST: ${SOLO_WORKSPACE_HOST:?SOLO_WORKSPACE_HOST is required}
      SOLO_VOICE_IP: ${SOLO_VOICE_IP:?SOLO_VOICE_IP is required}
      # QM hosts: when unset, use .invalid names that no request matches
      SOLO_MEDIA_HOST: ${SOLO_MEDIA_HOST:-media.invalid}
      SOLO_ASR_HOST: ${SOLO_ASR_HOST:-asr.invalid}
    cap_drop:
      - ALL
    mem_limit: 128m
    ports:
      - '${SOLO_APP_IP:?SOLO_APP_IP is required}:8080:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - keycloak

volumes:
  redis-data:
  redpanda-data:
  object-storage-data:
