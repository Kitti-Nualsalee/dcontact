# #923: nginx บน VM voice ของ UAT Solo — จุดเดียวที่ผู้ใช้เข้า (HTTPS 443)
# solo-uat.sh แทนค่า __SOLO_*__ ก่อนส่งขึ้น VM; cert อยู่ใน ./tls (ไม่อยู่ใน Git)
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  access_log /dev/stdout;
  sendfile on;
  client_max_body_size 5m;

  # No path or query: recording signed URLs carry the access key and signature, and the path has tenant/interaction ids
  log_format qm_no_target '$remote_addr [$time_local] "$request_method $host" $status $body_bytes_sent $request_time';

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream solo_web {
    server __SOLO_APP_IP__:8080;
    keepalive 16;
  }

  server {
    listen 80;
    server_name __SOLO_CONSOLE_HOST__ __SOLO_WORKSPACE_HOST__;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name __SOLO_CONSOLE_HOST__ __SOLO_WORKSPACE_HOST__;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:solo:10m;

    # directory ของ FreeSWITCH เรียก web บน VM app ตรง ไม่ผ่านที่นี่
    location ^~ /internal/ {
      return 404;
    }

    # SIP over WSS ของ browser → FreeSWITCH ในเครื่องเดียวกัน (cert ของ FreeSWITCH เป็น self-signed)
    location = /sip-ws {
      proxy_pass https://127.0.0.1:7443;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_ssl_verify off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass http://solo_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # เขียนทับ ไม่ต่อท้าย: web เชื่อ X-Forwarded-For จาก VM นี้เท่านั้น จึงต้องไม่ให้ผู้ใช้ปลอมค่าได้
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }

  # QM: media (signed URLs of the recordings bucket) and the ASR provider, on the same *.osd.co.th cert
  # The only callers today are QM and the ASR simulator on the app VM, so only that IP is allowed; add an external provider's IP if one is used
  server {
    listen 443 ssl;
    http2 on;
    server_name __SOLO_MEDIA_HOST__ __SOLO_ASR_HOST__;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:solo:10m;

    access_log /dev/stdout qm_no_target;
    # Denials and upstream errors print the full request line (with the signed query) at error level
    error_log /dev/stderr crit;
    allow __SOLO_APP_IP__;
    deny all;
    client_max_body_size 64k;

    location / {
      proxy_pass http://solo_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      # Protocol v1 is synchronous: allow QM_TRANSCRIPTION_TIMEOUT_MS (default 5 minutes) plus headroom
      proxy_read_timeout 600s;
      proxy_buffering off;
    }
  }

  # ชื่ออื่นที่ชี้มาที่ IP นี้ไม่ได้อะไร
  server {
    listen 443 ssl default_server;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    return 444;
  }
}
