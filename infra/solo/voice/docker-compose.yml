# #923: voice VM of the D-Contact Solo UAT (192.168.31.206)
# nginx (TLS), Kamailio (SIP edge) and FreeSWITCH use the host network of the VM in the Solo layout
# use only through infra/solo/bin/solo-uat.sh; the files live at /opt/dcontact-solo/voice/ on the VM
#
# ports on the VM:
#   443/TCP              nginx → web on the app VM and /sip-ws → FreeSWITCH WSS 127.0.0.1:7443
#   5060/UDP+TCP         Kamailio accepts trunks / simulated calls that are in the voice edge tables
#   5080/UDP             FreeSWITCH profile pstn-sim accepts only Kamailio (ACL)
#   8021/TCP             ESL accepts only the app VM (ACL)
#   16384-16683/UDP      RTP
name: dcontact-solo-voice

x-service: &service
  restart: unless-stopped
  network_mode: host
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '5'

services:
  nginx:
    <<: *service
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    mem_limit: 128m

  kamailio:
    <<: *service
    image: dcontact-solo/kamailio:${SOLO_IMAGE_TAG:?SOLO_IMAGE_TAG is required}
    environment:
      KAMAILIO_SIP_IP: ${SOLO_VOICE_IP:?SOLO_VOICE_IP is required}
      KAMAILIO_DB_URL: postgres://kamailio_ro:${SOLO_KAMAILIO_DB_PASSWORD:?SOLO_KAMAILIO_DB_PASSWORD is required}@${SOLO_DATA_IP:?SOLO_DATA_IP is required}:5432/dcontact_voice_edge
    volumes:
      - ./dispatcher.list:/etc/kamailio/dispatcher.list:ro
    mem_limit: 256m

  freeswitch:
    <<: *service
    image: docker.io/safarov/freeswitch@sha256:b31c743f4c911a19687c61e3214968f2a24f93f9d3d667cc26284192e158ffc6
    entrypoint: ['/bin/sh', '/solo-freeswitch/entrypoint.sh']
    environment:
      SOLO_VOICE_IP: ${SOLO_VOICE_IP}
      SOLO_APP_IP: ${SOLO_APP_IP:?SOLO_APP_IP is required}
      TELEPHONY_NODE_ID: ${TELEPHONY_NODE_ID:?TELEPHONY_NODE_ID is required}
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?FREESWITCH_ESL_PASSWORD is required}
      FREESWITCH_DIRECTORY_PASSWORD: ${FREESWITCH_DIRECTORY_PASSWORD:?FREESWITCH_DIRECTORY_PASSWORD is required}
    volumes:
      - ./freeswitch:/solo-freeswitch:ro
      # recordings: exported over NFS so Telephony on the app VM reads them and sends them to object storage (solo-uat.sh voice)
      - /srv/dcontact-solo/recordings:/var/lib/freeswitch/recordings
    tmpfs:
      - /etc/freeswitch:mode=0755
    cap_add:
      - SYS_NICE
    mem_limit: 1g
    healthcheck:
      # docker exec gets the container's env (the entrypoint unsets it only in the FreeSWITCH process)
      test: ['CMD-SHELL', 'fs_cli -p "$$FREESWITCH_ESL_PASSWORD" -x status']
      interval: 10s
      timeout: 5s
      retries: 18
