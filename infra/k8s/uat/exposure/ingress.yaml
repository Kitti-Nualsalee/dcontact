        - dcontact-platform-uat.osd.co.th
      secretName: dcontact-uat-wildcard-tls
  rules:
    - host: dcontact-platform-uat.osd.co.th
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-console
                port:
                  name: http
