apiVersion: batch/v1
kind: Job
metadata:
  generateName: dcontact-uat-platform-catalog-
  namespace: dcontact-uat
spec:
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dcontact-uat-ghcr
      restartPolicy: Never
      containers:
        - name: seed
          image: __PLATFORM_API_IMAGE__
          command: [node, scripts/platform-uat-seed-catalog.mjs]
          env:
            - name: PLATFORM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dcontact-uat-db
                  key: PLATFORM_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
