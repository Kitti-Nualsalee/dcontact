# อีเมลทดสอบอยู่ภายใน cluster เท่านั้น; ไม่มี Ingress
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: web
      port: 8025
      targetPort: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: dcontact-uat
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
          env:
            - name: MP_WEBROOT
              value: /mail/
            - name: MP_MAX_MESSAGES
              value: '1000'
            - name: MP_MAX_AGE
              value: 30d
            - name: MP_DATABASE
              value: /data/mailpit.db
            - name: MP_ALLOWED_HOSTS
              value: mailpit:8025
          ports:
            - name: smtp
              containerPort: 1025
            - name: web
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /mail/
              port: web
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
