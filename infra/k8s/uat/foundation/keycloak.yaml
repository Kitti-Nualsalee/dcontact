apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: dcontact-uat
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dcontact-uat-ghcr
      containers:
        - name: keycloak
          image: __PLATFORM_KEYCLOAK_IMAGE__
          args:
            - start
            - --features=organization
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              valueFrom:
                secretKeyRef:
                  name: dcontact-uat-db
                  key: KC_DB_URL
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dcontact-uat-db
                  key: KC_DB_USERNAME
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dcontact-uat-db
                  key: KC_DB_PASSWORD
            - name: KC_HOSTNAME
              value: https://dcontact-uat.osd.co.th/auth
            - name: KC_HOSTNAME_STRICT
              value: 'true'
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HTTP_ENABLED
              value: 'true'
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: 'true'
            - name: JAVA_OPTS_KC_HEAP
              value: -Xms256m -Xmx1200m
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dcontact-uat-identity
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dcontact-uat-identity
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: management
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2048Mi
