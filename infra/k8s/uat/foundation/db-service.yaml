# PostgreSQL อยู่นอก cluster; selectorless Service ให้ชื่อภายในคงที่
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
spec:
  ports:
    - name: postgres
      port: 4567
      targetPort: 4567
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-external-1
  labels:
    kubernetes.io/service-name: postgres-external
    endpointslice.kubernetes.io/managed-by: dcontact-uat-manifests
addressType: IPv4
ports:
  - name: postgres
    port: 4567
    protocol: TCP
endpoints:
  - addresses:
      - 10.136.2.11
    conditions:
      ready: true
