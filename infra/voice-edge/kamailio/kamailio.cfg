#!KAMAILIO
#
# ขอบ SIP ของ D-Contact ตาม ADR-038 (docs/adr/038-single-voice-stack-tenant-trunks.md)
#
# - สายเข้าจาก trunk: ระบุ trunk จาก IP ต้นทาง ระบุ tenant จากเบอร์ปลายทางที่ผูกกับ trunk นั้น
#   ใส่ X-DContact-Domain (SIP domain ของ tenant) แล้วส่งต่อ FreeSWITCH ใน dispatcher set 1
# - สายออกจาก FreeSWITCH: เบอร์ต้นทางต้องเป็นของ tenant ใน X-DContact-Domain และออกได้เฉพาะ trunk
#   ที่เบอร์นั้นผูกอยู่ จึงใช้ trunk ของ tenant อื่นไม่ได้
# - เพดานสายพร้อมกันต่อ tenant นับด้วย dialog profile
# - สายเข้าที่ระบุ tenant ไม่ได้ถูกปฏิเสธที่นี่ ไม่ถึง FreeSWITCH
#
# ข้อมูล trunk/เบอร์อ่านจากฐาน voice edge แบบอ่านอย่างเดียว (infra/voice-edge/schema.sql)
# ค่าที่ต่างตาม environment มาจาก env (entrypoint.sh ตรวจและประกอบ KAMAILIO_SQLCON ให้):
#   KAMAILIO_SIP_IP   IP ที่ฟัง SIP (IP ของ VM voice หรือ IP ของ container)
#   KAMAILIO_DB_URL   postgres://<role อ่านอย่างเดียว>:<password>@<host>:<port>/<database>
# รายชื่อ FreeSWITCH อยู่ใน /etc/kamailio/dispatcher.list (set 1)

#!defenv SIP_IP=KAMAILIO_SIP_IP
#!defenvs SQLCON=KAMAILIO_SQLCON

#!define DS_MEDIA 1

####### Global Parameters #########

debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

children=4
tcp_children=2
auto_aliases=no
listen=udp:SIP_IP:5060
listen=tcp:SIP_IP:5060
server_header="Server: D-Contact"
user_agent_header="User-Agent: D-Contact"
sip_warning=0

####### Modules Section ########

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "db_postgres.so"
loadmodule "sqlops.so"
loadmodule "dispatcher.so"
loadmodule "dialog.so"

modparam("ctl", "binrpc", "unix:/tmp/kamailio_ctl")

modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 60000)

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

modparam("sqlops", "sqlcon", SQLCON)

modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "ds_ping_interval", 10)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_from", "sip:edge@dcontact.invalid")
modparam("dispatcher", "ds_probing_threshold", 2)
modparam("dispatcher", "ds_inactive_threshold", 2)
modparam("dispatcher", "xavp_dst", "_dsdst_")
modparam("dispatcher", "xavp_ctx", "_dsctx_")

modparam("dialog", "profiles_with_value", "tenant_calls")
modparam("dialog", "default_timeout", 43200)

####### Routing Logic ########

request_route {
	route(REQINIT);

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	route(WITHINDLG);

	# จากจุดนี้เป็น request เริ่มต้นเท่านั้น
	if (is_method("ACK")) {
		exit;
	}
	t_check_trans();

	if (!is_method("INVITE")) {
		sl_send_reply("405", "Method Not Allowed");
		exit;
	}

	if (ds_is_from_list(DS_MEDIA)) {
		route(FROM_MEDIA);
	} else {
		route(FROM_TRUNK);
	}
	exit;
}

route[REQINIT] {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (is_method("OPTIONS") && uri == myself && $rU == $null) {
		sl_send_reply("200", "Keepalive");
		exit;
	}
	if (!sanity_check("17895", "7")) {
		xlog("L_WARN", "malformed request from $si:$sp\n");
		exit;
	}
}

route[WITHINDLG] {
	if (!has_totag()) {
		return;
	}
	if (loose_route()) {
		route(RELAY);
		exit;
	}
	if (is_method("ACK")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}
	sl_send_reply("404", "Not here");
	exit;
}

# สายเข้าจาก trunk หรือ PBX ของลูกค้า
route[FROM_TRUNK] {
	# header ภายในจากภายนอกไม่น่าเชื่อถือ ลบทิ้งก่อนทำอย่างอื่น
	remove_hf_re("^X-DContact-");

	if (!($rU =~ "^\+?[0-9]{3,20}$")) {
		xlog("L_NOTICE", "reject inbound: bad destination from $si\n");
		sl_send_reply("404", "Not Found");
		exit;
	}

	# $si เป็น IP ที่ Kamailio อ่านจาก socket และ $rU ผ่าน regex ตัวเลขแล้ว จึงฝังใน SQL ได้
	sql_xquery("edge",
		"SELECT n.tenant_domain, n.route_to, e.max_channels "
		"FROM trunk t "
		"JOIN number n ON n.trunk_id = t.id AND n.enabled "
		"JOIN tenant_edge e ON e.tenant_domain = n.tenant_domain AND e.enabled "
		"WHERE t.enabled AND t.source_ip = '$si'::inet AND n.e164 = '$rU' "
		"LIMIT 1",
		"inb");
	if ($xavp(inb=>tenant_domain) == $null) {
		xlog("L_NOTICE", "reject inbound: no tenant for $rU from $si\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}

	$var(tenant) = $xavp(inb=>tenant_domain);
	$var(max) = $xavp(inb=>max_channels);
	route(TENANT_LIMIT);

	append_hf("X-DContact-Domain: $var(tenant)\r\n");
	$rU = $xavp(inb=>route_to);

	if (!ds_select_dst(DS_MEDIA, "4")) {
		xlog("L_ERR", "no FreeSWITCH available for $var(tenant)\n");
		sl_send_reply("503", "Service Unavailable");
		exit;
	}
	t_on_failure("MEDIA_FAILOVER");
	record_route();
	route(RELAY);
}

# สายออกจาก FreeSWITCH
route[FROM_MEDIA] {
	# ไม่มี header แล้ว $var ได้ค่า 0 ซึ่งผ่าน regex ของ domain จึงต้องตรวจ null ก่อน
	if ($hdr(X-DContact-Domain) == $null) {
		xlog("L_NOTICE", "reject outbound: no tenant header from $si\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}
	$var(tenant) = $hdr(X-DContact-Domain);
	remove_hf_re("^X-DContact-");

	if (!($var(tenant) =~ "^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$")
			|| !($fU =~ "^\+?[0-9]{3,20}$")
			|| !($rU =~ "^\+?[0-9]{3,20}$")) {
		xlog("L_NOTICE", "reject outbound: bad tenant/caller/destination from $si\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}

	# เบอร์ต้นทางต้องเป็นของ tenant และสายออกใช้ trunk ที่เบอร์นั้นผูกอยู่เท่านั้น
	sql_xquery("edge",
		"SELECT t.host, t.port, t.transport, e.max_channels "
		"FROM number n "
		"JOIN trunk t ON t.id = n.trunk_id AND t.enabled "
		"JOIN tenant_edge e ON e.tenant_domain = n.tenant_domain AND e.enabled "
		"WHERE n.enabled AND n.e164 = '$fU' AND n.tenant_domain = '$var(tenant)' "
		"LIMIT 1",
		"outb");
	if ($xavp(outb=>host) == $null) {
		xlog("L_NOTICE", "reject outbound: caller $fU not owned by $var(tenant)\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}

	$var(max) = $xavp(outb=>max_channels);
	route(TENANT_LIMIT);

	$du = "sip:" + $xavp(outb=>host) + ":" + $xavp(outb=>port) + ";transport=" + $xavp(outb=>transport);
	record_route();
	route(RELAY);
}

# เพดานสายพร้อมกันต่อ tenant ทั้งสายเข้าและสายออก
route[TENANT_LIMIT] {
	dlg_manage();
	get_profile_size("tenant_calls", "$var(tenant)", "$var(active)");
	if ($var(active) >= $var(max)) {
		xlog("L_NOTICE", "reject: $var(tenant) at limit $var(active)/$var(max)\n");
		sl_send_reply("503", "Tenant Call Limit");
		exit;
	}
	set_dlg_profile("tenant_calls", "$var(tenant)");
}

route[RELAY] {
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

failure_route[MEDIA_FAILOVER] {
	if (t_is_canceled()) {
		exit;
	}
	if (t_check_status("(408)|(5[0-9][0-9])") || (t_branch_timeout() && !t_branch_replied())) {
		ds_mark_dst("ip");
		if (ds_next_dst()) {
			t_on_failure("MEDIA_FAILOVER");
			route(RELAY);
		}
	}
}
