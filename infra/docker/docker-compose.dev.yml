name: d-contact-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dcontact
      POSTGRES_PASSWORD: dcontact
      POSTGRES_DB: dcontact
    ports:
      # host 5433 เพื่อเลี่ยงชนกับ PostgreSQL local ที่มีอยู่แล้วบนเครื่อง dev
      - '5433:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dcontact']
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: dcontact
    entrypoint: >
      /bin/sh -ec "
      exists=$$(psql -h postgres -U dcontact -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = 'keycloak'\");
      if [ \"$$exists\" != \"1\" ]; then createdb -h postgres -U dcontact keycloak; fi"

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dcontact
      MINIO_ROOT_PASSWORD: dcontact-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  # สร้าง bucket "recordings" อัตโนมัติตอน start
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 dcontact dcontact-secret; do sleep 1; done;
      mc mb -p local/recordings || true;
      exit 0"

  # Kafka-compatible event backbone (dev) — production ใช้ Kafka/MSK/Redpanda ได้ (API เดียวกัน)
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      # containers อื่นต่อผ่าน redpanda:29092, โปรเซสบน host ต่อ localhost:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports:
      - '9092:9092'
    volumes:
      - ./data/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 5s
      retries: 20

  # สร้าง topics อัตโนมัติตอน start (pattern เดียวกับ minio-init)
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      rpk topic create dc.telephony.events dc.channel.events dc.interaction.events dc.agent.events dc.telephony.commands dc.channel.commands dc.journey.events dc.qm.jobs dc.qm.events dc.contact-governance.events dc.contact-governance.acknowledgements dc.platform.dlq
      --brokers redpanda:29092 --topic-config retention.ms=604800000 || true;
      exit 0"

  # Web UI สำหรับดู topics/messages ตอน dev
  redpanda-console:
    image: redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - '8085:8080'

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: start-dev --import-realm --features=organization
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: dcontact
      KC_DB_PASSWORD: dcontact
    ports:
      - '8081:8080'
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8080"']
      interval: 10s
      timeout: 5s
      retries: 18

  freeswitch:
    image: safarov/freeswitch:latest
    ports:
      - '5060:5060/udp' # SIP UDP
      - '5060:5060/tcp' # SIP TCP
      - '5066:5066/tcp' # SIP over WebSocket (dev softphone)
      - '8022:8021/tcp' # ESL — dev only, ห้าม expose ใน production; host port เปลี่ยนจาก 8021 เพราะบางเครื่อง dev มี launchd socket จองพอร์ตนี้ไว้อยู่แล้ว
      - '16384-16420:16384-16420/udp' # RTP media
    volumes:
      - ../freeswitch/conf:/etc/freeswitch
      - ./data/freeswitch-recordings:/var/lib/freeswitch/recordings
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'fs_cli -x status']
      interval: 10s
      timeout: 5s
      retries: 12
