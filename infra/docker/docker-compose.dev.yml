name: d-contact-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dcontact
      POSTGRES_PASSWORD: dcontact
      POSTGRES_DB: dcontact
    # default max_connections=20 (nowhere near enough once several test files each
    # open their own PrismaClient with the driver's default num_cpus*2+1 pool size)
    # causes transient "too many clients already" failures under full-suite/full-stack
    # load unrelated to any actual code defect — see apps/delivery's concurrent-enqueue
    # integration test, which is deterministic given real headroom.
    command: postgres -c max_connections=200
    ports:
      # host 5433 to avoid clashing with a local PostgreSQL already running on the dev machine
      - '5433:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dcontact']
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: dcontact
    entrypoint: >
      /bin/sh -ec "
      exists=$$(psql -h postgres -U dcontact -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = 'keycloak'\");
      if [ \"$$exists\" != \"1\" ]; then createdb -h postgres -U dcontact keycloak; fi"

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ADR-029 (#533): dev/CI object storage is RustFS (Apache 2.0); the app talks to it only through the S3 API (`S3_*`)
  # UAT/on-prem/cloud use SeaweedFS; pin the release + digest, never use latest
  # buckets are created by `scripts/object-storage-init.mjs` (the S3 API is not tied to a vendor CLI), which `pnpm infra:up` calls
  # console: http://localhost:9001/rustfs/console/ (dcontact / dcontact-secret)
  object-storage:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: dcontact
      RUSTFS_SECRET_KEY: dcontact-secret
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - '9000:9000'
      - '9001:9001'
    # named volume: the image runs as user `rustfs` (non-root); a bind mount that docker creates as root on Linux is not writable
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka-compatible event backbone (dev); production may use Kafka/MSK/Redpanda (same API)
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      # other containers connect through redpanda:29092, processes on the host through localhost:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports:
      - '9092:9092'
    volumes:
      - ./data/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 5s
      retries: 20

  # create topics automatically on start
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      rpk topic create dc.telephony.events dc.channel.events dc.interaction.events dc.agent.events dc.telephony.commands dc.channel.commands dc.journey.events dc.customer.events dc.admin.events dc.qm.jobs dc.qm.events dc.contact-governance.events dc.contact-governance.acknowledgements dc.case.commands dc.case.events dc.dialer.commands dc.dialer.events dc.delivery.commands dc.platform.dlq
      --brokers redpanda:29092 --topic-config retention.ms=604800000 || true;
      exit 0"

  # Web UI for browsing topics/messages during dev
  # purely a dev tool; no test or script calls it, so it sits in its own profile to
  # keep it from eating CI runner memory during acceptance (measured ~266 MiB); enable it explicitly with
  # `pnpm infra:console`
  # A1.8b (#473): view Platform provisioning traces in dev (`pnpm infra:tracing`); receives OTLP HTTP on :4318
  jaeger:
    profiles: ['tools']
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4318:4318'

  redpanda-console:
    profiles: ['tools']
    image: redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - '8085:8080'

  keycloak:
    # #592: 26.7.5 (fine-grained admin permissions v2); pin the same digest as infra/keycloak/Dockerfile
    image: docker.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    command: start-dev --import-realm --features=organization
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: dcontact
      KC_DB_PASSWORD: dcontact
    ports:
      - '8081:8080'
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
      # A1.4b (#436): invitation guard (build with `pnpm infra:keycloak:extensions`)
      - ../keycloak/providers:/opt/keycloak/providers:ro
      # #515: D-Contact login theme (tokens/logo copied with `pnpm infra:keycloak:theme`)
      - ../keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/8080"']
      interval: 10s
      timeout: 5s
      retries: 18

  # A1.4 (#409): dev/test email sink; Keycloak sends invitations (execute-actions) here
  # nothing is sent externally; the UI/API at http://localhost:8025 is used to check delivery in real-boundary tests
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - '8025:8025'
      - '1025:1025'
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '1025']
      interval: 5s
      timeout: 3s
      retries: 12

  freeswitch:
    image: safarov/freeswitch:latest
    ports:
      - '5060:5060/udp' # SIP UDP
      - '5060:5060/tcp' # SIP TCP
      - '5066:5066/tcp' # SIP over WebSocket (dev softphone)
      - '8022:8021/tcp' # ESL: dev only, never expose in production; host port changed from 8021 because a launchd socket on some dev machines already holds that port
      - '16384-16420:16384-16420/udp' # RTP media
    volumes:
      - ../freeswitch/conf:/etc/freeswitch
      - ./data/freeswitch-recordings:/var/lib/freeswitch/recordings
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'fs_cli -x status']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  object-storage-data:
