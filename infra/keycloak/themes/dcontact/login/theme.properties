# #515: login theme ของ D-Contact — แบบ B (แผงแบรนด์ซ้าย + ฟอร์มขวา) ตาม prototype ที่ผู้ใช้เลือก
# ต่อยอดจาก theme `keycloak` ของ Keycloak 26.0.0 เพื่อได้ template ทุกหน้าและ js ของ base มาครบ
# แต่ไม่โหลด PatternFly — สี/ระยะ/ตัวอักษรมาจาก tokens.css ของ packages/ui เท่านั้น
# tokens.css, logo.png และ favicon.ico สร้างโดย `pnpm infra:keycloak:theme` (ไม่ commit)
parent=keycloak
import=common/keycloak

stylesCommon=
styles=css/tokens.css css/dcontact.css

meta=viewport==width=device-width,initial-scale=1

# tenant (theme หลัก) | platform (child theme dcontact-platform)
dcVariant=tenant

kcHtmlClass=dc-html
kcBodyClass=dc-body

kcFormClass=dc-form
kcFormGroupClass=dc-field
kcLabelWrapperClass=
kcLabelClass=dc-label
kcInputWrapperClass=
kcInputClass=dc-input
kcInputGroup=dc-input-group
kcInputErrorMessageClass=dc-field-error
kcInputHelperTextBeforeClass=dc-hint
kcInputHelperTextAfterClass=dc-hint
kcFormSettingClass=dc-field--options
kcFormOptionsClass=
kcFormOptionsWrapperClass=dc-options
kcFormButtonsClass=dc-buttons
kcContentWrapperClass=
kcSignUpClass=dc-info
kcInfoAreaWrapperClass=

kcButtonClass=dc-button
kcButtonPrimaryClass=dc-button--primary
kcButtonDefaultClass=dc-button--secondary
kcButtonBlockClass=dc-button--block
kcButtonLargeClass=

kcFormPasswordVisibilityButtonClass=dc-input-group__toggle
kcFormPasswordVisibilityIconShow=dc-icon dc-icon--eye
kcFormPasswordVisibilityIconHide=dc-icon dc-icon--eye-off

kcAlertClass=dc-alert
kcAlertTitleClass=dc-alert__text
kcFeedbackErrorIcon=dc-icon dc-icon--alert
kcFeedbackWarningIcon=dc-icon dc-icon--alert
kcFeedbackSuccessIcon=dc-icon dc-icon--check
kcFeedbackInfoIcon=dc-icon dc-icon--info
kcResetFlowIcon=dc-icon dc-icon--restart

kcLoginOTPListClass=dc-tile
kcLoginOTPListInputClass=dc-tile__input
kcLoginOTPListItemHeaderClass=dc-tile__header
kcLoginOTPListItemIconBodyClass=dc-tile__icon
kcLoginOTPListItemIconClass=dc-icon dc-icon--phone
kcLoginOTPListItemTitleClass=dc-tile__title
