rule_files:
  - platform-provisioning.rules.yml
evaluation_interval: 1m
tests:
  - name: invariant and mixed token are critical immediately
    interval: 1m
    input_series:
      - series: 'dcontact_platform_invariant_violations{invariant="premature_active",instance="w1"}'
        values: '0 0 1 1'
      - series: 'dcontact_platform_invariant_violations{invariant="audit_gap",instance="w1"}'
        values: '0 0 0 0'
      - series: 'dcontact_platform_api_auth_decisions_total{decision="denied",reason="MIXED_TOKEN_TRIPWIRE",capability="none"}'
        values: '0 0 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: PlatformProvisioningInvariantViolated
        exp_alerts: []
      - eval_time: 2m
        alertname: PlatformProvisioningInvariantViolated
        exp_alerts:
          - exp_labels: { severity: critical, invariant: premature_active }
            exp_annotations:
              summary: 'invariant premature_active violated (1 rows)'
              runbook: docs/platform-provisioning-rollout.md#rollback
      - eval_time: 3m
        alertname: PlatformMixedTokenAccepted
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: 'A token with tenant context passed the Platform API identity check (the tripwire already rejected it)'
              runbook: docs/platform-provisioning-rollout.md#rollback

  - name: queue age thresholds of 5 minutes / 30 minutes
    interval: 1m
    input_series:
      - series: 'dcontact_platform_oldest_age_seconds{queue="pending_request"}'
        values: '240 300 360'
      - series: 'dcontact_platform_oldest_age_seconds{queue="invitation_outbox"}'
        values: '0 0 301'
      - series: 'dcontact_platform_oldest_age_seconds{queue="action_required"}'
        values: '1700 1800 1860'
      - series: 'dcontact_platform_oldest_age_seconds{queue="operator_command"}'
        values: '0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: PlatformProvisioningPendingStale
        exp_alerts: []
      - eval_time: 2m
        alertname: PlatformProvisioningPendingStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: 'A PENDING request has been stuck for more than 5 minutes; is the worker stopped or the rollout off?'
      - eval_time: 2m
        alertname: PlatformInvitationOutboxStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: 'invitation outbox stuck (INTENT/AMBIGUOUS) for more than 5 minutes'
      - eval_time: 1m
        alertname: PlatformActionRequiredStale
        exp_alerts: []
      - eval_time: 2m
        alertname: PlatformActionRequiredStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: 'An ACTION_REQUIRED request has been waiting on an operator for more than 30 minutes'
      - eval_time: 2m
        alertname: PlatformOperatorCommandStale
        exp_alerts: []

  - name: retry exhaustion, lease churn and scrape failure
    interval: 1m
    input_series:
      - series: 'dcontact_platform_worker_results_total{source="saga",kind="ACTION_REQUIRED",step="INVITATION",code="ATTEMPTS_EXHAUSTED"}'
        values: '0 0 1'
      - series: 'dcontact_platform_worker_results_total{source="saga",kind="LEASE_LOST",step="READINESS",code="LEASE_LOST"}'
        values: '0 1 2 3 5'
      - series: 'dcontact_platform_health_scrape_success'
        values: '1 0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: PlatformRetryExhausted
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: 'A step used up its retries and was handed to an operator'
      - eval_time: 3m
        alertname: PlatformLeaseChurn
        exp_alerts: []
      - eval_time: 4m
        alertname: PlatformLeaseChurn
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: 'worker loses its lease often (>3 times in 15 minutes)'
      - eval_time: 5m
        alertname: PlatformHealthScrapeFailing
        exp_alerts: []
      - eval_time: 7m
        alertname: PlatformHealthScrapeFailing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: 'Cannot read control plane state from the DB; invariants/backlog are not being checked'
