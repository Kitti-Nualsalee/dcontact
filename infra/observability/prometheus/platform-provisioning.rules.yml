# A1.8 (#413) Platform provisioning alerts per #388 checkpoint 2
# Tested with `pnpm a1:alerts:test` (promtool test rules); a rule change must be paired with a test change
groups:
  - name: platform-provisioning-critical
    rules:
      # isolation / readiness / premature ACTIVE / duplicate ownership / audit gap (#393 non-waivable)
      - alert: PlatformProvisioningInvariantViolated
        expr: max by (invariant) (dcontact_platform_invariant_violations) > 0
        labels:
          severity: critical
        annotations:
          summary: 'invariant {{ $labels.invariant }} violated ({{ $value }} rows)'
          runbook: docs/platform-provisioning-rollout.md#rollback

      - alert: PlatformMixedTokenAccepted
        expr: sum(increase(dcontact_platform_api_auth_decisions_total{reason="MIXED_TOKEN_TRIPWIRE"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: 'A token with tenant context passed the Platform API identity check (the tripwire already rejected it)'
          runbook: docs/platform-provisioning-rollout.md#rollback

  - name: platform-provisioning-warning
    rules:
      - alert: PlatformProvisioningPendingStale
        expr: max(dcontact_platform_oldest_age_seconds{queue="pending_request"}) > 300
        labels:
          severity: warning
        annotations:
          summary: 'A PENDING request has been stuck for more than 5 minutes; is the worker stopped or the rollout off?'

      - alert: PlatformInvitationOutboxStale
        expr: max(dcontact_platform_oldest_age_seconds{queue="invitation_outbox"}) > 300
        labels:
          severity: warning
        annotations:
          summary: 'invitation outbox stuck (INTENT/AMBIGUOUS) for more than 5 minutes'

      - alert: PlatformActionRequiredStale
        expr: max(dcontact_platform_oldest_age_seconds{queue="action_required"}) > 1800
        labels:
          severity: warning
        annotations:
          summary: 'An ACTION_REQUIRED request has been waiting on an operator for more than 30 minutes'

      - alert: PlatformOperatorCommandStale
        expr: max(dcontact_platform_oldest_age_seconds{queue="operator_command"}) > 300
        labels:
          severity: warning
        annotations:
          summary: 'operator command QUEUED for more than 5 minutes'

      - alert: PlatformRetryExhausted
        expr: sum(increase(dcontact_platform_worker_results_total{code="ATTEMPTS_EXHAUSTED"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'A step used up its retries and was handed to an operator'

      - alert: PlatformLeaseChurn
        expr: sum(increase(dcontact_platform_worker_results_total{code="LEASE_LOST"}[15m])) > 3
        labels:
          severity: warning
        annotations:
          summary: 'worker loses its lease often (>3 times in 15 minutes)'

      - alert: PlatformHealthScrapeFailing
        expr: max(dcontact_platform_health_scrape_success) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Cannot read control plane state from the DB; invariants/backlog are not being checked'
