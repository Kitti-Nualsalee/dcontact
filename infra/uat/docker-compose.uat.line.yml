# #565 / ADR-031: the `uat-line` overlay; optionally enables the LINE pilot on the 3-VM UAT
#
# stacks only on docker-compose.uat.yml + docker-compose.uat.3vm.yml; `uat-deploy.sh` applies this file when the flag file
# `$UAT_ROOT/line-pilot.enabled` exists; without the flag = UAT stays fail-closed exactly as before (profile `uat`, UAT-S09)
#
# - line-webhook: receives `POST /webhook/line` + read-only `/api/v1/line-pilot/*` (#566, OIDC); no internet egress, no access token
# - line-pilot:   the runner for the pilot CLI (`docker compose run --rm line-pilot <cli> <command>`); profile `line-pilot`
# - line-egress:  the stack's only internet egress for LINE: TCP passthrough filtered on SNI `api.line.me`
#                 sits on network `linepilot` (the runner only) + `lineegress`; api and other services cannot see it
# - secrets are `0400` files owned by uid 10001 in `/opt/dcontact-uat/secrets/line/` (placed by operator/vm2-line-secrets.sh)
#   no secrets in env
services:
  proxy:
    volumes: !override
      - ./Caddyfile.3vm.line:/etc/caddy/Caddyfile:ro
      # #868: the admission fence must be kept when overriding the proxy volumes
      - /opt/dcontact-uat/admission-fence:/run/dcontact-admission-fence:ro

  line-webhook:
    image: ${API_IMAGE:?API_IMAGE (digest) is required}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    depends_on:
      db-relay:
        condition: service_healthy
    entrypoint: ['node', 'dist/line-webhook-main.js']
    environment:
      NODE_ENV: production
      DCONTACT_API_PROFILE: uat-line
      PORT: '3000'
      DATABASE_URL: postgresql://dcontact_app:${UAT_APP_DB_PASSWORD:?UAT_APP_DB_PASSWORD is required}@db-relay:5432/dcontact_uat?schema=public
      LINE_WEBHOOK_SECRET_SOURCE: file
      LINE_CREDENTIAL_DIR: /run/secrets
      # the pilot uses the UAT's own tenant (a UUID, not a slug); the UAT admin account can use the inbound page (#566)
      LINE_WEBHOOK_TENANT_ID: ${UAT_TENANT_ID:?UAT_TENANT_ID is required}
      LINE_WEBHOOK_CHANNEL_ACCOUNT_ID: ${UAT_LINE_CHANNEL_ACCOUNT_ID:?UAT_LINE_CHANNEL_ACCOUNT_ID is required}
      # may be empty on first enablement (the bot ID is unknown until `line-run ... bot-info` runs); line-webhook fails to boot if it is empty
      LINE_WEBHOOK_DESTINATION: ${UAT_LINE_DESTINATION:-}
      LINE_WEBHOOK_PAYLOAD_KEY_REF: ${UAT_LINE_PAYLOAD_KEY_REF:?UAT_LINE_PAYLOAD_KEY_REF is required}
      # #566: OIDC for the read API (/api/v1/line-pilot/*); same values as api
      KEYCLOAK_ISSUER: https://${UAT_HOST:?UAT_HOST is required}/auth/realms/dcontact
      KEYCLOAK_AUDIENCE: dcontact-api
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/dcontact/protocol/openid-connect/certs
    secrets:
      - line-channel-secret
      - line-webhook-payload-key
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/runtime-profile').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 384m
    networks:
      - internal

  line-pilot:
    profiles: ['line-pilot']
    image: ${OPS_IMAGE:?OPS_IMAGE (digest) is required}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    depends_on:
      db-relay:
        condition: service_healthy
      line-egress:
        condition: service_started
    working_dir: /app/node_modules/@d-contact/delivery
    # the first argument is the CLI name: line-pilot-setup | line-provider-runner | line-pilot-cli
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'cli="$$1"; shift; case "$$cli" in line-pilot-setup|line-provider-runner|line-pilot-cli) exec node "dist/$$cli.js" "$$@";; *) echo "unknown cli" >&2; exit 64;; esac',
        'line-pilot',
      ]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dcontact_app:${UAT_APP_DB_PASSWORD:?UAT_APP_DB_PASSWORD is required}@db-relay:5432/dcontact_uat?schema=public
      LINE_SECRET_SOURCE: file
      LINE_CREDENTIAL_DIR: /run/secrets
      LINE_PILOT_STATE_DIR: /var/lib/line-pilot
      LINE_PILOT_MIGRATIONS_DIR: /ops/prisma/migrations
      LINE_PILOT_REGISTRY_PATH: /ops/scripts/cxa-s2-readiness.mjs
      LINE_WEBHOOK_PAYLOAD_KEY_REF: ${UAT_LINE_PAYLOAD_KEY_REF:?UAT_LINE_PAYLOAD_KEY_REF is required}
      CXA_S2_PILOT_TENANT_ID: ${UAT_TENANT_ID:?UAT_TENANT_ID is required}
      CXA_S2_PILOT_SENDER: ${UAT_LINE_SENDER_IDENTITY_ID:-}
      CXA_S2_CREDENTIAL_REF_ID: ${UAT_LINE_CREDENTIAL_REF_ID:-}
      # per-command reference from the operator's shell (`NAME=... uat-deploy.sh line-run ...`); actor/digest are not secrets
      CXA_S2_OPERATOR_REF: ${CXA_S2_OPERATOR_REF:-}
      CXA_S2_COMPLIANCE_REF: ${CXA_S2_COMPLIANCE_REF:-}
      CXA_S2_CREDENTIAL_KIND: ${CXA_S2_CREDENTIAL_KIND:-}
      CXA_S2_LONG_LIVED_EXCEPTION_REF: ${CXA_S2_LONG_LIVED_EXCEPTION_REF:-}
      CXA_S2_APPROVED_WEBHOOK_ENDPOINT_DIGEST: ${CXA_S2_APPROVED_WEBHOOK_ENDPOINT_DIGEST:-}
      CXA_S2_EXPECTED_COMMIT_SHA: ${CXA_S2_EXPECTED_COMMIT_SHA:-}
      CXA_S2_MESSAGE_WAIT_SECONDS: ${CXA_S2_MESSAGE_WAIT_SECONDS:-300}
    secrets:
      - line-channel-access-token
      - line-channel-secret
      - line-webhook-payload-key
    volumes:
      - line-pilot-state:/var/lib/line-pilot
    tmpfs:
      - /tmp
    mem_limit: 512m
    # the runner's api.line.me = the relay; the certificate is still verified against LINE's real hostname
    extra_hosts:
      - 'api.line.me:172.30.65.2'
    networks:
      - internal
      - linepilot

  line-egress:
    profiles: ['line-pilot']
    image: docker.io/library/haproxy:3.0-alpine@sha256:7ee2f21c5baa25ceb5d01990b78d13a71e8468f5041ac2d69304747d4631407a
    restart: 'no'
    user: '99:99'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # listens on :443 without needing a capability; the runner connects to https://api.line.me with extra_hosts pointing at this fixed IP
    # never use a network alias `api.line.me`: Docker DNS would also answer the alias to the relay itself, sending traffic in a loop back to itself
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '0'
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 64m
    volumes:
      - ./haproxy-line-egress.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      linepilot:
        ipv4_address: 172.30.65.2
      lineegress: {}

secrets:
  line-channel-access-token:
    file: ${UAT_LINE_CREDENTIAL_DIR:-/opt/dcontact-uat/secrets/line}/line-channel-access-token
  line-channel-secret:
    file: ${UAT_LINE_CREDENTIAL_DIR:-/opt/dcontact-uat/secrets/line}/line-channel-secret
  line-webhook-payload-key:
    file: ${UAT_LINE_CREDENTIAL_DIR:-/opt/dcontact-uat/secrets/line}/line-webhook-payload-key

volumes:
  line-pilot-state: {}

networks:
  # the runner and the relay only; no direct internet egress
  linepilot:
    internal: true
    ipam:
      config:
        - subnet: 172.30.65.0/29
  # the relay's outbound side only
  lineegress: {}
