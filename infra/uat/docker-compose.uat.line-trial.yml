# #567 / ADR-031: overlay for the team trial period; stacks only on docker-compose.uat.line.yml
#
# `uat-deploy.sh` applies this file when both `$UAT_ROOT/line-pilot.enabled` and `$UAT_ROOT/line-team-trial.enabled` exist
# without the trial flag = line-webhook only receives webhooks/reads, as in #566 (no token, no internet egress)
#
# with the trial on = line-webhook additionally gets:
# - the access token (the same secret file as the runner) and the recipient from the runner's state, read-only
# - egress to api.line.me only through the `line-egress` relay (network `linepilot` + the relay's fixed IP)
# - a continuous inbox worker (the same lease as `pilot await-touch`)
services:
  line-webhook:
    environment:
      LINE_TEAM_TRIAL: 'on'
      LINE_WEBHOOK_WORKER: 'on'
      LINE_PILOT_STATE_DIR: /var/lib/line-pilot
      LINE_PILOT_SENDER_IDENTITY_ID: ${UAT_LINE_SENDER_IDENTITY_ID:?UAT_LINE_SENDER_IDENTITY_ID is required}
    secrets:
      - line-channel-access-token
    volumes:
      - line-pilot-state:/var/lib/line-pilot:ro
    extra_hosts:
      - 'api.line.me:172.30.65.2'
    depends_on:
      line-egress:
        condition: service_started
    networks:
      - internal
      - linepilot

  # during the trial the relay must run all the time (not only when the runner is invoked)
  line-egress:
    profiles: !reset []
    restart: unless-stopped
