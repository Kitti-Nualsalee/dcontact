services:
  proxy:
    ports: !override
      - '127.0.0.1:443:8443'
      - '127.0.0.1:80:8080'
    volumes: !override
      - ./Caddyfile.workspace-local:/etc/caddy/Caddyfile:ro
    mem_limit: 256m

  api:
    mem_limit: 1024m

  postgres:
    mem_limit: 512m

  keycloak:
    environment:
      JAVA_OPTS_KC_HEAP: '-Xms128m -Xmx768m'
    mem_limit: 1024m

  e1-sandbox:
    environment:
      DATABASE_URL: postgresql://dcontact_app:${UAT_APP_DB_PASSWORD:?UAT_APP_DB_PASSWORD is required}@postgres:5432/dcontact?schema=public
    mem_limit: 384m

  freeswitch:
    entrypoint: ['/bin/sh', '/e1-local-source/local-entrypoint.sh']
    ports: !override
      - '127.0.0.1:16384-16420:16384-16420/udp'
    volumes: !override
      - ./e1-freeswitch:/e1-local-source:ro
    tmpfs:
      - /e1-freeswitch:mode=0755
    mem_limit: 512m

  mailpit:
    image: docker.io/axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    networks:
      - internal

  mailpit-ui:
    image: ${CONSOLE_IMAGE:?CONSOLE_IMAGE (digest) is required}
    command:
      [
        '/usr/local/bin/caddy-uat',
        'run',
        '--config',
        '/etc/caddy/mailpit-local',
        '--adapter',
        'caddyfile',
      ]
    depends_on:
      - mailpit
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
      - /config:uid=10001,gid=10001,mode=0700
    volumes:
      - ./Caddyfile.mailpit-local:/etc/caddy/mailpit-local:ro
    ports:
      - '127.0.0.1:18025:8080'
    mem_limit: 128m
    networks:
      - edge
      - internal
