# #565 / ADR-031: ทางออก internet ของ LINE pilot — TCP passthrough (ไม่ terminate TLS) ไป api.line.me:443 เท่านั้น
# runner ตรวจ certificate ของ LINE เองตามปกติ; SNI อื่นหรือ traffic ที่ไม่ใช่ TLS ถูกตัดก่อนต่อออก
global
    log stdout format raw local0
    maxconn 50

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 30s

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend line_from_runner
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content reject unless { req.ssl_hello_type 1 }
    tcp-request content reject unless { req.ssl_sni -m str -i api.line.me }
    default_backend line_api

backend line_api
    server line api.line.me:443 resolvers docker init-addr last,libc,none
