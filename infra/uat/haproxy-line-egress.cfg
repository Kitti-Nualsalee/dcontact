# #565 / ADR-031: internet egress for the LINE pilot; TCP passthrough (no TLS termination) to api.line.me:443 only
# the runner verifies LINE's certificate itself as usual; any other SNI or non-TLS traffic is dropped before connecting out
global
    log stdout format raw local0
    maxconn 50

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 30s

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend line_from_runner
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content reject unless { req.ssl_hello_type 1 }
    tcp-request content reject unless { req.ssl_sni -m str -i api.line.me }
    default_backend line_api

backend line_api
    server line api.line.me:443 resolvers docker init-addr last,libc,none
