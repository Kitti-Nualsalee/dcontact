global
    log stdout format raw local0
    maxconn 100

defaults
    log global
    mode tcp
    option tcplog
    option clitcpka
    option srvtcpka
    clitcpka-idle 30s
    clitcpka-intvl 10s
    clitcpka-cnt 3
    srvtcpka-idle 30s
    srvtcpka-intvl 10s
    srvtcpka-cnt 3
    timeout connect 5s
    timeout client 8h
    timeout server 8h

frontend pg_from_internal
    bind :5432
    default_backend pg_vm3

backend pg_vm3
    option tcp-check
    server vm3 192.168.102.113:5432 check inter 5s fall 3 rise 2
