global
    log stdout format raw local0
    maxconn 100

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend pg_from_internal
    bind :5432
    default_backend pg_vm3

backend pg_vm3
    option tcp-check
    server vm3 192.168.102.113:5432 check inter 5s fall 3 rise 2
