# U1.6 (#434): the UAT stack for the UAT first slice on a single VM (production-shaped), per #373/#374
#
# contains only: proxy (Console + TLS), api (profile `uat`), Keycloak (production mode), Postgres,
# object storage (SeaweedFS, ADR-029/#540) + lifecycle
# no `apps/journey` worker, FreeSWITCH, Kafka/Redpanda or Redis; adding any of these services is a stop condition
#
# - no default credential values: every secret comes from the env file on the VM (`/opt/dcontact-uat/uat.env`)
#   in the form `${VAR:?...}`; if any is missing compose refuses to render
# - our images are referenced by digest (`${API_IMAGE}` etc. = `ghcr.io/...@sha256:...`) which the workflow writes into
#   `release.env`; external images pin their digest here
# - only the proxy opens ports to the host (443, and 80 for the redirect); the DB, object storage, Keycloak and api do not
# - services in the `ops` profile are one-shots that `infra/uat/bin/uat-deploy.sh` runs in order;
#   `object-storage-init` is a one-shot outside any profile because api must wait for it to finish successfully before booting (U1.5 #433)
#
# usage: docker compose --env-file uat.env --env-file release.env -f docker-compose.uat.yml ...
name: dcontact-uat

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '5'

services:
  proxy:
    <<: *hardening
    image: ${CONSOLE_IMAGE:?CONSOLE_IMAGE (digest) is required}
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      UAT_HOST: ${UAT_HOST:?UAT_HOST is required}
      UAT_ALLOWED_CIDRS: ${UAT_ALLOWED_CIDRS:?UAT_ALLOWED_CIDRS is required}
    ports:
      - '443:8443'
      - '80:8080'
    read_only: true
    tmpfs:
      - /data
      - /config
    secrets:
      - uat_tls_cert
      - uat_tls_key
    networks:
      - edge
      - internal

  api:
    <<: *hardening
    image: ${API_IMAGE:?API_IMAGE (digest) is required}
    depends_on:
      postgres:
        condition: service_healthy
      # U1.5 (#433): the API fails to boot if the evidence bucket is not ready; wait for object-storage-init (private bucket) first
      object-storage-init:
        condition: service_completed_successfully
    # U1.2 (#430): the uat profile structurally disables Kafka/LINE/egress; never add LINE_*, KAFKA_BROKERS, SIP_*
    environment:
      NODE_ENV: production
      DCONTACT_API_PROFILE: uat
      PORT: '3000'
      DATABASE_URL: postgresql://dcontact_app:${UAT_APP_DB_PASSWORD:?UAT_APP_DB_PASSWORD is required}@postgres:5432/dcontact?schema=public
      KEYCLOAK_ISSUER: https://${UAT_HOST:?UAT_HOST is required}/auth/realms/dcontact
      KEYCLOAK_AUDIENCE: dcontact-api
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/dcontact/protocol/openid-connect/certs
      DPHONE_EMBED_SCRIPT_URL: https://${UAT_HOST:?UAT_HOST is required}/workspace/embed/dphone-embed.js
      J5_CANVAS_WRITE_ENABLED: 'true'
      J5_PUBLISH_UI_ENABLED: 'true'
      J5_TEMPLATE_CATALOG_ENABLED: 'false'
      J5_TEMPLATE_UPGRADE_ENABLED: 'false'
      # U1.5 (#433) + #540: evidence storage; the API's own user (policy uat-evidence-api), not the storage root
      S3_ENDPOINT: http://object-storage:8333
      S3_ACCESS_KEY: ${UAT_S3_API_ACCESS_KEY:?UAT_S3_API_ACCESS_KEY is required}
      S3_SECRET_KEY: ${UAT_S3_API_SECRET_KEY:?UAT_S3_API_SECRET_KEY is required}
      S3_BUCKET_UAT_EVIDENCE: uat-evidence
    read_only: true
    networks:
      - internal

  keycloak:
    <<: *hardening
    # Keycloak 26.7.5 (#592) + the D-Contact login/email theme (#515/#522); built from infra/keycloak/Dockerfile
    image: ${KEYCLOAK_IMAGE:?KEYCLOAK_IMAGE (digest) is required}
    depends_on:
      postgres:
        condition: service_healthy
    # production mode (`start`) behind the proxy: TLS terminates at the proxy, Keycloak listens on plain http inside the network only
    # the realm is not imported at boot; `u1-uat-keycloak-users.mjs --config` creates/reconciles it from the rendered template
    command:
      - start
      - --features=organization
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${UAT_KEYCLOAK_DB_PASSWORD:?UAT_KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: https://${UAT_HOST:?UAT_HOST is required}/auth
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${UAT_KEYCLOAK_ADMIN_USERNAME:?UAT_KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${UAT_KEYCLOAK_ADMIN_PASSWORD:?UAT_KEYCLOAK_ADMIN_PASSWORD is required}
    # #680: check the status line = 200 (ready answers 503 when DOWN); never grep the word UP across the whole body because during bootstrap
    # a sub-check such as "Graceful Shutdown" is UP even while the overall status is still DOWN
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 && grep -m 1 '^HTTP/' <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - internal

  postgres:
    <<: *hardening
    image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${UAT_POSTGRES_USER:?UAT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${UAT_POSTGRES_PASSWORD:?UAT_POSTGRES_PASSWORD is required}
      POSTGRES_DB: dcontact
    command: postgres -c max_connections=100
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d dcontact']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  # U1.5 (#433) + #540 (ADR-029): UAT evidence on SeaweedFS; a private bucket `uat-evidence`
  # `weed server -s3` (not `weed mini`, which opens admin/worker gRPC without mTLS; spike #539)
  # s3.json (root identity + uat-evidence-api and its policy) is created in tmpfs by the entrypoint; secrets never land on a volume
  # 90-day retention is a lifecycle the API sets at boot, and `object-storage-lifecycle` runs the pass; no port is opened to the host
  object-storage:
    <<: *hardening
    image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # skip the image entrypoint (it uses su-exec, which needs a capability); run directly as user seaweed
    user: '1000:1000'
    entrypoint: ['/bin/sh', '/uat/object-storage-entrypoint.sh']
    environment:
      UAT_S3_ROOT_ACCESS_KEY: ${UAT_S3_ROOT_ACCESS_KEY:?UAT_S3_ROOT_ACCESS_KEY is required}
      UAT_S3_ROOT_SECRET_KEY: ${UAT_S3_ROOT_SECRET_KEY:?UAT_S3_ROOT_SECRET_KEY is required}
      UAT_S3_API_ACCESS_KEY: ${UAT_S3_API_ACCESS_KEY:?UAT_S3_API_ACCESS_KEY is required}
      UAT_S3_API_SECRET_KEY: ${UAT_S3_API_SECRET_KEY:?UAT_S3_API_SECRET_KEY is required}
    volumes:
      - object-storage-data:/data
      - ./bin/object-storage-entrypoint.sh:/uat/object-storage-entrypoint.sh:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - internal

  # #540: SeaweedFS 4.48 does not run the lifecycle pass itself (spike #539); this service runs it every 1 hour
  # and deletes objects that have reached their date per the bucket rule (uat-evidence/ 90 days)
  object-storage-lifecycle:
    <<: *hardening
    image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: '1000:1000'
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      HOME: /tmp
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        echo "s3.lifecycle.run-shard -shards 0-15 -s3 object-storage:18333 -events 0 -refresh 1h"
        | exec /usr/bin/weed shell -master=object-storage:9333
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal

  # ── operator one-shots ─────────────────────────────────────────────────────────────

  # every deploy (not in the ops profile because api waits for it to finish): private bucket via the S3 API with root
  # the API's permissions come from the policy in object-storage's s3.json; no user is created through the vendor CLI
  object-storage-init:
    image: ${OPS_IMAGE:?OPS_IMAGE (digest) is required}
    restart: 'no'
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://object-storage:8333
      UAT_S3_ROOT_ACCESS_KEY: ${UAT_S3_ROOT_ACCESS_KEY:?UAT_S3_ROOT_ACCESS_KEY is required}
      UAT_S3_ROOT_SECRET_KEY: ${UAT_S3_ROOT_SECRET_KEY:?UAT_S3_ROOT_SECRET_KEY is required}
    command: ['node', 'scripts/uat-object-storage.mjs', 'init']
    networks:
      - internal

  # creates the Keycloak role/database and sets the application role's password from a secret (does not use the value from rls.sql)
  db-roles:
    profiles: ['ops']
    image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: dcontact
      PGUSER: ${UAT_POSTGRES_USER:?UAT_POSTGRES_USER is required}
      PGPASSWORD: ${UAT_POSTGRES_PASSWORD:?UAT_POSTGRES_PASSWORD is required}
      UAT_KEYCLOAK_DB_PASSWORD: ${UAT_KEYCLOAK_DB_PASSWORD:?UAT_KEYCLOAK_DB_PASSWORD is required}
      UAT_APP_DB_PASSWORD: ${UAT_APP_DB_PASSWORD:?UAT_APP_DB_PASSWORD is required}
    entrypoint: ['/bin/sh', '/uat/db-roles.sh']
    volumes:
      - ./bin/db-roles.sh:/uat/db-roles.sh:ro
    networks:
      - internal

  # additive migrations only (`prisma migrate deploy`) then apply rls.sql; there is no down migration
  migrate:
    profiles: ['ops']
    image: ${OPS_IMAGE:?OPS_IMAGE (digest) is required}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${UAT_POSTGRES_USER:?UAT_POSTGRES_USER is required}:${UAT_POSTGRES_PASSWORD:?UAT_POSTGRES_PASSWORD is required}@postgres:5432/dcontact?schema=public
    command:
      - /bin/sh
      - -ec
      - prisma migrate deploy --schema prisma/schema.prisma && prisma db execute --file prisma/rls.sql --schema prisma/schema.prisma
    networks:
      - internal

  # realm/client/Organization/OTP and the maker/reviewer accounts through the admin REST inside the network
  keycloak-config:
    profiles: ['ops']
    image: ${OPS_IMAGE:?OPS_IMAGE (digest) is required}
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_USERNAME: ${UAT_KEYCLOAK_ADMIN_USERNAME:?UAT_KEYCLOAK_ADMIN_USERNAME is required}
      KEYCLOAK_ADMIN_PASSWORD: ${UAT_KEYCLOAK_ADMIN_PASSWORD:?UAT_KEYCLOAK_ADMIN_PASSWORD is required}
      DPHONE_EMBED_ORIGIN: https://${UAT_HOST:?UAT_HOST is required}
      DPHONE_EMBED_TEMPLATE_CLIENT: dcontact-uat-console
      UAT_HOST: ${UAT_HOST:?UAT_HOST is required}
      UAT_TENANT_ID: ${UAT_TENANT_ID:?UAT_TENANT_ID is required}
      UAT_TENANT_SLUG: ${UAT_TENANT_SLUG:?UAT_TENANT_SLUG is required}
      UAT_ADDITIONAL_TENANT_SLUGS: ${UAT_ADDITIONAL_TENANT_SLUGS}
      UAT_CONSOLE_EXPECTED_REDIRECT_DIGEST: ${UAT_CONSOLE_EXPECTED_REDIRECT_DIGEST}
      UAT_TENANT_NAME: ${UAT_TENANT_NAME:?UAT_TENANT_NAME is required}
      UAT_ORGANIZATION_DOMAIN: ${UAT_ORGANIZATION_DOMAIN:?UAT_ORGANIZATION_DOMAIN is required}
    # AC6 (#599): branding (displayName, account theme, baseUrl of the account clients, internal attributes users cannot see) appended to the existing realm script
    command:
      - /bin/sh
      - -ec
      - node scripts/u1-uat-keycloak-users.mjs --config && node scripts/keycloak-dphone-embedded-setup.mjs && node scripts/keycloak-branding-setup.mjs
    networks:
      - internal

  # U1.8 (#502): tenant, owner team, maker-reviewer users/subject/grant, Journey authoring rollout and
  # the UAT fixture pack from the operator's `UatProvisionV1` input file (sent via stdin by `uat-deploy.sh provision`)
  # same owner connection as migrate; the CLI refuses on its own if current_user is an application role (dcontact_app)
  uat-provision:
    profiles: ['ops']
    image: ${OPS_IMAGE:?OPS_IMAGE (digest) is required}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${UAT_POSTGRES_USER:?UAT_POSTGRES_USER is required}:${UAT_POSTGRES_PASSWORD:?UAT_POSTGRES_PASSWORD is required}@postgres:5432/dcontact?schema=public
      UAT_TENANT_ID: ${UAT_TENANT_ID:?UAT_TENANT_ID is required}
      UAT_TENANT_SLUG: ${UAT_TENANT_SLUG:?UAT_TENANT_SLUG is required}
    entrypoint: ['node', '/app/dist/uat-provision-main.js']
    # the safe default = --check (no writes); `uat-deploy.sh provision` passes the real arguments instead
    command:
      - --check
      - --input
      - '-'
    networks:
      - internal

  # E1.16 (#490): the operator enables/disables the dphone embed through the existing domain CLI so the flag + audit are written in one transaction
  tenant-ui-flag:
    profiles: ['ops']
    image: ${OPS_IMAGE:?OPS_IMAGE (digest) is required}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLATFORM_DATABASE_URL: postgresql://${UAT_POSTGRES_USER:?UAT_POSTGRES_USER is required}:${UAT_POSTGRES_PASSWORD:?UAT_POSTGRES_PASSWORD is required}@postgres:5432/dcontact?schema=public
    entrypoint: ['node', '/platform-control/dist/ui-flag-main.js']
    networks:
      - internal

secrets:
  uat_tls_cert:
    file: ${UAT_TLS_CERT_FILE:?UAT_TLS_CERT_FILE is required}
  uat_tls_key:
    file: ${UAT_TLS_KEY_FILE:?UAT_TLS_KEY_FILE is required}

volumes:
  postgres-data:
  object-storage-data:

networks:
  edge: {}
  # internal services have no internet egress (providerEgress is also BLOCKED at the network level)
  internal:
    internal: true
