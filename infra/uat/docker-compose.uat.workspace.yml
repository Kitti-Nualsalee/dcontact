# #684: opt-in บน E1; API และ static SPA จริงสำหรับสอง Workspace
services:
  proxy:
    environment:
      UAT_WORKSPACE_HOST: ${UAT_WORKSPACE_HOST:?UAT_WORKSPACE_HOST is required}
  api:
    command: ['node', 'dist/workspace-uat-main.js']
    environment:
      DCONTACT_API_PROFILE: uat-workspace
      TENANT_PEOPLE_BINDINGS_JSON: ${UAT_TENANT_PEOPLE_BINDINGS_JSON:-}
      TENANT_PEOPLE_WORKER_DATABASE_URL: ${UAT_TENANT_PEOPLE_WORKER_DATABASE_URL:-}
      TENANT_PEOPLE_SECRET_UAT: ${UAT_TENANT_PEOPLE_SECRET_UAT:-}
      TENANT_PEOPLE_INVITATIONS_ENABLED: ${UAT_TENANT_PEOPLE_INVITATIONS_ENABLED:-false}
      TENANT_PEOPLE_DISABLE_ENABLED: ${UAT_TENANT_PEOPLE_DISABLE_ENABLED:-false}
      DCONTACT_RESERVED_ORIGINS: https://${UAT_HOST:?UAT_HOST is required},https://${UAT_WORKSPACE_HOST:?UAT_WORKSPACE_HOST is required}
  keycloak-config:
    environment:
      UAT_WORKSPACE_HOST: ${UAT_WORKSPACE_HOST:?UAT_WORKSPACE_HOST is required}
